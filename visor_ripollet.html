<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripollet: risc d'inundació</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe0f5; font-family: system-ui, sans-serif;
               touch-action: none; user-select: none; }
  .panel { position: fixed; top: 12px; left: 12px; right: 12px; max-width: 460px; padding: 10px 14px;
           background: rgba(0,0,0,.6); color: #fff; border-radius: 8px; font-size: 14px; line-height: 1.4; }
  .panel b { color: #ffd166; }
  .botones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border: 0; border-radius: 6px; cursor: pointer;
           background: rgba(255,255,255,.18); color: #fff; }
  button:hover { background: #2f5fa8; }
  button.principal { background: #d64545; font-weight: 600; }
  #idioma { float: right; font-weight: 700; padding: 2px 8px; }
  #hud, #lluvia, #riesgo { display: none; }
  #lluvia, #riesgo, .herramienta { left: auto; right: 12px; max-width: 360px; max-height: calc(100vh - 40px); overflow: auto; }
  .herramienta { display: none; }
  .herramienta label { display: block; margin-top: 8px; }
  .herramienta ol, .herramienta ul { margin: 6px 0 0; padding-left: 20px; }
  .herramienta li[data-x] { cursor: pointer; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; margin-top: 6px; }
  .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; }
  #lluvia label, #riesgo label { display: block; margin-top: 8px; }
  input[type=range] { width: 100%; }
  select { font: inherit; font-size: 13px; margin-left: 4px; max-width: 100%; }
  .valor { color: #9fd3ff; }
  .nota { font-size: 12px; opacity: .8; margin-top: 8px; }
  #tormentas, #listaPuntos, #listaEquip { margin: 6px 0 0; padding-left: 20px; }
  #tormentas button { padding: 0 6px; margin-left: 6px; }
  #listaPuntos li { cursor: pointer; }
  #listaPuntos li:hover { color: #ffd166; }
  .resumen { margin-top: 8px; padding: 6px 8px; background: rgba(255,255,255,.08); border-radius: 6px; }
  .c1 { color: #ffd166; } .c2 { color: #ff7b7b; }
  #velocidad { position: fixed; right: 16px; bottom: 34px; padding: 8px 16px; border-radius: 10px;
               background: rgba(0,0,0,.6); color: #fff; font-size: 28px; font-weight: 700; display: none; }
  #velocidad small { font-size: 14px; font-weight: 400; opacity: .8; }
  #tactil { position: fixed; left: 0; right: 0; bottom: 16px; display: none; justify-content: space-between;
            padding: 0 16px; pointer-events: none; }
  #tactil div { display: flex; gap: 10px; pointer-events: auto; }
  #tactil button { width: 64px; height: 64px; font-size: 26px; border-radius: 50%; background: rgba(0,0,0,.45); }
  .etiqueta { padding: 3px 8px; border-radius: 10px; background: rgba(20,30,50,.75); color: #fff;
              font-size: 13px; white-space: nowrap; pointer-events: none; }
  .marca { width: 24px; height: 24px; border-radius: 50%; background: #d7263d; color: #fff; font: 700 13px system-ui;
           display: grid; place-items: center; border: 2px solid #fff; cursor: pointer; pointer-events: auto; }
  details { margin-top: 10px; padding: 6px 8px; background: rgba(255,255,255,.06); border-radius: 6px; }
  summary { cursor: pointer; color: #ffd166; font-weight: 600; }
  button.activo { background: #2f9e5a; }
  input[type=text], input[type=date] { font: inherit; font-size: 13px; padding: 2px 4px; }
  #listaMedidas, #listaIncidencias { margin: 6px 0 0; padding-left: 20px; }
  #listaMedidas button, #listaIncidencias button { padding: 0 6px; margin-left: 6px; }
  #listaIncidencias li { cursor: pointer; }
  .pin { width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff;
         pointer-events: auto; cursor: pointer; }
  .icono { font-size: 18px; pointer-events: none; text-shadow: 0 0 3px #000; }
  #explicacion { position: fixed; left: 12px; bottom: 34px; max-width: 420px; display: none; top: auto; right: auto; }
  #explicacion ul { margin: 6px 0; padding-left: 18px; }
  #cargando { position: fixed; inset: 0; display: grid; place-items: center; background: #bfe0f5; color: #234;
              font-size: 18px; z-index: 10; }
  #medicion { position: fixed; inset: 0; margin: auto; width: min(640px, calc(100vw - 32px)); height: fit-content;
              max-height: calc(100vh - 40px); overflow: auto; display: none; top: 0; left: 0; right: 0; bottom: 0; }
  #medicion table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  #medicion td, #medicion th { border-bottom: 1px solid rgba(255,255,255,.2); padding: 4px 6px; text-align: right; }
  #medicion td:first-child, #medicion th:first-child { text-align: left; }
  #grano { position: fixed; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: multiply; transition: opacity .4s;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.25 0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  body.arte #grano { opacity: .3; }
  #osm { position: fixed; right: 8px; bottom: 6px; font-size: 12px; color: #234; background: rgba(255,255,255,.7);
         padding: 2px 6px; border-radius: 4px; }
  #osm a { color: inherit; }
  #informe { display: none; }
  /* MAQUETA PÍXEL: interfaz clara con letra de píxel (como un diorama de pixel art) */
  body.claro, body.claro #cargando { background: #eef0f4; }
  body.claro .panel { background: rgba(251,251,253,.95); color: #1d2230; border: 1px solid #d6d9e0; border-radius: 3px;
                      box-shadow: 0 3px 0 rgba(20,24,40,.08); }
  body.claro .panel b, body.claro .c1, body.claro #listaPuntos li:hover { color: #b4441f; }
  body.claro summary { color: #1d2230; font: 400 11px "Silkscreen", monospace; text-transform: uppercase; letter-spacing: .05em; }
  body.claro .panel > b:first-child { font: 400 13px "Silkscreen", monospace; text-transform: uppercase; color: #1d2230; }
  body.claro button { background: #fff; color: #1d2230; border: 1px solid #cdd1da; border-radius: 2px; }
  body.claro button:hover { background: #e9ecf2; }
  body.claro button.principal { background: #16181d; color: #fff; border-color: #16181d; }
  body.claro button.activo { background: #2f9e5a; color: #fff; }
  body.claro details, body.claro .resumen { background: #f3f4f7; border: 1px solid #e3e5eb; border-radius: 2px; }
  body.claro .valor { color: #1f5fa8; } body.claro .c2 { color: #c62828; }
  body.claro .etiqueta { background: #fff; color: #1d2230; border: 2px solid #1d2230; border-radius: 0;
                         font: 400 10px "Silkscreen", monospace; text-transform: uppercase; }
  body.claro #velocidad { background: #16181d; font-family: "Silkscreen", monospace; }
  body.claro #osm { background: rgba(255,255,255,.9); }
  body.claro #medicion td, body.claro #medicion th { border-bottom-color: #dde0e6; }
  .tituloPixel { display: none; }
  body.claro .tituloPixel { display: block; }
  body.claro .tituloPixel small { font: 400 9px "Silkscreen", monospace; letter-spacing: .12em; color: #6b7184; }
  body.claro .tituloPixel div { font: 700 30px/1 "Silkscreen", monospace; color: #16181d; margin: 2px 0 4px; letter-spacing: .02em; }
  body.claro #idioma { position: relative; }
  body.claro #mapa { max-width: 400px; font-size: 13px; }
  body.claro #mapa .botones button { padding: 4px 8px; }
  #vista { margin-top: 8px; }
  #vista label { display: inline-block; margin-right: 10px; font-size: 13px; }

  /* ===== INTERFAZ: barra superior, navegación por secciones y hojas (pensada primero para el móvil) ===== */
  #barra, #nav { display: flex; align-items: center; }
  #barra { top: 12px; left: 12px; right: auto; width: 420px; max-width: none; gap: 8px; padding: 8px 12px;
           border-radius: 10px 10px 0 0; z-index: 4; }
  .marcaApp { flex: 1; display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
  .marcaApp b { font-size: 18px; letter-spacing: .02em; color: inherit; }
  .marcaApp small { font-size: 10px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.claro .marcaApp b { font: 700 20px/1 "Silkscreen", monospace; color: #16181d; }
  body.claro .marcaApp small { font: 400 8px "Silkscreen", monospace; letter-spacing: .1em; }
  .chip { border-radius: 999px !important; padding: 4px 10px !important; font-size: 13px; white-space: nowrap; }
  #idioma { float: none; }
  #nav { top: 60px; left: 12px; right: auto; width: 420px; max-width: none; gap: 4px; padding: 4px 8px 8px;
         border-radius: 0; z-index: 4; }
  #nav button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 4px;
                font-size: 13px; }
  #nav button.activo { background: #2f5fa8; color: #fff; }
  body.claro #nav button.activo { background: #16181d; color: #fff; border-color: #16181d; }
  #nav .ico { font-size: 16px; }
  #mapa { top: 104px; left: 12px; right: auto; width: 420px; max-width: none; max-height: calc(100vh - 130px);
          overflow: auto; border-radius: 0 0 10px 10px; display: none; }
  #mapa.abierta { display: block; }
  #mapa section[hidden] { display: none; }
  .subtitulo { margin: 12px 0 0; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .75; }
  .rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .rejilla button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
                    min-height: 70px; padding: 8px 4px; font-size: 12px; line-height: 1.2; text-align: center;
                    white-space: normal; border-radius: 10px !important; }
  .rejilla button .ico { font-size: 24px; line-height: 1; }
  .rejilla.grandes button { color: #fff !important; font-weight: 600; border: 0 !important; }
  #conducir { background: #d64545 !important; } #abrirLluvia { background: #3b6fb6 !important; } #abrirRiesgo { background: #b8326a !important; }
  .asa { display: none; }
  .pista { position: fixed; left: 50%; transform: translateX(-50%); bottom: 76px; z-index: 8; padding: 10px 16px;
           border-radius: 999px; background: rgba(20,24,40,.9); color: #fff; font-size: 14px; display: none;
           box-shadow: 0 4px 16px rgba(0,0,0,.25); white-space: nowrap; }
  body.conduciendo #barra, body.conduciendo #nav, body.conduciendo #mapa { display: none !important; }
  @media (max-width: 760px) {
    #barra { top: 0; left: 0; right: 0; width: auto; border-radius: 0; padding: 6px 12px;
             padding-top: max(6px, env(safe-area-inset-top)); }
    #nav { top: auto; bottom: 0; left: 0; right: 0; width: auto; padding: 4px 4px max(4px, env(safe-area-inset-bottom));
           border-radius: 0; gap: 0; z-index: 7; }
    #nav button { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 2px; background: none !important;
                  border: 0 !important; border-radius: 8px !important; }
    #nav .ico { font-size: 22px; }
    #nav button.activo { color: #ffd166 !important; }
    body.claro #nav button.activo { color: #b4441f !important; }
    #nav button.activo .ico { transform: scale(1.12); }
    /* Hojas desde abajo: la del menú y las de las herramientas */
    #mapa, #lluvia, #riesgo, .herramienta, #explicacion {
      top: auto !important; left: 0 !important; right: 0 !important; bottom: 62px !important; width: auto !important;
      max-width: none !important; max-height: 50vh; border-radius: 18px 18px 0 0 !important; padding: 4px 14px 12px;
      box-shadow: 0 -6px 24px rgba(0,0,0,.18); z-index: 6; }
    #mapa { max-height: 64vh; }
    .mini { max-height: 56px !important; overflow: hidden !important; }
    .completa { max-height: calc(100vh - 130px) !important; }
    .asa { display: block; height: 22px; margin: 0 -14px 2px; cursor: pointer; position: relative; touch-action: manipulation; }
    .asa::before { content: ""; position: absolute; left: 50%; top: 8px; width: 44px; height: 5px; margin-left: -22px;
                   border-radius: 3px; background: currentColor; opacity: .35; }
    .rejilla { grid-template-columns: repeat(3, 1fr); }
    #osm { bottom: 66px; font-size: 10px; }
    .etiqueta { font-size: 10px; padding: 2px 6px; }
    #explicacion { display: none; }
  }

  @media print {
    html, body { overflow: visible; height: auto; background: #fff; }
    body > *:not(#informe) { display: none !important; }
    #informe { display: block; color: #000; font: 11pt/1.4 system-ui, sans-serif; }
    #informe h1 { font-size: 17pt; margin: 0 0 4px; }
    #informe h2 { font-size: 12pt; margin: 14px 0 4px; border-bottom: 1px solid #999; }
    #informe img { width: 100%; border: 1px solid #ccc; }
    #informe table { border-collapse: collapse; width: 100%; }
    #informe td, #informe th { border-bottom: 1px solid #ccc; padding: 2px 4px; text-align: left; }
    #informe .aviso { border: 1px solid #c00; padding: 6px; margin-top: 10px; }
  }
</style>

<body>
<div id="cargando" data-t="cargando"></div>
<header id="barra" class="panel">
  <div class="marcaApp"><b>Ripollet</b><small data-t="kicker"></small></div>
  <button id="chipTiempo" class="chip"></button>
  <button id="idioma"></button>
</header>
<nav id="nav" class="panel">
  <button data-sec="explorar"><span class="ico">🗺</span><span data-t="navExplorar"></span></button>
  <button data-sec="herramientas"><span class="ico">🧰</span><span data-t="navHerramientas"></span></button>
  <button data-sec="riesgo"><span class="ico">⚠️</span><span data-t="navRiesgo"></span></button>
  <button data-sec="ajustes"><span class="ico">⚙️</span><span data-t="navAjustes"></span></button>
</nav>
<div id="mapa" class="panel"><div class="asa"></div>
  <section data-sec="explorar">
    <p class="nota" style="margin-top:4px"><span data-t="titulo"></span> <span id="ayuda" data-t="ayudaMapa"></span></p>
    <div class="rejilla grandes"><button id="conducir" data-t="conducir"></button>
      <button id="abrirLluvia" data-t="lluvia"></button><button id="abrirRiesgo" data-t="riesgo"></button></div>
    <p class="subtitulo" data-t="navIr"></p>
    <div class="botones" id="ir"></div>
  </section>
  <section data-sec="herramientas" hidden><div class="rejilla" id="herramientas"></div></section>
  <section data-sec="ajustes" hidden>
    <div id="tiempoReal"></div>
    <div id="trafico"></div>
    <div class="botones"><button id="arte"></button></div>
    <details id="vista" open></details>
  </section>
</div>
<div class="pista" id="pista"></div>

<div id="hud" class="panel"><span data-t="hud1"></span><br><span data-t="hud2"></span>
<div class="botones"><button id="camara" data-t="camara"></button><button id="reiniciar" data-t="salida"></button>
<button id="arteCoche" data-t="estiloV"></button><button id="salir" data-t="salir"></button></div></div>
<div id="velocidad">0 <small>km/h</small></div>
<div id="tactil"><div><button data-tecla="ArrowLeft">◀</button><button data-tecla="ArrowRight">▶</button></div>
<div><button data-tecla="ArrowDown">▼</button><button data-tecla="ArrowUp">▲</button></div></div>

<div id="lluvia" class="panel"><b data-t="tituloLluvia"></b>
<button class="cerrar" style="float:right">✕</button><br><span data-t="ayudaLluvia"></span>
<label><span data-t="intensidad"></span>: <span class="valor" id="vIntensidad"></span>
<input type="range" id="intensidad" min="10" max="300" step="10" value="100"></label>
<label><span data-t="radio"></span>: <span class="valor" id="vRadio"></span>
<input type="range" id="radio" min="50" max="600" step="10" value="200"></label>
<label><span data-t="velocidadSim"></span>: <span class="valor" id="vPasos"></span>
<input type="range" id="pasos" min="1" max="80" value="24"></label>
<label><span data-t="ver"></span>: <select id="vista"><option value="0" data-t="aguaAhora"></option>
<option value="1" data-t="inundMax"></option></select></label>
<ol id="tormentas"></ol>
<div class="botones"><button id="colocar" class="principal"></button><button id="pausa"></button>
<button id="quitar" data-t="quitar"></button><button id="secar" data-t="secar"></button></div>
<div id="estadoLluvia" class="nota"></div></div>

<div id="riesgo" class="panel"><b data-t="tituloRiesgo"></b>
<button class="cerrar" style="float:right">✕</button><br><span data-t="queEs"></span>
<label><span data-t="escenario"></span> <select id="escenario"></select></label>
<label><span data-t="fuente"></span> <select id="fuente"><option value="fisica" data-t="fuenteFisica"></option>
<option value="neutro" data-t="fuenteNeutro"></option></select></label>
<label id="filaOficial"><input type="checkbox" id="verOficial"> <span data-t="verOficial"></span></label>
<div class="resumen" id="resumenRiesgo"></div>
<div style="margin-top:8px"><b data-t="puntos"></b></div><ol id="listaPuntos"></ol>
<div style="margin-top:8px"><b data-t="equipamientos"></b></div><ul id="listaEquip"></ul>
<div class="botones"><button id="comprobar"></button><button id="imprimir" data-t="informe"></button>
<button id="verMedicion" data-t="medicion"></button></div>
<div id="estadoComprobacion" class="nota"></div>

<details id="medidas"><summary data-t="tituloMedidas"></summary>
<div class="nota" data-t="ayudaMedidas"></div>
<div class="botones"><button data-herr="deposito" data-t="hDeposito"></button>
<button data-herr="permeable" data-t="hPermeable"></button><button data-herr="imbornal" data-t="hImbornal"></button></div>
<label><span data-t="radioMedida"></span>: <span class="valor" id="vRadioMedida"></span>
<input type="range" id="radioMedida" min="10" max="120" step="5" value="30"></label>
<label><span id="nombreValorMedida"></span>: <span class="valor" id="vValorMedida"></span>
<input type="range" id="valorMedida"></label>
<label><span data-t="alcantarillado"></span>: <span class="valor" id="vAlcantarillado"></span>
<input type="range" id="alcantarillado" min="0" max="40" step="5" value="0"></label>
<ol id="listaMedidas"></ol>
<div class="botones"><button id="simularMedidas" class="principal" data-t="simularMedidas"></button>
<button id="quitarMedidas" data-t="quitarMedidas"></button></div>
<div id="estadoMedidas" class="nota"></div></details>

<details id="incidencias"><summary data-t="tituloIncidencias"></summary>
<div class="nota" data-t="ayudaIncidencias"></div>
<label><span data-t="gravedad"></span> <select id="incGravedad"><option value="2" data-t="incInundado"></option>
<option value="1" data-t="incCharco"></option></select></label>
<label><span data-t="lluviaEpisodio"></span> <select id="incIntensidad"></select></label>
<label><span data-t="fecha"></span> <input type="date" id="incFecha"></label>
<label><span data-t="nota"></span> <input type="text" id="incNota" maxlength="120" style="width:95%"></label>
<div class="botones"><button id="incMarcar" class="principal"></button><button id="incExportar" data-t="exportar"></button>
<button id="incImportar" data-t="importar"></button><input type="file" id="incArchivo" accept=".json,application/json" hidden></div>
<ol id="listaIncidencias"></ol>
<div id="estadoIncidencias" class="nota"></div></details>
<div class="nota" data-t="aviso"></div></div>

<div id="explicacion" class="panel"></div>
<div id="medicion" class="panel"></div>
<div id="informe"></div>
<div id="grano"></div>
<div id="osm">© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> · ICGC · AMB · Catastro · <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MapControls } from "three/addons/controls/MapControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { GPUComputationRenderer } from "three/addons/misc/GPUComputationRenderer.js";
/*__MODULOS__*/
// ===== visor =====
const DATOS = __DATOS__;          // lugares, equipamientos, calles, tamaños (datos_visor/datos.json)
const BLOBS = __BLOBS__;          // binarios comprimidos (null en la versión web: se piden aparte)
const GLB = "__GLB__";
const MEMORIA = __MEMORIA__;      // lo que aprendió Neutro (entrenar_neutro.mjs)
const MEDICION = __MEDICION__;    // cómo se midió Neutro frente a un rival clásico
const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------ idiomas (castellano / catalán)
const TEXTOS = {
  es: {
    cargando: "Cargando Ripollet…",

// CAPA DE CUBIERTAS (2 m): mapa solar, edificios en la franja de incendio… encima de tejados y azoteas
const datosCapaTechos = new Uint8Array((S1.nx / 2) * (S1.ny / 2) * 4);

const capaTechosActiva = { value: 0 };
const uniformesTechos = () => ({ tCapaTechos: { value: texCapaTechos }, uCapaTechosActiva: capaTechosActiva,
  uOrigen1m: { value: new THREE.Vector2(SIM.x0, SIM.z0) }, uTam1m: { value: new THREE.Vector2(S1.nx, S1.ny) } });
const GLSL_TECHOS = `
  uniform sampler2D tCapaTechos;
  uniform vec2 uOrigen1m, uTam1m;
  uniform float uCapaTechosActiva;
  vec3 conTechos(vec3 c) {
    vec4 k = texture2D(tCapaTechos, (vMundo.xz - uOrigen1m) / uTam1m);
    return mix(c, k.rgb, k.a * uCapaTechosActiva);
  }
`;
const uniformesAceras = () => ({ tSuelo1m: { value: texSuelo1m }, uOrigen1m: { value: new THREE.Vector2(SIM.x0, SIM.z0) },
                                 uTam1m: { value: new THREE.Vector2(S1.nx, S1.ny) },
                                 tCapa1m: { value: texCapa1m }, uCapa1mActiva: capa1mActiva });
const GLSL_ACERAS = `
  uniform sampler2D tSuelo1m, tCapa1m;
  uniform vec2 uOrigen1m, uTam1m;
  uniform float uCapa1mActiva;
  vec3 conCapa(vec3 c) {   // la capa de la herramienta abierta, encima del suelo
    vec4 k = texture2D(tCapa1m, (vMundo.xz - uOrigen1m) / uTam1m);

const VERTICE_MUNDO = ["#include <project_vertex>", `#include <project_vertex>
  #ifdef USE_INSTANCING

/** Suelo realista: panot (la textura de las aceras peatonales) y asfalto con grano donde dicen los bordillos. */
function pintarAceras(material, panot) {
  material.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, uniformesAceras(), { tPanot: { value: panot } });
    s.vertexShader = "varying vec3 vMundo;\n" + s.vertexShader.replace(...VERTICE_MUNDO);
    s.fragmentShader = "varying vec3 vMundo;\nuniform sampler2D tPanot;\n" + GLSL_ACERAS + s.fragmentShader.replace(
      "#include <map_fragment>", `#include <map_fragment>
      {
        float t = tipoSuelo();
        if (t > 0.75) {
          float g = fract(sin(dot(floor(vMundo.xz * 3.0), vec2(12.9898, 78.233))) * 43758.5453);
          diffuseColor.rgb = vec3(0.07, 0.075, 0.085) * (0.85 + 0.3 * g);     // asfalto con grano
        } else if (t > 0.25) diffuseColor.rgb = texture2D(tPanot, vec2(vMundo.x, -vMundo.z) / 2.0).rgb;   // panot
        diffuseColor.rgb = conCapa(diffuseColor.rgb);
      }`);
  };
  material.customProgramCacheKey = () => "suelo-aceras";
  material.needsUpdate = true;
}

/** Cubiertas realistas: la capa de cubiertas de la herramienta abierta, encima de la textura. */
function pintarTechos(material) {
  material.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, uniformesTechos());
    s.vertexShader = "varying vec3 vMundo;\n" + s.vertexShader.replace(...VERTICE_MUNDO);
    s.fragmentShader = "varying vec3 vMundo;\n" + GLSL_TECHOS + s.fragmentShader.replace(
      "#include <map_fragment>", "#include <map_fragment>\n diffuseColor.rgb = conTechos(diffuseColor.rgb);");
  };
  material.customProgramCacheKey = () => "techos";
  material.needsUpdate = true;
}

{

    pino: [new THREE.ConeGeometry(1, 1, 5, 1, true), mat("copa_pino", [0.18, 0.42, 0.24])],

    bola_copa: [new THREE.IcosahedronGeometry(1, 1), mat("copa", [0.30, 0.58, 0.28])],
    bola_copa_clara: [new THREE.IcosahedronGeometry(1, 1), mat("copa_clara", [0.50, 0.70, 0.30])],
    arbusto: [new THREE.IcosahedronGeometry(1, 0), mat("arbusto", [0.48, 0.58, 0.30])],
  };
  const matrices = Object.fromEntries(Object.keys(formas).map((k) => [k, []]));
  const m = new THREE.Matrix4();
  for (let k = 0; k < n; k++) {
    const x = A[k * 5] / 10, z = A[k * 5 + 1] / 10, tipo = DATOS.tiposArbol[A[k * 5 + 2]];
    const r = A[k * 5 + 3] / 100, alto = A[k * 5 + 4] / 100, y = altura(x, z);
    if (DATOS.arbolesReales) {
      // Árboles medidos con LiDAR: alto = altura total; la copa arriba y el tronco debajo, más grueso si es grande
      const q = new THREE.Quaternion(), grueso = THREE.MathUtils.clamp(r / 2.5, 0.8, 2.2);
      if (tipo === "arbusto") {
        matrices.arbusto.push(m.clone().compose(new THREE.Vector3(x, y + alto / 2, z), q, new THREE.Vector3(r, Math.max(alto / 2, 0.4), r)));
        continue;
      }
      const copa = tipo === "pino" ? alto * 0.6 : tipo.startsWith("cono") ? alto * 0.75 : Math.min(2 * r, alto * 0.7);
      const fuste = alto - copa;
      matrices.tronco.push(m.clone().compose(new THREE.Vector3(x, y + (fuste + 0.3) / 2 - 0.25, z), q, new THREE.Vector3(grueso, fuste + 0.3, grueso)));
      const forma = tipo === "pino" || tipo.startsWith("cono") ? new THREE.Vector3(r, copa, r) : new THREE.Vector3(r, copa / 2, r);
      matrices[tipo].push(m.clone().compose(new THREE.Vector3(x, y + fuste + copa / 2, z), q, forma));
      continue;
    }
    if (tipo !== "arbusto") {
      const ht = tipo === "pino" ? 2.5 : 2.1;
      matrices.tronco.push(m.clone().compose(new THREE.Vector3(x, y + ht / 2 - 0.25, z), new THREE.Quaternion(), new THREE.Vector3(1, ht, 1)));
    }
    let base = y + 1.6 + r, escala = new THREE.Vector3(r, r, r);
    if (tipo === "arbusto") base = y + 0.5;
    else if (tipo === "pino") { base = y + 1.6 + alto / 2; escala = new THREE.Vector3(r, alto, r); }
    else if (tipo.startsWith("cono")) { base = y + 1.4 + alto / 2; escala = new THREE.Vector3(r, alto, r); }
    matrices[tipo].push(m.clone().compose(new THREE.Vector3(x, base, z), new THREE.Quaternion(), escala));
  }
  for (const [tipo, lista] of Object.entries(matrices)) {
    if (!lista.length) continue;
    const malla = new THREE.InstancedMesh(formas[tipo][0], formas[tipo][1], lista.length);

    malla.receiveShadow = true;
    scene.add(malla);
    mallasModelo.push(malla);
  }

// ------------------------------------------------------------ puentes: altura del tablero
// Encima de un puente (a menos de medio ancho de su eje) la altura que cuenta es la del tablero, no la del río.
const PUENTES = (DATOS.puentes || []).flatMap((b) => b.p.slice(1).map((q, k) => ({ a: b.p[k], b: q, r: b.ancho / 2 })));
function alturaSuelo(x, z) {
  for (const { a, b, r } of PUENTES) {
    const dx = b[0] - a[0], dz = b[1] - a[1], l2 = dx * dx + dz * dz || 1;
    const t = ((x - a[0]) * dx + (z - a[1]) * dz) / l2;
    if (t < 0 || t > 1) continue;
    const px = a[0] + dx * t - x, pz = a[1] + dz * t - z;
    if (px * px + pz * pz <= r * r) return Math.max(altura(x, z), a[2] + (b[2] - a[2]) * t);
  }
  return altura(x, z);
}

}

// Rejilla de 1 m (D.suelo1m: 3 = edificio, de Catastro). El coche es un círculo de 8 puntos y el centro.
const enEdificio = (x, z) => {
  const i = Math.floor(x - SIM.x0), j = Math.floor(z - SIM.z0);
  return i >= 0 && i < S1.nx && j >= 0 && j < S1.ny && D.suelo1m[j * S1.nx + i] === 3;
};
function choca(x, z, radio) {
  if (enEdificio(x, z)) return true;
  for (let a = 0; a < 8; a++)
    if (enEdificio(x + radio * Math.cos(a * Math.PI / 4), z + radio * Math.sin(a * Math.PI / 4))) return true;
  return false;
}

function crearCoche() {
  const m = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.6, ...extra });
  const caja = (w, h, l, mat, x, y, z) => {
    const malla = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), mat);
    malla.position.set(x, y, z);
    malla.castShadow = true;
    return malla;
  };
  const grupo = new THREE.Group();
  grupo.rotation.order = "YXZ";                                  // rumbo, cabeceo, alabeo
  const rojo = m(0xd64545), cristal = m(0x2b3a4a, { roughness: 0.2 });
  grupo.add(caja(1.8, 0.6, 4.2, rojo, 0, 0.6, 0));              // carrocería
  grupo.add(caja(1.6, 0.55, 2.1, cristal, 0, 1.17, -0.25));     // cabina acristalada
  grupo.add(caja(1.64, 0.08, 1.9, rojo, 0, 1.47, -0.3));        // techo
  grupo.add(caja(1.82, 0.12, 0.25, m(0x333333), 0, 0.4, 2.1));  // parachoques
  for (const x of [-0.6, 0.6]) {
    grupo.add(caja(0.35, 0.15, 0.05, m(0xfff3b0, { emissive: 0xfff3b0, emissiveIntensity: 0.6 }), x, 0.68, 2.11));
    grupo.add(caja(0.35, 0.12, 0.05, m(0xff3030, { emissive: 0xff2020, emissiveIntensity: 0.5 }), x, 0.7, -2.11));
  }
  const ruedas = [];
  const geoRueda = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 10).rotateZ(Math.PI / 2);
  for (const [x, z] of [[-0.85, 1.35], [0.85, 1.35], [-0.85, -1.35], [0.85, -1.35]]) {
    const pivote = new THREE.Group();
    pivote.position.set(x, 0.38, z);
    const malla = new THREE.Mesh(geoRueda, m(0x222222));
    malla.castShadow = true;
    pivote.add(malla);
    grupo.add(pivote);
    ruedas.push({ pivote, malla, delantera: z > 0 });
  }
  return { grupo, ruedas };
}

// ------------------------------------------------------------ física del coche
const ADELANTE = new THREE.Vector3(), DERECHA = new THREE.Vector3(), ARRIBA = new THREE.Vector3(0, 1, 0);

function conducir(dt) {
  const turbo = pulsada("ShiftLeft", "ShiftRight");
  const maxima = turbo ? 30 : 19;                       // m/s (≈ 108 / 68 km/h)
  if (pulsada("KeyW", "ArrowUp")) estado.vel += (estado.vel < 0 ? 16 : turbo ? 11 : 7) * dt;
  else if (pulsada("KeyS", "ArrowDown")) estado.vel -= (estado.vel > 0 ? 16 : 5) * dt;
  else estado.vel -= Math.sign(estado.vel) * Math.min(Math.abs(estado.vel), 3 * dt);
  if (pulsada("Space")) estado.vel -= Math.sign(estado.vel) * Math.min(Math.abs(estado.vel), 22 * dt);
  estado.vel = THREE.MathUtils.clamp(estado.vel, -7, maxima);

  const objetivo = (pulsada("KeyA", "ArrowLeft") ? 1 : 0) - (pulsada("KeyD", "ArrowRight") ? 1 : 0);
  estado.giro += (objetivo - estado.giro) * Math.min(1, dt * 6);
  // El giro depende de la velocidad y se suaviza a velocidades altas
  estado.rumbo += estado.giro * (estado.vel / 2.6) * 0.55 / (1 + Math.abs(estado.vel) / 14) * dt;

  ADELANTE.set(Math.sin(estado.rumbo), 0, Math.cos(estado.rumbo));
  const antes = estado.pos.clone();
  estado.pos.addScaledVector(ADELANTE, estado.vel * dt);
  if (choca(estado.pos.x, estado.pos.z, 1.7)) {
    // Desliza por el eje que quede libre; si no hay ninguno, rebota
    if (!choca(estado.pos.x, antes.z, 1.7)) { estado.pos.z = antes.z; estado.vel *= 0.85; }
    else if (!choca(antes.x, estado.pos.z, 1.7)) { estado.pos.x = antes.x; estado.vel *= 0.85; }
    else { estado.pos.copy(antes); estado.vel *= Math.abs(estado.vel) > 3 ? -0.3 : 0.5; }
  }
  estado.pos.x = THREE.MathUtils.clamp(estado.pos.x, -D.terreno.lx + 3, D.terreno.lx - 3);
  estado.pos.z = THREE.MathUtils.clamp(estado.pos.z, -D.terreno.ly + 3, D.terreno.ly - 3);

  // Seguir el relieve: altura en el centro e inclinación según delante/detrás e izquierda/derecha
  DERECHA.crossVectors(ADELANTE, ARRIBA);
  const h = (dx, dz) => alturaSuelo(estado.pos.x + dx, estado.pos.z + dz);
  const delante = h(ADELANTE.x * 1.6, ADELANTE.z * 1.6), detras = h(-ADELANTE.x * 1.6, -ADELANTE.z * 1.6);
  const dcha = h(DERECHA.x * 0.9, DERECHA.z * 0.9), izq = h(-DERECHA.x * 0.9, -DERECHA.z * 0.9);
  estado.pos.y = (delante + detras + dcha + izq) / 4;

  coche.grupo.position.copy(estado.pos);
  coche.grupo.rotation.set(-Math.atan2(delante - detras, 3.2), estado.rumbo, -Math.atan2(dcha - izq, 1.8));
  for (const r of coche.ruedas) {
    r.malla.rotation.x += (estado.vel * dt) / 0.38;
    if (r.delantera) r.pivote.rotation.y = estado.giro * 0.5;
  }

  const suave = 1 - Math.exp(-dt * 5);
  if (vistaConductor) {
    camera.position.copy(estado.pos).addScaledVector(ARRIBA, 1.25).addScaledVector(DERECHA, -0.4)
      .addScaledVector(ADELANTE, -0.1);
    camera.lookAt(estado.pos.clone().addScaledVector(ADELANTE, 25).addScaledVector(ARRIBA, 1));
  } else {
    const deseada = estado.pos.clone().addScaledVector(ADELANTE, -10).addScaledVector(ARRIBA, 4.5);
    camera.position.lerp(deseada, suave);
    camera.lookAt(estado.pos.clone().addScaledVector(ADELANTE, 4).addScaledVector(ARRIBA, 1.2));
  }
  sol.target.position.copy(estado.pos);                  // sombras nítidas alrededor del coche
  sol.position.copy(estado.pos).addScaledVector(dirSol, 200);
  $("velocidad").firstChild.textContent = Math.round(Math.abs(estado.vel) * 3.6) + " ";
}

// ------------------------------------------------------------ estilo artístico (ilustración plana)
// Cada material se sustituye por uno "toon" con colores de paleta muy saturados. Si tiene textura, su luminancia
// decide entre 3 tonos (oscuro / base / claro): ventanas, juntas o líneas de la calzada quedan como formas planas.
// Encima van motas de color.  umbral: [lum < x → oscuro, lum > y → claro] (sin umbral = color plano)
const RECETAS = {
  calzada:    { base: 0x2f55d4, claro: 0xf4f4f4, mota: 0x4068ea, motas: 0.10, escala: 0.9, umbral: [0, 0.45] },
  peatonal:   { base: 0xd4735e, oscuro: 0xb15544, mota: 0xe9a08a, motas: 0.18, escala: 0.7, umbral: [0.3, 2] },
  cesped:     { base: 0x37b24d, mota: 0x9ad552, motas: 0.35, escala: 0.8 },
  pista:      { base: 0x2f9e5a, mota: 0x5cc679, motas: 0.20, escala: 1.0 },
  bosque:     { base: 0x1f8f6a, mota: 0x63c48e, motas: 0.40, escala: 0.9 },
  matorral:   { base: 0xa6cf3a, mota: 0x6f9e28, motas: 0.45, escala: 0.8 },
  suelo:      { base: 0x96d062, mota: 0x7fbd52, motas: 0.18, escala: 1.5 },
  agua:       { base: 0x2c7bd6, mota: 0x8cc0f2, motas: 0.25, escala: 1.6 },
  aparcamiento: { base: 0x3a62d8, mota: 0x4a72e8, motas: 0.08, escala: 0.9 },
  puente:     { base: 0xe8dcc8, mota: 0xcfc2ab, motas: 0.12, escala: 0.6 },
  tierra:     { base: 0xc4633a, oscuro: 0x8f3f22, claro: 0xd9814f, umbral: [0.22, 0.45] },
  tejado:     { base: 0xe05a33, oscuro: 0xa63a22, claro: 0xf27c4b, umbral: [0.12, 0.9] },
  azotea:     { base: 0xead9b8, oscuro: 0xc7b08a, umbral: [0.45, 2] },
  tronco:     { base: 0xe8693c, mota: 0xf59a63, motas: 0.20, escala: 0.4 },
  copa:       { base: 0x2e9e78, mota: 0xa8d85c, motas: 0.50, escala: 0.45 },
  copa_clara: { base: 0xd2a92e, mota: 0xf2d466, motas: 0.50, escala: 0.45 },
  copa_pino:  { base: 0x1c7a6e, mota: 0x47b48f, motas: 0.45, escala: 0.5 },
  arbusto:    { base: 0x5db84f, mota: 0xbadf5c, motas: 0.45, escala: 0.4 },
};
const PARED = { crema: 0xf6c445, melocoton: 0xf28c4e, blanco: 0xf5efe2, ocre: 0xe7a43a, rosa: 0xee7f95,
                gris: 0x86b6d8, nave: 0x6fa3c9 };

function receta(nombre) {
  if (RECETAS[nombre]) return RECETAS[nombre];
  const m = /^muro_([a-z]+)_/.exec(nombre);
  if (!m || !PARED[m[1]]) return null;
  return { base: PARED[m[1]], oscuro: 0x24325f, claro: 0xfaf6ec,
           mota: new THREE.Color(PARED[m[1]]).multiplyScalar(0.9).getHex(),
           motas: 0.08, escala: 0.6, umbral: [0.2, 0.8] };     // 0.2: el reflejo del cristal también es ventana
}

const materialesArte = new Map();
function materialArtistico(original) {
  if (materialesArte.has(original)) return materialesArte.get(original);
  const r = receta(original.name);
  if (!r) return original;
  // side: igual que el original (el GLB trae caras a doble cara). El GLB no lleva normales: sombreado plano a la
  // fuerza con FLAT_SHADED (MeshToonMaterial no tiene la opción flatShading y la ignoraría)
  const m = new THREE.MeshToonMaterial({ map: original.map, color: 0xffffff, side: original.side });
  m.defines = { FLAT_SHADED: "" };
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, {
      uBase: { value: new THREE.Color(r.base) },
      uOscuro: { value: new THREE.Color(r.oscuro ?? r.base) },
      uClaro: { value: new THREE.Color(r.claro ?? r.base) },
      uMota: { value: new THREE.Color(r.mota ?? r.base) },
      uMotas: { value: r.motas ?? 0 },
      uEscala: { value: r.escala ?? 1 },
      uUmbral: { value: new THREE.Vector2(...(r.umbral ?? [-1, 2])) },
    });
    if (original.name === "suelo") Object.assign(s.uniforms, uniformesAceras());
    if (ES_TECHO(original.name)) Object.assign(s.uniforms, uniformesTechos());
    s.vertexShader = "varying vec3 vMundo;\n" + s.vertexShader.replace(...VERTICE_MUNDO);
    s.fragmentShader = `varying vec3 vMundo;
      ${original.name === "suelo" ? "#define CON_ACERAS\n" + GLSL_ACERAS : ""}
      ${ES_TECHO(original.name) ? "#define CON_TECHOS\n" + GLSL_TECHOS : ""}
      uniform vec3 uBase, uOscuro, uClaro, uMota;
      uniform float uMotas, uEscala;
      uniform vec2 uUmbral;
      ` + s.fragmentShader.replace("#include <map_fragment>", `#include <map_fragment>
      {
        // 3 tonos según la luminancia de la textura (ventanas, juntas, líneas...)
        float lum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));
        vec3 c = lum < uUmbral.x ? uOscuro : (lum > uUmbral.y ? uClaro : uBase);
        #ifdef CON_ACERAS
          float ts = tipoSuelo();
          if (ts > 0.75) c = vec3(0.028, 0.093, 0.66);        // calzada azul (0x2f55d4, en lineal)
          else if (ts > 0.25) c = vec3(0.66, 0.18, 0.11);     // acera terracota (0xd4735e, en lineal)
        #endif
        // Motas: una por celda como mucho, proyectadas en el plano que más mira la superficie
        vec3 an = abs(normalize(cross(dFdx(vMundo), dFdy(vMundo))));
        vec2 p = (an.y > max(an.x, an.z) ? vMundo.xz : (an.x > an.z ? vMundo.zy : vMundo.xy)) / uEscala;
        vec2 celda = floor(p), f = fract(p);
        float h = fract(sin(dot(celda, vec2(127.1, 311.7))) * 43758.5453);
        vec2 centro = 0.25 + 0.5 * vec2(fract(h * 17.13), fract(h * 31.71));
        float mota = step(length(f - centro), 0.22) * step(1.0 - uMotas, fract(h * 7.77));
        mota *= 1.0 - smoothstep(0.25, 0.7, length(fwidth(p)));   // de lejos se funden (sin parpadeo)
        diffuseColor.rgb = mix(c, uMota, mota);
        #ifdef CON_ACERAS
          diffuseColor.rgb = conCapa(diffuseColor.rgb);
        #endif
        #ifdef CON_TECHOS
          diffuseColor.rgb = conTechos(diffuseColor.rgb);
        #endif
      }`);
  };
  m.customProgramCacheKey = () => (original.name === "suelo" ? "estilo-arte-suelo"      // el suelo lleva aceras
                                  : ES_TECHO(original.name) ? "estilo-arte-techos" : "estilo-arte");
  materialesArte.set(original, m);
  return m;
}

let alCambiarEstilo = null;     // el tiempo real vuelve a poner su cielo encima
function aplicarEstilo(activo) {
  estiloArte = activo;

  cielo.intensity = activo ? 2.2 : 1.6;

}

// Malla de celdas: la usan la lámina de agua y la capa de riesgo de Neutro

{

const matVistaAgua = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,

              sol: { value: new THREE.Vector3(-0.4, 1, 0.3).normalize() } },

    varying float vA;
    void main() {
      float y = alto - mod(tiempo * 35.0 + gota.x * alto, alto) + gota.y * 5.0;
      vA = 1.0 - gota.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position.x, y, position.z, 1.0);
    }`,
  fragmentShader: `
    varying float vA;
    void main() { gl_FragColor = vec4(0.78, 0.86, 0.95, 0.15 + 0.55 * vA); }`,
});
const tormentas = [];

function crearTormenta(x, z, radio, intensidad) {
  if (tormentas.length >= MAX_NUBES) quitarTormenta(tormentas[0]);
  const grupo = new THREE.Group();
  grupo.position.set(x, altura(x, z), z);
  for (let k = 0; k < 12; k++) {
    const bola = new THREE.Mesh(new THREE.IcosahedronGeometry(radio * (0.2 + Math.random() * 0.18), 1), matNube);
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * radio * 0.75;
    bola.position.set(Math.cos(a) * r, ALTO_NUBE + Math.random() * 15, Math.sin(a) * r);
    bola.scale.y = 0.45;
    bola.castShadow = true;
    grupo.add(bola);
  }
  const cortina = new THREE.Mesh(
    new THREE.CylinderGeometry(radio * 0.85, radio * 0.85, ALTO_NUBE, 32, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x9fb3c8, transparent: true, depthWrite: false, side: THREE.DoubleSide,
                                  opacity: 0.06 + 0.14 * intensidad / 300 }));
  cortina.position.y = ALTO_NUBE / 2;
  grupo.add(cortina);
  const n = Math.round(THREE.MathUtils.clamp((radio * radio * intensidad) / 4000, 400, 6000));
  const pos = new Float32Array(n * 6), gota = new Float32Array(n * 4);
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * radio * 0.85, fase = Math.random();
    for (let e = 0; e < 2; e++) {
      pos.set([Math.cos(a) * r, 0, Math.sin(a) * r], (k * 2 + e) * 3);
      gota.set([fase, e], (k * 2 + e) * 2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("gota", new THREE.BufferAttribute(gota, 2));
  const gotas = new THREE.LineSegments(geo, matGotas);
  gotas.frustumCulled = false;
  grupo.add(gotas);
  scene.add(grupo);
  tormentas.push({ x, z, radio, intensidad, grupo });
  actualizarTormentas();
}

function quitarTormenta(tt) {
  scene.remove(tt.grupo);
  tt.grupo.traverse((o) => {
    o.geometry?.dispose();
    if (o.material && o.material !== matNube && o.material !== matGotas) o.material.dispose();
  });
  tormentas.splice(tormentas.indexOf(tt), 1);
  actualizarTormentas();
}

function actualizarTormentas() {
  simulacion.fijarNubes(tormentas);
  $("tormentas").replaceChildren(...tormentas.map((tt) => {
    const li = document.createElement("li");
    li.textContent = t("tormentaItem", tt.intensidad, tt.radio);
    const b = document.createElement("button");
    b.textContent = "✕";
    b.title = t("quitarEsta");
    b.onclick = () => quitarTormenta(tt);
    li.appendChild(b);
    return li;
  }));
}

/** Superficie oficial (T500) y qué parte de lo inundado en el mapa actual cae dentro de ella. */
function comparacionOficial() {
  if (!OFICIAL || !mapaRiesgo) return null;
  let oficial = 0, inundado = 0, dentro = 0;
  for (let k = 0; k < OFICIAL.length; k++) {
    if (OFICIAL[k] && D.codigos[k] !== 1) oficial++;
    if (mapaRiesgo[k] === 2) { inundado++; if (OFICIAL[k]) dentro++; }
  }
  return { ha: (oficial * SIM.celda ** 2) / 1e4, pct: (100 * dentro) / (inundado || 1) };
}

const texRiesgo = new THREE.DataTexture(new Uint8Array(SIM.nx * SIM.ny).fill(255), SIM.nx, SIM.ny,
                                        THREE.RedFormat, THREE.UnsignedByteType);
texRiesgo.unpackAlignment = 1;                      // filas de 1 byte por celda (el ancho no es múltiplo de 4)
const capaRiesgo = new THREE.Mesh(geoCeldas, new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { tRiesgo: { value: texRiesgo } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position + vec3(0.0, 0.6, 0.0), 1.0);
    }`,
  fragmentShader: `
    // 1 charco · 2 inundado · 3 deja de inundarse (medidas) · 4 empeora (medidas); 0 y 255 no se pintan.
    // Se lee por píxel (textura sin filtrar): cada celda de 4 m con su color, sin mezclas entre vecinas.
    uniform sampler2D tRiesgo;
    varying vec2 vUv;
    void main() {
      float c = floor(texture2D(tRiesgo, vUv).r * 255.0 + 0.5);
      if (c < 0.5 || c > 4.5) discard;
      vec3 color = c < 1.5 ? vec3(1.0, 0.78, 0.25) : c < 2.5 ? vec3(0.86, 0.12, 0.2)

      gl_FragColor = vec4(color, c < 1.5 ? 0.55 : 0.8);

}));

/** La explicación de Neutro para una celda: su concepto, sus rasgos y lo que vio al aprender. */
function explicar(celda, numeroPunto = null) {
  ultimaExplicacion = [celda, numeroPunto];
  const caja = $("explicacion");
  const cod = D.codigos[celda];
  let html = `<button class="cerrarExp" style="float:right">✕</button><b>${numeroPunto ? `${numeroPunto} · ` : ""}${t("porQue")}</b><br>`;
  html += `${t("calle")}: ${nombreCalle(D.calles[celda])}<br>`;
  if (OFICIAL && OFICIAL[celda]) html += `<span style="color:#c9a3ff">${t("oficialCelda", PERIODOS[OFICIAL[celda]])}</span><br>`;
  if (!celdaAnalizable(cod)) html += t("noAnaliza");
  else {
    const s = situacion(iEscenario, cod, D.rasgos[celda]);
    const { accion, neurona, excepcion } = decidir(neutro, s, firmaDe(celda, SIM.nx));
    const r = rasgosDe(s);
    const prof = profundidadFisica(celda);
    if (prof !== null)
      html += t("fisicaDice", prof > 1 ? t("masDeUnMetro") : `${numero(Math.round(prof * 100))} cm`,
                tx("clases")[claseDeProfundidad(prof)]) + "<br>";
    html += t("neutroDice", tx("clases")[ACCIONES.indexOf(accion)]) + ` (${INTENSIDADES[iEscenario]} mm/h)<br>`;
    if (excepcion) {
      const fechas = neurona.incidencias.map((id) => incidencias.find((i) => i.id === id)?.fecha).filter(Boolean);
      html += `<span style="color:#5ad17a">${t("porIncidencia", fechas.join(", "))}</span><br>`;
    }
    html += t("concepto", tx("conceptos")[percepcion.nombrar(s)]);
    html += `<ul><li>${tx("suelos")[r.suelo] ?? ""}</li><li>${tx("cuencas")[r.cuenca]}</li>`
          + `<li>${tx("hondonadas")[r.hondonada]}</li><li>${tx("pendientes")[r.pendiente]}</li></ul>`;
    if (!neurona) html += t("nuncaVisto");
    else {
      const a = neurona.aciertos || {};
      const veces = ACCIONES.reduce((x, k) => x + (a[k] || 0), 0);
      const reparto = ACCIONES.map((k, i) => `${tx("clases")[i]} ${numero(a[k] || 0)}`).join(" · ");
      const conf = ((a[accion] || 0) + 1) / ((a[accion] || 0) + (neurona.fallos[accion] || 0) + 2);
      if (!neutro.neuronas.has(s)) html += t("completado") + "<br>";
      html += t("visto", numero(veces), reparto) + " " + t("confianza", Math.round(conf * 100));
    }
    if (r.hondonada >= 2) html += `<div class="nota">${t("notaHondonada")}</div>`;
  }
  caja.innerHTML = html;
  caja.querySelector(".cerrarExp").onclick = () => { caja.style.display = "none"; ultimaExplicacion = null; };
  caja.style.display = "block";
}

// ------------------------------------------------------------ simulaciones de escenario (comprobación, medidas)
// Una simulación completa del escenario (1 h de lluvia + 30 min de escorrentía) repartida entre fotogramas para
// que la página no se congele; al terminar devuelve la profundidad máxima de cada celda.
const SIN_CAMBIOS = { bajar: null, desague: null, alcantarillado: 0 };
function lanzarSimulacion(mmh, campo, salida, etiqueta, alTerminar) {
  simulacion.aplicar(campo.bajar, campo.desague, campo.alcantarillado);
  simulacion.secar();
  simulacion.fijarNubes([]);
  simulacion.lluviaGlobal = mmh;
  comprobacion = { paso: 0, lluvia: DURACION_LLUVIA / DT_SIM, total: (DURACION_LLUVIA + DURACION_ESCORRENTIA) / DT_SIM,
                   salida, etiqueta, alTerminar };
  matVistaAgua.uniforms.modoVista.value = 0;
}
function avanzarComprobacion() {
  const c = comprobacion;
  for (let k = 0; k < 200 && c.paso < c.total; k++, c.paso++) {
    if (c.paso === c.lluvia) simulacion.lluviaGlobal = 0;
    simulacion.paso();
  }
  $(c.salida).textContent = t(c.etiqueta, Math.round((100 * c.paso) / c.total));
  if (c.paso < c.total) return;
  const maxima = simulacion.leer().maxima;
  comprobacion = null;
  aplicarCampoActual();                                   // la lluvia libre vuelve con las medidas puestas
  simulacion.fijarNubes(tormentas);
  matVistaAgua.uniforms.modoVista.value = 1;              // deja a la vista la inundación máxima simulada
  $("vista").value = "1";
  c.alTerminar(maxima);
}

// Comprobación: la simulación física del mismo escenario (sin medidas), y cuánto coincide con Neutro
$("comprobar").onclick = () => {
  if (comprobacion || !mapaRiesgo) return;
  const neutroMapa = predecirMapa(neutro, iEscenario, D.codigos, D.rasgos, SIM.nx);
  lanzarSimulacion(INTENSIDADES[iEscenario], SIN_CAMBIOS, "estadoComprobacion", "comprobando", (maxima) => {
    const r = comparar(neutroMapa, clasesDeProfundidad(maxima, D.codigos));
    $("estadoComprobacion").textContent = t("resultadoComprobacion", Math.round(r.exactitud * 100),
                                             Math.round(r.sensibilidad * 100), Math.round(r.precision * 100));
  });
};

  permeable: { valor: "valorPermeable", min: 10, max: 100, paso: 10, def: 50, unidad: "mm/h", color: 0x3fae55, icono: "🌱" },
  imbornal: { valor: "valorImbornal", min: 20, max: 200, paso: 10, def: 80, unidad: "mm/h", color: 0x8a8f99, icono: "🔽" },
};
const medidas = [];
let herramienta = null, resultadoMedidas = null;
const grupoMedidas = new THREE.Group();
grupoMedidas.visible = false;
scene.add(grupoMedidas);

function rotulosMedidas() {
  const h = MEDIDA[herramienta || "deposito"];
  $("nombreValorMedida").textContent = t(h.valor);
  $("vValorMedida").textContent = `${numero(+$("valorMedida").value, 1)} ${h.unidad}`;
  $("vRadioMedida").textContent = `${$("radioMedida").value} m`;
  const alc = +$("alcantarillado").value;
  $("vAlcantarillado").textContent = alc ? `${alc} mm/h` : t("sinRed");
  for (const b of document.querySelectorAll("[data-herr]")) b.classList.toggle("activo", b.dataset.herr === herramienta);
  $("listaMedidas").replaceChildren(...medidas.map((m) => {
    const li = document.createElement("li");
    li.textContent = textoMedida(m);
    const b = document.createElement("button");
    b.textContent = "✕";
    b.onclick = () => quitarMedida(m);
    li.appendChild(b);
    return li;
  }));
}
function elegirHerramienta(h) {
  herramienta = herramienta === h ? null : h;
  if (herramienta) {
    const m = MEDIDA[herramienta], r = $("valorMedida");
    Object.assign(r, { min: m.min, max: m.max, step: m.paso });
    r.value = m.def;
    marcandoInc = false;
    rotulosIncidencias();
  }
  rotulosMedidas();
}
for (const b of document.querySelectorAll("[data-herr]")) b.onclick = () => elegirHerramienta(b.dataset.herr);
for (const id of ["radioMedida", "valorMedida"]) $(id).oninput = rotulosMedidas;
$("alcantarillado").oninput = () => { rotulosMedidas(); aplicarCampoActual(); olvidarResultadoMedidas(); };

/** Celdas en las que actúa una medida (nunca dentro de edificios ni en el cauce). */
const celdasMedida = (m) => celdasEnCirculo(SIM, m.x, m.z, m.radio).filter((k) => celdaAnalizable(D.codigos[k]));
function textoMedida(m) {
  if (m.tipo === "deposito")
    return t("medDeposito", m.radio, numero(m.valor, 1), numero(Math.round(celdasMedida(m).length * SIM.celda ** 2 * m.valor)));
  return t(m.tipo === "permeable" ? "medPermeable" : "medImbornal", m.radio, m.valor);
}

/** El campo de modificaciones de todas las medidas + el alcantarillado, para la simulación. */
function campoMedidas() {
  const n = SIM.nx * SIM.ny, bajar = new Float32Array(n), desague = new Float32Array(n);
  for (const m of medidas)
    for (const k of celdasMedida(m)) {
      if (m.tipo === "deposito") bajar[k] = Math.max(bajar[k], m.valor);
      else desague[k] += m.valor / 3.6e6;
    }
  return { bajar: medidas.length ? bajar : null, desague: medidas.length ? desague : null,
           alcantarillado: +$("alcantarillado").value };
}
const aplicarCampoActual = () => { const c = campoMedidas(); simulacion.aplicar(c.bajar, c.desague, c.alcantarillado); };

function crearMedida(x, z) {
  const m = { tipo: herramienta, x, z, radio: +$("radioMedida").value, valor: +$("valorMedida").value };
  const def = MEDIDA[m.tipo];
  m.grupo = new THREE.Group();
  // Disco translúcido y borde, dibujados por encima de todo (como una selección) para verlos entre edificios
  const sobreTodo = (opacidad) => new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: opacidad,
                                                                  side: THREE.DoubleSide, depthTest: false, depthWrite: false });
  const disco = new THREE.Mesh(new THREE.CircleGeometry(m.radio, 48).rotateX(-Math.PI / 2), sobreTodo(0.22));
  const anillo = new THREE.Mesh(new THREE.RingGeometry(m.radio - 1.5, m.radio, 48).rotateX(-Math.PI / 2), sobreTodo(0.9));
  for (const malla of [disco, anillo]) { malla.position.set(x, altura(x, z) + 1.2, z); malla.renderOrder = 3; }
  const icono = Object.assign(document.createElement("div"), { className: "icono", textContent: def.icono });
  const etiqueta = new CSS2DObject(icono);
  etiqueta.position.set(x, altura(x, z) + 4, z);
  m.grupo.add(disco, anillo, etiqueta);
  grupoMedidas.add(m.grupo);
  medidas.push(m);
  aplicarCampoActual();
  olvidarResultadoMedidas();
  rotulosMedidas();
}
function quitarMedida(m) {
  grupoMedidas.remove(m.grupo);
  m.grupo.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
  medidas.splice(medidas.indexOf(m), 1);
  aplicarCampoActual();
  olvidarResultadoMedidas();
  rotulosMedidas();
}
$("quitarMedidas").onclick = () => { while (medidas.length) quitarMedida(medidas[0]); };

function olvidarResultadoMedidas() {
  if (!resultadoMedidas) return;
  resultadoMedidas = null;
  $("fuente").querySelector("option[value=medidas]")?.remove();
  if ($("fuente").value === "medidas" || !$("fuente").value) $("fuente").value = FISICA[iEscenario] ? "fisica" : "neutro";
  $("estadoMedidas").textContent = "";
}

// Antes y después: el "antes" es la simulación ya hecha si no hay alcantarillado; si lo hay, se simula también
$("simularMedidas").onclick = () => {
  if (comprobacion) return;
  const mmh = INTENSIDADES[iEscenario], campo = campoMedidas();
  const despues = (antesMax) => lanzarSimulacion(mmh, campo, "estadoMedidas", "simulandoDespues", (despuesMax) => {
    // El hueco del depósito se llena por diseño: no cuenta como zona inundada
    const dentroDeposito = new Set(medidas.filter((m) => m.tipo === "deposito").flatMap(celdasMedida));
    const clases = (max) => Uint8Array.from(clasesDeProfundidad(max, D.codigos), (c, k) => (dentroDeposito.has(k) ? 255 : c));
    resultadoMedidas = { iEscenario, mmh, alcantarillado: campo.alcantarillado, antes: clases(antesMax),
                         despues: clases(despuesMax), despuesMax, medidas: medidas.map(textoMedida) };
    $("estadoMedidas").textContent = "";
    simulacion.secar();                                 // sin agua encima: se ve el mapa de diferencias
    matVistaAgua.uniforms.modoVista.value = 0;
    $("vista").value = "0";
    if (!$("fuente").querySelector("option[value=medidas]")) {
      const o = document.createElement("option");
      o.value = "medidas";
      o.dataset.t = "fuenteMedidas";
      o.textContent = t("fuenteMedidas");
      $("fuente").appendChild(o);
    }
    $("fuente").value = "medidas";
    actualizarRiesgo();
  });
  if (!campo.alcantarillado && FISICA[iEscenario]) despues(Float32Array.from(FISICA[iEscenario], (v) => v * 0.02));
  else lanzarSimulacion(mmh, { ...SIN_CAMBIOS, alcantarillado: campo.alcantarillado }, "estadoMedidas", "simulandoAntes", despues);
};

function textoResultadoMedidas() {
  const r = resultadoMedidas, ha = (n) => numero((n * SIM.celda ** 2) / 1e4, 2);
  const cuenta = (mapa, c) => mapa.reduce((a, v) => a + (v === c), 0);
  const equip = (mapa) => equipamientosAfectados(mapa, SIM, DATOS.equipamientos).filter((e) => e.clase === 2).length;
  let mejora = 0, empeora = 0;
  for (let k = 0; k < r.antes.length; k++) {
    if (r.despues[k] === 255) continue;
    if (r.antes[k] === 2 && r.despues[k] < 2) mejora++;
    else if (r.despues[k] === 2 && r.antes[k] < 2) empeora++;
  }
  return t("resumenMedidas", r.mmh, r.alcantarillado ? t("conAlcantarillado", r.alcantarillado) : "",
           ha(cuenta(r.antes, 2)), ha(cuenta(r.despues, 2)),
           numero(edificiosAfectados(r.antes, SIM, D.edificios).size), numero(edificiosAfectados(r.despues, SIM, D.edificios).size),
           numero(equip(r.antes)), numero(equip(r.despues)), ha(mejora), ha(empeora));
}

// ------------------------------------------------------------ incidencias reales (Neutro aprende de ellas)
const CLAVE_INCIDENCIAS = "ripollet-incidencias";
let incidencias = [], marcandoInc = false, estadoAprendizaje = { excepciones: 0, cambios: 0 };
try { incidencias = JSON.parse(localStorage.getItem(CLAVE_INCIDENCIAS)) || []; } catch {}
const neutroBase = crearNeutro();                       // Neutro antes de conocer las incidencias (para comparar)
if (MEMORIA) cargarMemoria(neutroBase, MEMORIA);
const grupoIncidencias = new THREE.Group();
grupoIncidencias.visible = false;
scene.add(grupoIncidencias);
$("incFecha").value = new Date().toISOString().slice(0, 10);

const guardarIncidencias = () => { try { localStorage.setItem(CLAVE_INCIDENCIAS, JSON.stringify(incidencias)); } catch {} };
const valida = (i) => i && Number.isFinite(i.x) && Number.isFinite(i.z) && [1, 2].includes(i.gravedad)
  && Number.isInteger(i.intensidad) && i.intensidad >= 0 && i.intensidad < INTENSIDADES.length;

/** Peor clase en el entorno de una incidencia según un mapa dado. */
function claseCerca(inc, clasePorCelda) {
  let peor = 0;
  for (const k of celdasEnCirculo(SIM, inc.x, inc.z, 12)) if (celdaAnalizable(D.codigos[k])) peor = Math.max(peor, clasePorCelda(k));
  return peor;
}

/** Vuelve a cargar lo que Neutro aprendió de las simulaciones y le enseña todas las incidencias. */
function reaprender() {
  if (!MEMORIA) return;
  cargarMemoria(neutro, MEMORIA);                       // (deja también las excepciones vacías)
  let cambios = 0;
  for (const inc of incidencias) cambios += aprenderDeIncidencia(neutro, inc, SIM, D.codigos, D.rasgos);
  estadoAprendizaje = { excepciones: neutro.excepciones.size, cambios };
}

function rotulosIncidencias() {
  $("incMarcar").textContent = t("marcarInc", t(marcandoInc ? "si" : "no"));
  $("incMarcar").classList.toggle("activo", marcandoInc);
  const elegida = $("incIntensidad").value || String(iEscenario);      // se conserva la opción al traducir
  $("incIntensidad").replaceChildren(...INTENSIDADES.map((mmh, i) => Object.assign(document.createElement("option"),
    { value: i, textContent: `${mmh} mm/h (${categoria(mmh)})`, selected: String(i) === elegida })));
  $("listaIncidencias").replaceChildren(...incidencias.map((inc) => {
    const li = document.createElement("li");
    li.textContent = `${inc.fecha} · ${tx("clases")[inc.gravedad]} · ${INTENSIDADES[inc.intensidad]} mm/h${inc.nota ? ` · ${inc.nota}` : ""}`;
    li.onclick = () => volarA(new THREE.Vector3(inc.x, 0, inc.z), 0.35);
    const b = document.createElement("button");
    b.textContent = "✕";
    b.onclick = (e) => { e.stopPropagation(); incidencias.splice(incidencias.indexOf(inc), 1); cambioIncidencias(); };
    li.appendChild(b);
    return li;
  }));
  // Validación: ¿la simulación física (y Neutro sin incidencias) ve agua donde la hubo?
  if (!incidencias.length) { $("estadoIncidencias").textContent = t("sinIncidencias"); return; }
  let agua = 0, gravedad = 0, neutroAntes = 0;
  for (const inc of incidencias) {
    const f = FISICA[inc.intensidad];
    const cf = f ? claseCerca(inc, (k) => claseDeProfundidad(f[k] * 0.02)) : 0;
    if (cf >= 1) agua++;
    if (cf >= inc.gravedad) gravedad++;
    const cn = claseCerca(inc, (k) => ACCIONES.indexOf(decidir(neutroBase, situacion(inc.intensidad, D.codigos[k], D.rasgos[k])).accion));
    if (cn >= inc.gravedad) neutroAntes++;
  }
  $("estadoIncidencias").textContent = t("estadoIncidencias", incidencias.length, agua, gravedad, neutroAntes,
                                         numero(estadoAprendizaje.excepciones), numero(estadoAprendizaje.cambios));
}

function pintarIncidencias() {
  grupoIncidencias.clear();
  for (const inc of incidencias) {
    const div = document.createElement("div");
    div.className = "pin";
    div.style.background = inc.gravedad === 2 ? "#d7263d" : "#f2b632";
    div.title = `${inc.fecha} · ${tx("clases")[inc.gravedad]}${inc.nota ? ` · ${inc.nota}` : ""}`;
    div.onclick = () => explicar(Math.floor((inc.z - SIM.z0) / SIM.celda) * SIM.nx + Math.floor((inc.x - SIM.x0) / SIM.celda));
    const obj = new CSS2DObject(div);
    obj.position.set(inc.x, altura(inc.x, inc.z) + 6, inc.z);
    grupoIncidencias.add(obj);
  }
}

function cambioIncidencias() {
  guardarIncidencias();
  reaprender();
  pintarIncidencias();
  rotulosIncidencias();
  if ($("riesgo").style.display === "block") actualizarRiesgo();
}

function crearIncidencia(x, z) {
  incidencias.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),

  $("incNota").value = "";
  cambioIncidencias();
}

$("incMarcar").onclick = () => {

};
$("incExportar").onclick = () => {

$("incImportar").onclick = () => $("incArchivo").click();
$("incArchivo").onchange = async () => {
  const archivo = $("incArchivo").files[0];

  if (!archivo) return;
  let lista = [];
  try { lista = JSON.parse(await archivo.text()); } catch {}
  const nuevas = (Array.isArray(lista) ? lista : []).filter(valida)
    .map((i) => ({ id: String(i.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), x: i.x, z: i.z,
                   fecha: String(i.fecha || "").slice(0, 10), gravedad: i.gravedad, intensidad: i.intensidad,
                   nota: String(i.nota || "").slice(0, 120) }))
    .filter((i) => !incidencias.some((j) => j.id === i.id));
  if (!nuevas.length && !(Array.isArray(lista) && lista.length)) { alert(t("importError")); return; }
  incidencias.push(...nuevas);
  cambioIncidencias();
};
reaprender();
pintarIncidencias();

// ------------------------------------------------------------ herramientas (sombra, accesibilidad, incendio…)
// Cada módulo de js/ se apunta en globalThis.HERRAMIENTAS con { id, textos, crear(ctx, div) }; crear devuelve los
// ganchos que quiera: alMostrar, alOcultar, alClic(x, z), traducir, cadaFrame(dt). Las capas son compartidas: solo
// las pinta la herramienta abierta.
const CTX = {
  THREE, scene, camera, renderer, controls, CSS2DObject, D, DATOS, SIM, S1, altura, sol, sombrasMapa, geoCeldas,
  simulacion, FISICA, INTENSIDADES, volarA, $, t, tx, numero, idioma: () => idioma, estiloArte: () => estiloArte,
  nombreCalle, choca, SOTANOS, secciones4m: SECCIONES_4M, rehab: REHAB, lugaresOsm: LUGARES_OSM, transporte: TRANSPORTE, acustica4m: ACUSTICA_4M,
  capa1m: { datos: datosCapa1m, actualizar: () => { texCapa1m.needsUpdate = true; },
            ver: (v) => { capa1mActiva.value = v ? 1 : 0; } },
  capaTechos: { datos: datosCapaTechos, nx: S1.nx / 2, ny: S1.ny / 2, actualizar: () => { texCapaTechos.needsUpdate = true; },
                ver: (v) => { capaTechosActiva.value = v ? 1 : 0; } },
  /** Capa RGBA propia sobre las celdas de 4 m (incendio, rutas…): se pinta en `datos` y se llama a actualizar(). */
  capa4m() {
    const datos = new Uint8Array(SIM.nx * SIM.ny * 4);
    const tex = new THREE.DataTexture(datos, SIM.nx, SIM.ny, THREE.RGBAFormat, THREE.UnsignedByteType);
    tex.needsUpdate = true;
    const malla = new THREE.Mesh(geoCeldas, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: { t: { value: tex } },
      vertexShader: `varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position + vec3(0.0, 0.7, 0.0), 1.0); }`,
      fragmentShader: `uniform sampler2D t; varying vec2 vUv;
        void main() { vec4 c = texture2D(t, vUv); if (c.a < 0.02) discard; gl_FragColor = c; }`,
    }));
    Object.assign(malla, { frustumCulled: false, renderOrder: 1, visible: false });
    scene.add(malla);
    return { datos, malla, actualizar: () => { tex.needsUpdate = true; } };
  },
  /** Primer punto del modelo (suelo, tejados, fachadas) bajo el ratón, o null. */
  impacto(e) {
    puntero.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    rayo.setFromCamera(puntero, camera);
    return rayo.intersectObjects(mallasModelo.filter((o) => !o.isInstancedMesh), false)[0]?.point ?? null;
  },
  /** Índice (1…) del edificio en (x, z) según la rejilla de 4 m, o 0. */
  edificioEn(x, z) {
    const i = Math.floor((x - SIM.x0) / SIM.celda), j = Math.floor((z - SIM.z0) / SIM.celda);
    return i >= 0 && i < SIM.nx && j >= 0 && j < SIM.ny ? D.edificios[j * SIM.nx + i] : 0;
  },
};
for (const h of LISTA_HERRAMIENTAS) {
  const div = document.createElement("div");
  div.className = "panel herramienta";
  div.id = h.id;
  document.body.appendChild(div);
  const boton = document.createElement("button");
  boton.dataset.t = h.id + "Boton";
  boton.onclick = () => mostrarPanel(div.style.display === "block" ? null : h.id);
  $("herramientas").appendChild(boton);
  // Se prepara la primera vez que se abre (cada una precalcula sus rejillas): la carga inicial no espera a ninguna
  PANELES_HERRAMIENTA[h.id] = {
    div, creada: null,
    get h() {
      if (!this.creada) {
        this.creada = h.crear(CTX, div) || {};
        for (const el of div.querySelectorAll("[data-t]")) el.innerHTML = t(el.dataset.t);
        adornarHerramienta(div);
        for (const a of div.querySelectorAll(".asa")) a.title = t("navAsa");
      }
      return this.creada;
    },
  };
}

// ------------------------------------------------------------ tiempo real: sol y tiempo de ahora en el mapa
tiempoReal = crearTiempoReal({
  ...CTX, cielo, dirSol, tiempoGotas,
  enMapa: () => modo === "mapa",
  solLibre: () => modo !== "mapa" || PANELES_HERRAMIENTA.sombra?.div.style.display !== "block",
  restaurarEstilo: () => { alCambiarEstilo = null; aplicarEstilo(estiloArte); alCambiarEstilo = tiempoReal.aplicar; },
}, $("tiempoReal"));
alCambiarEstilo = tiempoReal.aplicar;
CTX.clima = tiempoReal.clima;
CTX.hora = tiempoReal.hora;
pixelado = crearPixelado({ ...CTX, vista, enMapa: () => modo === "mapa" }, $("vista"));
tiempoReal.aplicar();     // la niebla, ya con la escala de la maqueta
trafico = crearTrafico({ ...CTX, altura: alturaSuelo, hora: tiempoReal.hora, cochePropio: () => (modo === "coche" ? estado.pos : null) }, $("trafico"));
tiempoReal.alCambiarHora = trafico.recalcular;
// Farolas reales del AMB (x, z en dm y tipo: 0 columna · 1 fachada), si se descargaron
const DATOS_FAROLAS = BLOBS && !BLOBS.farolas ? null : await cargarBinario("farolas", Int16Array, BLOBS).catch(() => null);
const farolas = crearFarolas({ ...CTX, altura: alturaSuelo, noche: tiempoReal.noche }, DATOS_FAROLAS);

// ------------------------------------------------------------ clic en el mapa: tormenta o pregunta a Neutro
let pulsacion = null;
const rayo = new THREE.Raycaster(), puntero = new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown", (e) => { pulsacion = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!pulsacion || !sueloMalla || modo !== "mapa" || e.button !== 0) return;
  if (Math.hypot(e.clientX - pulsacion.x, e.clientY - pulsacion.y) > 6 || performance.now() - pulsacion.t > 400) return;
  puntero.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  rayo.setFromCamera(puntero, camera);
  const impacto = rayo.intersectObject(sueloMalla)[0];
  if (!impacto) return;
  const { x, z } = impacto.point;
  const abierta = Object.values(PANELES_HERRAMIENTA).find((p) => p.div.style.display === "block");
  if (abierta) return abierta.h.alClic?.(x, z, e);
  if ($("lluvia").style.display === "block" && colocando) crearTormenta(x, z, +$("radio").value, +$("intensidad").value);
  else if ($("riesgo").style.display === "block") {
    if (herramienta) return crearMedida(x, z);
    if (marcandoInc) return crearIncidencia(x, z);
    const i = Math.floor((x - SIM.x0) / SIM.celda), j = Math.floor((z - SIM.z0) / SIM.celda);
    if (i >= 0 && i < SIM.nx && j >= 0 && j < SIM.ny) explicar(j * SIM.nx + i);
  }
});

// ------------------------------------------------------------ bucle
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  etiquetas.setSize(innerWidth, innerHeight);
});

for (const panel of [$("mapa"), $("lluvia"), $("riesgo")]) ponerAsa(panel);
traducir();
if (matchMedia("(pointer: coarse)").matches) { $("ayuda").dataset.t = "ayudaTactil"; $("ayuda").textContent = t("ayudaTactil"); }
// Escritorio: el menú abierto en «Explorar»; móvil: el mapa limpio y una pista la primera vez
if (!esMovil()) abrirSeccion("explorar");
else {
  let vista = false;
  try { vista = localStorage.getItem("pistaVista") === "si"; localStorage.setItem("pistaVista", "si"); } catch {}
  if (!vista) {
    $("pista").textContent = t("navPista");
    $("pista").style.display = "block";
    setTimeout(() => { $("pista").style.display = "none"; }, 5000);
  }
}
// ?ir=x,z (metros de la maqueta) abre el visor mirando ese punto, para compartir un sitio concreto
{
  const ir = new URLSearchParams(location.search).get("ir")?.split(",").map(Number);
  if (ir?.length === 2 && ir.every(Number.isFinite)) volarA(new THREE.Vector3(ir[0], 0, ir[1]), 0.35);
}
const reloj = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.05);
  if (modo === "coche") conducir(dt);
  else {
    if (vuelo) {
      vuelo.t = Math.min(1, vuelo.t + dt / 1.5);
      const k = vuelo.t * vuelo.t * (3 - 2 * vuelo.t);
      controls.target.lerpVectors(vuelo.desdeT, vuelo.haciaT, k);
      camera.position.lerpVectors(vuelo.desdeC, vuelo.haciaC, k);
      if (vuelo.t === 1) vuelo = null;
    }
    controls.update();
  }
  actualizarLluvia(dt);
  for (const p of Object.values(PANELES_HERRAMIENTA)) p.creada?.cadaFrame?.(dt);
  tiempoReal.cadaFrame(dt);
  pixelado.cadaFrame(dt);
  trafico.cadaFrame(dt);
  farolas.cadaFrame(dt);
  if (pixelado.activo) pixelado.render();
  else renderer.render(scene, camera);
  etiquetas.render(scene, camera);
});
</script>
</body>
