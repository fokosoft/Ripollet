const USOS_ZONA = { A2: "sanitario o docente", A4: "residencial", B1: "residencial y actividades", B2: "residencial y tráfico",
                    C1: "ocio", C2: "industrial" };
const PIE_MC = 1.25;
/** Para buscar: minúsculas, sin acentos ni prefijos («Carrer de», «Avinguda»…). */
const normalizar = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’'`.,]/g, " ")
  .replace(/\b(carrer|calle|c|avinguda|avenida|av|avda|passeig|paseo|pg|placa|plaza|pl|rambla|ronda|cami|camino|passatge|pasaje|ptge|carretera|ctra|travessera|de|del|dels|la|les|el|els|d|l)\b/g, " ")
  .replace(/\s+/g, " ").trim();

const herramientaMicasa = {
  id: "micasa",
  textos: TEXTOS_MICASA,
  crear(ctx, div) {
    const { THREE, D, SIM, t, tx, numero, $ } = ctx;
    const P = ctx.direcciones ?? [];             // [calle, número, x, z, edificio]
    const calles = ctx.DATOS.calles;
    const nEd = ctx.DATOS.edificios;

    // Centro de cada calle (celdas de calzada con esa calle más cercana) y de cada edificio
    const sc = calles.map(() => [0, 0, 0]), se = new Float64Array((nEd + 1) * 3);
    for (let k = 0; k < SIM.nx * SIM.ny; k++) {
      const i = k % SIM.nx, x = SIM.x0 + (i + 0.5) * SIM.celda, z = SIM.z0 + ((k - i) / SIM.nx + 0.5) * SIM.celda;
      const id = D.calles[k], e = D.edificios[k];
      if (id && D.codigos[k] === 6) { sc[id - 1][0] += x; sc[id - 1][1] += z; sc[id - 1][2]++; }
      if (e) { se[e * 3] += x; se[e * 3 + 1] += z; se[e * 3 + 2]++; }
    }
    const centroEd = (e) => (se[e * 3 + 2] ? [se[e * 3] / se[e * 3 + 2], se[e * 3 + 1] / se[e * 3 + 2]] : null);
    const normCalles = calles.map(normalizar);
    const portalesDe = new Map();
    for (const p of P) if (p[4]) portalesDe.set(p[4], [...(portalesDe.get(p[4]) ?? []), p]);

    // ---------------------------------------------------------------- búsqueda
    function buscar(q) {
      const nq = normalizar(q), num = (nq.match(/\b(\d+[a-z]?)\b/) || [])[1];
      const texto = nq.replace(/\b\d+[a-z]?\b/g, "").trim();
      if (!texto) return [];
      const r = [];
      calles.forEach((c, id) => {
        if (!normCalles[id].includes(texto)) return;
        const portales = P.filter((p) => p[0] === id + 1);
        if (num) {
          const exacto = portales.filter((p) => p[1].toLowerCase() === num);
          for (const p of exacto.length ? exacto : []) r.push({ txt: `${c} ${p[1]}`, x: p[2], z: p[3], e: p[4] });
          if (!exacto.length && portales.length) {        // el número más cercano
            const n = parseInt(num, 10), p = portales.reduce((a, b) => (Math.abs(parseInt(b[1], 10) - n) < Math.abs(parseInt(a[1], 10) - n) ? b : a));
            r.push({ txt: `${c} ${p[1]}`, x: p[2], z: p[3], e: p[4] });
          }
        } else if (sc[id][2]) r.push({ txt: c, x: sc[id][0] / sc[id][2], z: sc[id][1] / sc[id][2], e: 0, calle: true });
      });
      const vistos = new Set();       // una fila por dirección (hay portales repetidos)
      return r.filter((x) => !vistos.has(x.txt) && vistos.add(x.txt)).slice(0, 8);
    }

    // ---------------------------------------------------------------- cálculos de la ficha
    const G = crearGrafo(D), nodoPie = nodosDe(G, (e) => G.pie[e]), nodoCoche = nodosDe(G, (e) => G.vel[e] > 0);
    const REFUGIO = /bibliot|c[ií]vic|casal|centre de dia|centre obert/i;
    const destinos = {
      educacion: ctx.DATOS.equipamientos.filter((e) => e.tipo === "educacion"),
      salud: ctx.DATOS.equipamientos.filter((e) => e.tipo === "salud"),
      comida: (ctx.lugaresOsm ?? []).filter((l) => l.c === "comida").map((l) => ({ nombre: l.n || l.t, x: l.x, z: l.z })),
      farmacia: (ctx.lugaresOsm ?? []).filter((l) => l.t === "pharmacy").map((l) => ({ nombre: l.n, x: l.x, z: l.z })),
      bus: (ctx.transporte?.paradas ?? []).map((p) => ({ nombre: p.n, x: p.x, z: p.z })),
      refugio: ctx.DATOS.equipamientos.filter((e) => e.tipo === "social" && REFUGIO.test(e.nombre)),
    };
    for (const lista of Object.values(destinos)) for (const d of lista) d.nodo = nodoCercano(G, d.x, d.z, nodoPie).nodo;
    const bases = ctx.DATOS.equipamientos.filter((e) => e.tipo === "emergencia")
      .map((e) => ({ ...e, nodo: nodoCercano(G, e.x, e.z, nodoCoche).nodo }));
    function agua(e) {
      const res = [];
      for (const mmh of [60, 120]) {
        const q = ctx.INTENSIDADES.indexOf(mmh), F = ctx.FISICA[q];
        if (!F) continue;
        let maxima = 0;
        for (let k = 0; k < SIM.nx * SIM.ny; k++) {
          if (D.edificios[k] !== e) continue;
          const i = k % SIM.nx;
          for (const v of [k - 1, k + 1, k - SIM.nx, k + SIM.nx]) {
            // Solo vía pública, como el panel de riesgo (fuera patios privados, muros, río y edificios)
            if (v < 0 || v >= F.length || (v % SIM.nx === 0 && i === SIM.nx - 1) || D.edificios[v] || !celdaAnalizable(D.codigos[v])) continue;
            maxima = Math.max(maxima, F[v] * 2);
          }
        }
        res.push([mmh, maxima]);
      }
      return res;
    }

    let elegido = 0;
    function ficha(e) {
      elegido = e;
      pintarTecho();
      if (!e) { $("mcFicha").innerHTML = ""; return; }
      const c = centroEd(e);
      const porta = portalesDe.get(e) ?? [];
      const nombre = porta.length
        ? [...new Set(porta.map((p) => calles[p[0] - 1]))].map((cn) => `${cn} ${porta.filter((p) => calles[p[0] - 1] === cn).map((p) => p[1]).join(", ")}`).join(" · ")
        : t("mcSinDireccion", e);
      const filas = [`<b style="font-size:16px">${nombre}</b>`];
      // Agua
      const ag = agua(e).filter(([, cm]) => cm >= 5);
      const sot = ctx.SOTANOS?.[e - 1] ? t("mcSotano") : "";
      filas.push(`<b>${t("mcAgua")}</b><br>` + (ag.length ? ag.map(([m, cm]) => t("mcAguaSi", numero(cm), m)).join("<br>") + sot
                                                           : t("mcAguaNada") + sot));
      // Edificio
      if (ctx.rehab) {
        const R = (q) => ctx.rehab[(e - 1) * 5 + q], letra = " ABCDEFG"[R(4) & 7];
        const partes = [];
        if (R(0)) partes.push(t("mcAnio", R(0)));
        if (R(1)) partes.push(t("mcViv", R(1)));
        partes.push(R(2) ? t("mcCert", `${R(2)} (mediana ${letra})`) : t("mcSinCert"));
        filas.push(`<b>${t("mcEdificio")}</b><br>${partes.join(" · ")}`);
      }
      // Cubierta
      const kwp = ctx.DATOS.solar?.kwp?.[e - 1], kwh = ctx.DATOS.solar?.kwh?.[e - 1];
      if (kwp) filas.push(`<b>${t("mcSolar")}</b><br>${t("mcSolarTxt", numero(kwh / Math.max(kwp, 0.01) / 0.8 * 1, 0), numero(kwh / 1000, 1), numero(kwp, 1))}`);
      // Zona acústica y barrio (de la celda del centro)
      if (c) {
        const k = Math.floor((c[1] - SIM.z0) / SIM.celda) * SIM.nx + Math.floor((c[0] - SIM.x0) / SIM.celda);
        const za = ctx.acustica4m && ctx.DATOS.zonasAcusticas?.lista?.[ctx.acustica4m[k] - 1];
        filas.push(`<b>${t("mcRuido")}</b><br>` + (za ? t("mcRuidoTxt", USOS_ZONA[za.usos] ?? za.usos, za.ld, za.ln) : t("mcSinZona")));
        const s = ctx.secciones4m && ctx.DATOS.secciones?.lista?.[ctx.secciones4m[k] - 1];
        if (s) filas.push(`<b>${t("mcBarrio", s.codigo)}</b><br>${t("mcBarrioTxt", numero(s.poblacion), numero(s.mayores, 1), numero(s.renta), s.indice)}`);
        // Recogida de residuos y planeamiento
        const sec = sectorEn(ctx, c[0], c[1]);
        if (sec) filas.push(`<b>${t("mcResiduos", sec, ctx.residuos.calendarios[sec].nombre)}</b>` +
          `${sectorProbable(ctx, c[0], c[1]) ? t("reProbable") : ""}<br>${t("mcHoy", recogidaDia(ctx, sec, diaVisor(ctx)))}`);
        const cal = calificacionEn(ctx, c[0], c[1]);
        if (cal) filas.push(`<b>${t("mcPlan")}</b><br>${cal.codigo} · ${cal.nombre} (${(tx("familias")[familiaMUC(cal.codigo)] ?? [""])[0]})`);
        // A pie y en coche
        const o = nodoCercano(G, c[0], c[1], nodoPie), { t: T } = tiempos(G, [o.nodo], (a) => (G.pie[a] ? G.largo[a] / PIE_MC : Infinity));
        const cats = tx("mcCats"), lineas = [];
        for (const [cat, lista] of Object.entries(destinos)) {
          if (!lista.length) continue;
          const mejor = lista.reduce((a, b) => (T[b.nodo] < T[a.nodo] ? b : a));
          const min = (T[mejor.nodo] + o.distancia / PIE_MC) / 60;
          lineas.push(min > 30 || !Number.isFinite(min) ? t("mcLejos", cats[cat]) : t("mcMin", cats[cat], Math.max(1, Math.round(min)), mejor.nombre || "—"));
        }
        filas.push(`<b>${t("mcCerca")}</b><br>${lineas.join("<br>")}`);
        const oc = nodoCercano(G, c[0], c[1], nodoCoche);
        const { t: TC } = tiempos(G, [oc.nodo], (a) => (G.vel[a] ? G.largo[a] / (G.vel[a] / 3.6) : Infinity));
        const base = bases.reduce((a, b) => (TC[b.nodo] < TC[a.nodo] ? b : a), bases[0]);
        if (base && Number.isFinite(TC[base.nodo])) filas.push(t("mcCoche", numero((TC[base.nodo] + 10 + oc.distancia / 4) / 60, 1), base.nombre));
        ctx.volarA(new THREE.Vector3(c[0], 0, c[1]), 0.35);
      }
      filas.push(`<button id="mcCompartir">${t("mcCompartir")}</button>`, `<span class="nota">${t("mcNota")}</span>`);
      $("mcFicha").innerHTML = filas.map((f) => `<p style="margin:8px 0">${f}</p>`).join("");
      $("mcCompartir").onclick = () => ctx.compartir({ casa: e });
    }
    function pintarTecho() {
      const T = ctx.capaTechos;
      T.datos.fill(0);
      if (elegido)
        for (let j = 0; j < T.ny; j++)
          for (let i = 0; i < T.nx; i++) {
            const k = j * T.nx + i;
            if (D.techos2m[k] && D.edificios[(j >> 1) * SIM.nx + (i >> 1)] === elegido) T.datos.set([255, 210, 63, 255], k * 4);
          }
      T.actualizar();
    }

    // ---------------------------------------------------------------- panel
    div.innerHTML = `<b data-t="mcTitulo"></b>
      <input id="mcBuscar" type="search" autocomplete="off" style="width:100%;margin-top:8px;font-size:16px;padding:6px 8px">
      <ul id="mcResultados" style="list-style:none;padding:0;margin:4px 0"></ul>
      <p id="mcAyuda" class="nota"></p><div id="mcFicha"></div>`;
    function resultados() {
      const q = $("mcBuscar").value.trim(), r = q.length >= 2 ? buscar(q) : [];
      $("mcResultados").replaceChildren(...r.map((x) => {
        const li = document.createElement("li");
        li.dataset.x = 1;
        Object.assign(li.style, { padding: "8px 6px", borderBottom: "1px solid rgba(128,128,128,.25)", cursor: "pointer" });
        li.textContent = `${x.calle ? "🛣" : "🏠"} ${x.txt}`;
        li.onclick = () => {
          $("mcResultados").replaceChildren();
          $("mcBuscar").value = x.txt;
          if (x.e) ficha(x.e); else { ficha(0); ctx.volarA(new THREE.Vector3(x.x, 0, x.z), 0.6); }
        };
        return li;
      }));
      $("mcAyuda").textContent = q.length >= 2 && !r.length ? t("mcSinResultados") : elegido ? "" : t("mcClic");
    }
    $("mcBuscar").oninput = resultados;
    $("mcBuscar").onkeydown = (ev) => { if (ev.key === "Enter") $("mcResultados").firstChild?.click(); };
    function rotulos() { $("mcBuscar").placeholder = t("mcBuscar"); resultados(); if (elegido) ficha(elegido); }

    return {
      alMostrar() { ctx.capaTechos.ver(true); rotulos(); pintarTecho(); },
      alOcultar() { ctx.capaTechos.ver(false); },
      alClic(x, z, ev) {
        const p = ctx.impacto(ev) ?? { x, z };
        const e = ctx.edificioEn(p.x, p.z);
        if (e) { $("mcBuscar").value = ""; $("mcResultados").replaceChildren(); ficha(e); $("mcAyuda").textContent = ""; }
      },
      enlace: () => (elegido ? { casa: elegido } : {}),
      restaurar(params) { const e = +params.get("casa"); if (e > 0 && e <= nEd) ficha(e); },
      traducir: rotulos,
    };
  },
};
(globalThis.HERRAMIENTAS ??= []).push(herramientaMicasa);

// ===== agenda.js =====
// AGENDA: los actos de la agenda de ripollet.cat en el mapa. web/agenda.json lo actualiza cada día una tarea de
// GitHub (obtener_agenda.py); si no se puede leer (archivo local), se usa la copia que va dentro del visor. Cada acto
// se sitúa por su lugar: equipamientos y lugares con nombre, direcciones del Catastro o el centro de la calle.

const TEXTOS_AGENDA = {
  es: {
    agendaBoton: "📅 Agenda", agTitulo: "Agenda", agHoy: "Hoy", agSemana: "Próximos 7 días", agTodo: "Todo",
    agNinguno: "No hay actos en estas fechas.", agSinLugar: "lugar sin situar en el mapa", agMas: "Más información",
    agActualizado: "{0} actos de la agenda de ripollet.cat{1}.", agCopia: " (copia guardada: sin conexión con la actualizada)",
    agNota: "La agenda se actualiza cada día. El lugar de cada acto se sitúa automáticamente por su nombre o dirección: " +
      "puede fallar; manda la información de la propia agenda.",
  },
  ca: {
    agendaBoton: "📅 Agenda", agTitulo: "Agenda", agHoy: "Avui", agSemana: "Propers 7 dies", agTodo: "Tot",
    agNinguno: "No hi ha actes en aquestes dates.", agSinLugar: "lloc sense situar al mapa", agMas: "Més informació",
    agActualizado: "{0} actes de l'agenda de ripollet.cat{1}.", agCopia: " (còpia desada: sense connexió amb l'actualitzada)",
    agNota: "L'agenda s'actualitza cada dia. El lloc de cada acte se situa automàticament pel nom o l'adreça: pot fallar; " +
      "mana la informació de la mateixa agenda.",
  },
};
const VACIAS = new Set(["de", "del", "dels", "la", "les", "el", "els", "l", "d", "i", "a", "al", "ripollet", "carrer", "c",
                        "calle", "avinguda", "av", "placa", "plaza", "municipal", "parc", "sala", "espai"]);
const palabras = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ")
  .split(/\s+/).filter((w) => w.length > 1 && !VACIAS.has(w));
// Nombres de la agenda que no coinciden con los de OSM
const ALIAS = { "casal de joves": "cal teixell", "biblioteca municipal": "biblioteca publica ripollet" };

const herramientaAgenda = {
  id: "agenda",
  textos: TEXTOS_AGENDA,
  crear(ctx, div) {
    const { THREE, D, SIM, t, numero, $ } = ctx;
    // Candidatos con nombre y posición
    const cand = [];
    for (const e of ctx.DATOS.equipamientos) cand.push({ n: e.nombre, x: e.x, z: e.z });
    for (const l of ctx.lugaresOsm ?? []) if (l.n) cand.push({ n: l.n, x: l.x, z: l.z });
    for (const l of ctx.DATOS.lugares) cand.push({ n: l.nombre, x: l.pos[0], z: l.pos[2] });
    {   // centro de cada calle (celdas de calzada)
      const sc = ctx.DATOS.calles.map(() => [0, 0, 0]);
      for (let k = 0; k < SIM.nx * SIM.ny; k++) {
        const id = D.calles[k];
        if (!id || D.codigos[k] !== 6) continue;
        const i = k % SIM.nx;
        sc[id - 1][0] += SIM.x0 + (i + 0.5) * SIM.celda; sc[id - 1][1] += SIM.z0 + ((k - i) / SIM.nx + 0.5) * SIM.celda; sc[id - 1][2]++;
      }
      ctx.DATOS.calles.forEach((c, q) => { if (sc[q][2]) cand.push({ n: c, x: sc[q][0] / sc[q][2], z: sc[q][1] / sc[q][2], calle: true }); });
    }
    for (const c of cand) c.w = new Set(palabras(c.n));
    /** Posición de un lugar: el candidato con más palabras en común (todas las del candidato, si es corto). */
    function situar(lugar) {
      let texto = lugar.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      for (const [a, b] of Object.entries(ALIAS)) if (texto.includes(a)) texto = b;
      const w = palabras(texto);
      if (!w.length) return null;
      let mejor = null, nota = 0;
      for (const c of cand) {
        const comunes = w.filter((p) => c.w.has(p)).length;
        if (!comunes) continue;
        const s = comunes / Math.max(c.w.size, w.length) + (c.calle ? 0 : 0.05);
        if (s > nota) { nota = s; mejor = c; }
      }
      return nota >= 0.5 ? mejor : null;
    }

    let actos = [], copia = false, filtro = "semana", elegido = -1;
    const grupo = new THREE.Group();
    grupo.visible = false;
    ctx.scene.add(grupo);
    const marcas = [];
    async function cargar() {
      for (const url of ["agenda.json", "web/agenda.json"]) {
        try {
          const r = await fetch(url, { cache: "no-cache" });
          if (r.ok) { actos = (await r.json()).actos; copia = false; break; }
        } catch {}
      }
      if (!actos.length && ctx.agendaLocal) { actos = ctx.agendaLocal.actos; copia = true; }
      for (const a of actos) {
        const p = situar(a.lugar || "");
        a.pos = p ? [p.x, p.z] : null;
        if (!p) continue;
        const d = document.createElement("div");
        d.className = "marca";
        Object.assign(d.style, { background: "#fff", color: "#1d2230", border: "2px solid #b83232", width: "22px", height: "22px", fontSize: "12px" });
        d.textContent = "📅";
        d.title = a.titulo;
        const o = new ctx.CSS2DObject(d);
        o.position.set(p.x, ctx.altura(p.x, p.z) + 7, p.z);
        grupo.add(o);
        marcas.push([a, o]);
      }
      lista();
    }
    const fechaAc = (a) => new Date(a.inicio);
    const lengua = () => (ctx.idioma() === "ca" ? "ca-ES" : "es-ES");
    function visibles() {
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      const fin = new Date(hoy.getTime() + (filtro === "hoy" ? 1 : 7) * 864e5);
      return actos.filter((a) => {
        const ini = fechaAc(a), acaba = a.fin ? new Date(a.fin) : ini;
        return filtro === "todo" || (acaba >= hoy && ini < fin);
      });
    }
    function lista() {
      const v = visibles(), set = new Set(v);
      for (const [a, o] of marcas) o.visible = set.has(a);
      for (const b of div.querySelectorAll("[data-filtro]")) b.classList.toggle("principal", b.dataset.filtro === filtro);
      $("agEstado").textContent = t("agActualizado", actos.length, copia ? t("agCopia") : "");
      if (!v.length) { $("agLista").innerHTML = `<li>${t("agNinguno")}</li>`; return; }
      const esc = (s) => String(s ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" })[c]);
      $("agLista").replaceChildren(...v.map((a) => {
        const li = document.createElement("li"), ini = fechaAc(a);
        li.style.margin = "6px 0";
        li.dataset.x = 1;
        const cuando = ini.toLocaleString(lengua(), { weekday: "short", day: "numeric", month: "short",
                                                       ...(ini.getHours() || ini.getMinutes() ? { hour: "2-digit", minute: "2-digit" } : {}) });
        li.innerHTML = `<b>${esc(a.titulo)}</b><br><small>${esc(cuando)} · ${esc(a.lugar || "—")}${a.pos ? "" : ` (${t("agSinLugar")})`}` +
          ` · <a href="${esc(a.url)}" target="_blank" rel="noopener">${t("agMas")}</a></small>`;
        li.onclick = (e) => { if (e.target.tagName !== "A" && a.pos) ctx.volarA(new THREE.Vector3(a.pos[0], 0, a.pos[1]), 0.4); };
        return li;
      }));
    }
    div.innerHTML = `<b data-t="agTitulo"></b>
      <div class="botones"><button data-filtro="hoy" data-t="agHoy"></button><button data-filtro="semana" data-t="agSemana"></button>
        <button data-filtro="todo" data-t="agTodo"></button></div>
      <ul id="agLista" style="list-style:none;padding:0;margin:6px 0"></ul>
      <p class="nota" id="agEstado"></p><p class="nota" data-t="agNota"></p>`;
    for (const b of div.querySelectorAll("[data-filtro]")) b.onclick = () => { filtro = b.dataset.filtro; lista(); };
    let cargado = false;
    return {
      alMostrar() { grupo.visible = true; if (!cargado) { cargado = true; cargar(); } else lista(); },
      alOcultar() { grupo.visible = false; },
      traducir() { if (cargado) lista(); },
    };
  },
};
(globalThis.HERRAMIENTAS ??= []).push(herramientaAgenda);

// ===== tiempo_real.js =====
// TIEMPO REAL en el mapa: el sol está donde está ahora en Ripollet (día, noche, amanecer y ocaso, con su luz y sus
// sombras) y el tiempo es el de ahora (Open-Meteo, sin clave): nubes que apagan el sol, niebla, lluvia que se ve caer,
// temperatura y viento. Un deslizador mueve la hora para ver el día entero; «Ahora» vuelve al presente.

const TEXTOS_TIEMPO = {
  es: {
    trActivar: "🕐 Tiempo real", trDesactivar: "🕐 Quitar tiempo real", trAhora: "Ahora",
    trHora: "Hora: <b>{0}</b> {1}", trEnDirecto: "(en directo)", trSimulada: "(simulada)",
    trCargando: "consultando el tiempo…", trSinDatos: "sin datos del tiempo (¿sin internet?)",
    trViento: "💨 {0} km/h del {1}", trLluvia: "🌧 {0} mm", trNoche: "noche",
    trFuente: "Tiempo: Open-Meteo · actualizado a las {0}",
    trCielos: { 0: "despejado", 1: "poco nuboso", 2: "nubes y claros", 3: "cubierto", 45: "niebla", 51: "llovizna",
                61: "lluvia", 71: "nieve", 80: "chubascos", 95: "tormenta" },
    trRumbos: ["N", "NE", "E", "SE", "S", "SO", "O", "NO"],
  },
  ca: {
    trActivar: "🕐 Temps real", trDesactivar: "🕐 Treure temps real", trAhora: "Ara",
    trHora: "Hora: <b>{0}</b> {1}", trEnDirecto: "(en directe)", trSimulada: "(simulada)",
    trCargando: "consultant el temps…", trSinDatos: "sense dades del temps (sense internet?)",
    trViento: "💨 {0} km/h del {1}", trLluvia: "🌧 {0} mm", trNoche: "nit",
    trFuente: "Temps: Open-Meteo · actualitzat a les {0}",
    trCielos: { 0: "serè", 1: "poc ennuvolat", 2: "núvols i clarianes", 3: "cobert", 45: "boira", 51: "plugim",
                61: "pluja", 71: "neu", 80: "ruixats", 95: "tempesta" },
    trRumbos: ["N", "NE", "E", "SE", "S", "SO", "O", "NO"],
  },
};

const URL_TIEMPO = "https://api.open-meteo.com/v1/forecast?latitude=41.5025&longitude=2.1553" +
  "&current=temperature_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m" +
  "&wind_speed_unit=ms&timezone=Europe%2FMadrid";
const grupoCielo = (c) => (c <= 0 ? 0 : c <= 3 ? c : c < 50 ? 45 : c < 60 ? 51 : c < 70 ? 61 : c < 80 ? 71 : c < 95 ? 80 : 95);
const ICONO = { 0: "☀️", 1: "🌤", 2: "⛅", 3: "☁️", 45: "🌫", 51: "🌦", 61: "🌧", 71: "❄️", 80: "🌦", 95: "⛈" };

/** Fecha y hora de reloj en Ripollet (Europe/Madrid), sea cual sea la zona del ordenador. */
function ahoraEnRipollet() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Madrid", year: "numeric",
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  return { fecha: new Date(Date.UTC(+p.year, +p.month - 1, +p.day, 12)), hora: +p.hour + +p.minute / 60 };
}
const horaTexto = (h) => `${Math.floor(h)}:${String(Math.floor((h % 1) * 60 + 1e-6)).padStart(2, "0")}`;

function crearTiempoReal(ctx, div) {
  const { THREE, scene, sol, cielo, dirSol, t, tx, numero, $ } = ctx;
  let activo = true, desfase = null;
  try { activo = localStorage.getItem("tiempoReal") !== "no"; } catch {}     // desfase: hora elegida con el deslizador (null = en directo)
  let clima = null, error = false, consultado = null, espera = 0, oscuridad = 0;

  div.innerHTML = `<div id="trTexto" style="margin-top:6px"></div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
      <input type="range" id="trHora" min="0" max="23.75" step="0.25" style="flex:1">
      <button id="trAhora"></button><button id="trBoton"></button></div>
    <div class="nota" id="trFuente" style="margin-top:2px"></div>`;

  // ---------------------------------------------------------------- lluvia que se ve caer (alrededor de la vista)
  const N = 5000, CAJA = 360, ALTO = 140;
  const pos = new Float32Array(N * 6), gota = new Float32Array(N * 4);
  for (let k = 0; k < N; k++) {
    const x = (Math.random() - 0.5) * CAJA, z = (Math.random() - 0.5) * CAJA, f = Math.random();
    for (let e = 0; e < 2; e++) { pos.set([x, 0, z], (k * 2 + e) * 3); gota.set([f, e], (k * 2 + e) * 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("gota", new THREE.BufferAttribute(gota, 2));
  const viento = { value: new THREE.Vector2() };
  const lluvia = new THREE.LineSegments(geo, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { tiempo: ctx.tiempoGotas, alto: { value: ALTO }, viento,
                // Borde de la maqueta: fuera de él no llueve (no hay mapa debajo)
                borde: { value: new THREE.Vector4(ctx.SIM.x0, ctx.SIM.z0, ctx.SIM.x0 + ctx.SIM.nx * ctx.SIM.celda,
                                                  ctx.SIM.z0 + ctx.SIM.ny * ctx.SIM.celda) } },
    vertexShader: `
      attribute vec2 gota;
      uniform float tiempo, alto;
      uniform vec2 viento;
      uniform vec4 borde;
      varying float vA;
      void main() {
        float y = alto - mod(tiempo * 30.0 + gota.x * alto, alto);
        vec3 p = vec3(position.x + viento.x * (alto - y) * 0.03, y + gota.y * 4.0, position.z + viento.y * (alto - y) * 0.03);
        p.xz -= viento * gota.y * 0.12;                      // la gota se inclina con el viento
        vA = 1.0 - gota.y;
        vec4 mundo = modelMatrix * vec4(p, 1.0);
        if (mundo.x < borde.x || mundo.z < borde.y || mundo.x > borde.z || mundo.z > borde.w) vA = -1.0;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `varying float vA; void main() { if (vA < 0.0) discard; gl_FragColor = vec4(0.8, 0.86, 0.94, 0.1 + 0.45 * vA); }`,
  }));
  Object.assign(lluvia, { frustumCulled: false, visible: false });
  scene.add(lluvia);

  // ---------------------------------------------------------------- luz y cielo
  const C = (h) => new THREE.Color(h);
  const NOCHE = { real: C(0x14214a), arte: C(0x24336e) }, DIA = { real: C(0xbfe0f5), arte: C(0x5f93dc) };
  const NIEBLA_DIA = { real: C(0xbfe0f5), arte: C(0x9cc0ec) }, GRIS = C(0x9aa6b2), OCASO = C(0xf2a46b);
  const LUZ_SOL = C(0xfff2dd), LUZ_OCASO = C(0xffb070), LUZ_LUNA = C(0x9fb8ff);

  function horaActual() {
    const a = ahoraEnRipollet();
    return desfase === null ? a : { fecha: a.fecha, hora: desfase };
  }

  /** Coloca el sol y pinta el cielo según la hora y el tiempo. Se llama al cambiar algo y cada 20 s. */
  function aplicar() {
    if (!activo) return;
    const arte = ctx.estiloArte() ? "arte" : "real";
    const base = { sol: arte === "arte" ? 2.0 : 2.4, cielo: arte === "arte" ? 2.2 : 1.6 };
    // Con la herramienta de sombra abierta, ella decide dónde está el sol: aquí solo luz de día
    const libre = ctx.solLibre();
    const { fecha, hora } = horaActual();
    const s = posicionSol(fecha, hora), sinE = Math.sin(s.elevacion);
    const dia = libre ? THREE.MathUtils.smoothstep(sinE, -0.1, 0.12) : 1;
    // Alumbrado: se enciende al anochecer (sol a ~3° sobre el horizonte) y del todo con la noche cerrada
    oscuridad = libre ? 1 - THREE.MathUtils.smoothstep(sinE, -0.08, 0.05) : 0;
    const ocaso = libre ? Math.exp(-((((s.elevacion * 180 / Math.PI) - 1) / 6) ** 2)) : 0;
    const vivo = desfase === null && clima;        // el tiempo de ahora solo vale para la hora de ahora
    const nubes = vivo ? clima.nubes / 100 : 0, cod = vivo ? grupoCielo(clima.codigo) : 0;
    const niebla = cod === 45 ? 1 : 0;

    if (libre) {
      if (sinE > -0.02) dirSol.set(Math.sin(s.azimut) * Math.cos(s.elevacion), Math.max(0.05, sinE),
                                   -Math.cos(s.azimut) * Math.cos(s.elevacion)).normalize();
      else dirSol.set(0.3, 1, 0.25).normalize();     // de noche, luz de luna desde arriba
      if (ctx.enMapa()) ctx.sombrasMapa();
    }
    const fondo = NOCHE[arte].clone().lerp(DIA[arte].clone().lerp(GRIS, Math.max(nubes * 0.75, niebla * 0.6)), dia)
      .lerp(OCASO, ocaso * 0.45 * (1 - nubes));
    scene.background.copy(fondo);
    scene.fog.color.copy(NOCHE[arte].clone().lerp(NIEBLA_DIA[arte].clone().lerp(GRIS, Math.max(nubes * 0.6, niebla)), dia));
    if (ctx.enMapa()) {
      const k = ctx.vista?.escala ?? 1;                // con el teleobjetivo de la maqueta, todo está más lejos
      scene.fog.near = (niebla ? 500 : cod >= 51 ? 1200 : 1800) * k;
      scene.fog.far = (niebla ? 1800 : cod >= 51 ? 3500 : 4500) * k;
    }
    const deDia = sinE > -0.02 || !libre;
    sol.intensity = deDia ? base.sol * Math.max(dia, 0.08) * (1 - 0.7 * nubes) * (1 - 0.5 * niebla) : base.sol * 0.22;
    sol.color.copy(deDia ? LUZ_SOL.clone().lerp(LUZ_OCASO, ocaso) : LUZ_LUNA);
    cielo.intensity = base.cielo * (0.45 + 0.55 * dia);
    cielo.color.copy(C(0x5a6fa8).lerp(C(0xffffff), dia));
    // Lluvia visible: solo con el tiempo de ahora y si está lloviendo
    const mm = vivo ? clima.lluvia : 0;
    lluvia.visible = mm > 0.05 || (vivo && cod >= 51 && cod !== 71);
    geo.setDrawRange(0, 2 * Math.round(N * THREE.MathUtils.clamp(Math.max(mm, 0.4) / 4, 0.15, 1)));
    if (vivo) {
      const a = clima.dirViento * Math.PI / 180;    // viene de ahí: sopla hacia el lado contrario
      viento.value.set(-Math.sin(a), Math.cos(a)).multiplyScalar(clima.viento);
    }
    rotulos();
  }

  function apagar() {
    oscuridad = 0;
    lluvia.visible = false;
    dirSol.set(-0.4, 1, 0.3).normalize();
    sol.color.copy(LUZ_SOL);
    cielo.color.set(0xffffff);
    if (ctx.enMapa()) { scene.fog.near = 1800 * (ctx.vista?.escala ?? 1); scene.fog.far = 4500 * (ctx.vista?.escala ?? 1); ctx.sombrasMapa(); }
    ctx.restaurarEstilo();
  }

  async function consultar() {
    try {
      const r = await fetch(URL_TIEMPO);
      if (!r.ok) throw new Error(r.status);
      const c = (await r.json()).current;
      clima = { temperatura: c.temperature_2m, lluvia: c.precipitation, codigo: c.weather_code, nubes: c.cloud_cover,
                viento: c.wind_speed_10m, dirViento: c.wind_direction_10m };
      consultado = horaTexto(ahoraEnRipollet().hora);
      error = false;
    } catch { error = true; }
    aplicar();
  }

  function rotulos() {
    const { hora } = horaActual();
    const partes = [t("trHora", horaTexto(hora), t(desfase === null ? "trEnDirecto" : "trSimulada"))];
    if (desfase === null && clima) {
      const cod = grupoCielo(clima.codigo), s = posicionSol(horaActual().fecha, hora);
      const icono = s.elevacion < 0 && cod <= 1 ? "🌙" : ICONO[cod];
      partes.push(`${icono} ${numero(clima.temperatura, 0)} °C, ${tx("trCielos")[cod]}`,
                  t("trViento", numero(clima.viento * 3.6, 0), tx("trRumbos")[Math.round(clima.dirViento / 45) % 8]));
      if (clima.lluvia > 0) partes.push(t("trLluvia", numero(clima.lluvia, 1)));
    } else if (desfase === null) partes.push(t(error ? "trSinDatos" : "trCargando"));
    $("trTexto").innerHTML = activo ? partes.join(" · ") : "";
    // Resumen corto en la barra de arriba: icono, hora y temperatura
    const chip = document.getElementById("chipTiempo");
    if (chip) {
      const cod = clima && desfase === null ? grupoCielo(clima.codigo) : null;
      const noche = posicionSol(horaActual().fecha, hora).elevacion < 0;
      const icono = cod === null ? (noche ? "🌙" : "☀️") : noche && cod <= 1 ? "🌙" : ICONO[cod];
      chip.textContent = `${icono} ${horaTexto(hora)}${clima && desfase === null ? ` · ${numero(clima.temperatura, 0)}°` : ""}`;
    }
    $("trHora").style.display = $("trAhora").style.display = activo ? "" : "none";
    $("trHora").value = String(hora);
    $("trHora").setAttribute("aria-label", t("trHora", horaTexto(hora), "").replace(/<[^>]+>/g, ""));
    $("trAhora").textContent = t("trAhora");
    $("trAhora").disabled = desfase === null;
    $("trBoton").textContent = t(activo ? "trDesactivar" : "trActivar");
    $("trFuente").textContent = activo && consultado ? t("trFuente", consultado) : "";
  }

  $("trHora").oninput = () => { desfase = +$("trHora").value; aplicar(); api.alCambiarHora?.(); };
  $("trAhora").onclick = () => { desfase = null; aplicar(); api.alCambiarHora?.(); };
  $("trBoton").onclick = () => {
    activo = !activo;
    try { localStorage.setItem("tiempoReal", activo ? "si" : "no"); } catch {}
    if (activo) aplicar(); else { apagar(); rotulos(); }
  };
  consultar.ultima = Date.now();
  consultar();
  if (activo) aplicar(); else rotulos();

  const api = {
    aplicar,
    traducir: rotulos,
    hora: horaActual,              // la de ahora o la del deslizador (tráfico, gente)
    alCambiarHora: null,
    noche: () => oscuridad,        // 0 de día · 1 de noche (farolas)
    /** Viento de ahora para otras herramientas (incendio): { v en m/s, dir de donde viene en grados } o null. */
    clima: () => (activo && clima ? { viento: clima.viento, dirViento: clima.dirViento, lluvia: clima.lluvia } : null),
    cadaFrame(dt) {
      if (lluvia.visible) {
        const c = ctx.enMapa() ? ctx.controls.target : ctx.camera.position;
        lluvia.position.set(c.x, ctx.altura(c.x, c.z), c.z);
      }
      if (!activo) return;
      espera -= dt;
      if (espera > 0) return;
      espera = 20;                                   // el sol y el reloj, cada 20 s
      aplicar();
      if (desfase === null && Date.now() - (consultar.ultima ?? 0) > 10 * 60 * 1000) {   // el tiempo, cada 10 min
        consultar.ultima = Date.now();
        consultar();
      }
    },
  };
  return api;
}

// ===== pixel.js =====
// MAQUETA PÍXEL: la escena se dibuja a baja resolución y se amplía con píxeles nítidos, con paleta limitada
// (32 colores de diorama), tramado ordenado opcional y contornos donde cambia la profundidad, como un diorama de pixel art.
// La vista «maqueta» usa un teleobjetivo (casi isométrica) y gira de 90 en 90°. Además es más ligera: con píxeles
// de 4, la GPU dibuja 16 veces menos.

const TEXTOS_PIXEL = {
  es: {
    vsTitulo: "🎛 Vista", vsPixel: "Píxel", vs3d: "3D", vsTam: "Tamaño del píxel: <b>{0}</b>", vsPaleta: "Paleta",
    vsTramado: "Tramado", vsContornos: "Contornos", vsMaqueta: "Maqueta", vsIzq: "⟲ Girar", vsDer: "Girar ⟳",
    vsCalidad: "Calidad", vsAlta: "Alta (con sombras)", vsLigera: "Ligera (PC modesto o móvil)",
  },
  ca: {
    vsTitulo: "🎛 Vista", vsPixel: "Píxel", vs3d: "3D", vsTam: "Mida del píxel: <b>{0}</b>", vsPaleta: "Paleta",
    vsTramado: "Tramat", vsContornos: "Contorns", vsMaqueta: "Maqueta", vsIzq: "⟲ Girar", vsDer: "Girar ⟳",
    vsCalidad: "Qualitat", vsAlta: "Alta (amb ombres)", vsLigera: "Lleugera (PC modest o mòbil)",
  },
};

// Paleta de diorama (sRGB): grises limpios, verdes de césped, tierras, tejas, asfalto, agua y acentos
const PALETA = ["ffffff", "f4f4f2", "d9dad6", "b0b3b8", "8a8f99", "5f6470", "3c404a", "23262d", "16181d",
  "f5ead0", "e3c9a0", "c9a27a", "a8744f", "7a4b32", "54301f",
  "8cc63f", "5aa63a", "3e8a3a", "2c6b30", "3fa7a0",
  "e05a4a", "b8322f", "7d1f24", "f29ab0", "f08a3c", "f2c14e", "f7e08a",
  "9fd3f0", "4ea3d8", "2a6db0", "1f3f74", "2e3138"];
const FOV_MAQUETA = 14;

function crearPixelado(ctx, div) {
  const { THREE, renderer, scene, camera, controls, t, $ } = ctx;
  const leer = (k, d) => { try { const v = localStorage.getItem("pixel." + k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem("pixel." + k, JSON.stringify(v)); } catch {} };
  const parametros = new URLSearchParams(location.search);
  const op = {
    activo: parametros.has("real") || parametros.has("arte") ? false : leer("activo", true),
    tam: leer("tam", 4), paleta: leer("paleta", true), tramado: leer("tramado", false), contornos: leer("contornos", true),
    maqueta: parametros.has("real") ? false : leer("maqueta", true),
    // Ligera: sin sombras proyectadas (lo más caro) y resolución 1:1; por defecto en pantallas táctiles
    calidad: leer("calidad", matchMedia("(pointer: coarse)").matches ? "ligera" : "alta"),
  };

  const rt = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                                                 depthTexture: new THREE.DepthTexture(1, 1) });
  const fondoClaro = new THREE.Color(0xeef0f4);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tColor: { value: rt.texture }, tDepth: { value: rt.depthTexture }, uTam: { value: new THREE.Vector2(1, 1) },
      uNear: { value: 1 }, uFar: { value: 1e4 }, uPaleta: { value: 1 }, uTramado: { value: 0 }, uContornos: { value: 1 },
      uFondo: { value: new THREE.Color() }, uDesp: { value: new THREE.Vector2() }, uPal: { value: PALETA.map((h) => new THREE.Color("#" + h).convertLinearToSRGB()) },
    },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tColor, tDepth;
      uniform vec2 uTam, uDesp;
      uniform float uNear, uFar, uPaleta, uTramado, uContornos;
      uniform vec3 uFondo;
      uniform vec3 uPal[32];
      varying vec2 vUv;
      float lineal(float d) { float z = d * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
      vec3 aSRGB(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
      float bayer(vec2 p) {
        int i = int(mod(p.x, 4.0)) + 4 * int(mod(p.y, 4.0));
        float m[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
        return m[i] / 16.0 - 0.47;
      }
      void main() {
        vec2 uv = vUv + uDesp;                        // el resto del encaje al píxel (ver render)
        float d0 = texture2D(tDepth, uv).r;
        vec3 c = d0 >= 0.99999 ? uFondo : aSRGB(texture2D(tColor, uv).rgb);
        // Contorno: este píxel está delante de un vecino bastante más lejano (borde de un objeto o de la maqueta)
        float borde = 0.0;
        if (uContornos > 0.5 && d0 < 0.99999) {
          float l0 = lineal(d0), umbral = max(0.8, l0 * 0.012);
          vec2 p = 1.0 / uTam;
          for (int k = 0; k < 4; k++) {
            vec2 o = k == 0 ? vec2(p.x, 0.0) : k == 1 ? vec2(-p.x, 0.0) : k == 2 ? vec2(0.0, p.y) : vec2(0.0, -p.y);
            float d = texture2D(tDepth, uv + o).r;
            if ((d >= 0.99999 ? 1e9 : lineal(d)) - l0 > umbral) borde = 1.0;
          }
        }
        if (uPaleta > 0.5 && d0 < 0.99999) {
          float lum = dot(c, vec3(0.299, 0.587, 0.114));
          c = clamp(mix(vec3(lum), c, 1.15), 0.0, 1.0);                 // un poco más de color, como el pixel art
          if (uTramado > 0.5) c += bayer(floor(uv * uTam)) * 0.09;
          vec3 mejor = uPal[0]; float dm = 1e9;
          for (int q = 0; q < 32; q++) {
            vec3 e = c - uPal[q];
            float dd = dot(e * e, vec3(2.0, 4.0, 3.0));
            if (dd < dm) { dm = dd; mejor = uPal[q]; }
          }
          c = mejor;
        }
        c = mix(c, vec3(0.09, 0.08, 0.15), borde * 0.75);
        gl_FragColor = vec4(c, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });
  const derecha = new THREE.Vector3(), arriba = new THREE.Vector3(), guardada = new THREE.Vector3();
  const escenaQuad = new THREE.Scene(), camQuad = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  escenaQuad.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

  function render() {
    const w = Math.max(1, Math.floor(innerWidth / op.tam)), h = Math.max(1, Math.floor(innerHeight / op.tam));
    if (rt.width !== w || rt.height !== h) { rt.setSize(w, h); mat.uniforms.uTam.value.set(w, h); }
    const U = mat.uniforms;
    U.uNear.value = camera.near; U.uFar.value = camera.far;
    U.uPaleta.value = +op.paleta; U.uTramado.value = +op.tramado; U.uContornos.value = +op.contornos;
    // Fondo claro como en un diorama; de noche, el del cielo aclarado
    U.uFondo.value.copy(scene.background).lerp(fondoClaro, 0.7).convertLinearToSRGB();
    // Sin bruma: el diorama se ve limpio de punta a punta (solo cambian números, no hay que recompilar)
    const niebla = scene.fog, cerca = niebla?.near, lejos = niebla?.far;
    if (niebla) { niebla.near = 1e7; niebla.far = 2e7; }
    // ENCAJE AL PÍXEL: la cámara se mueve a saltos de un píxel grande (lo que mide un píxel a la distancia del punto
    // que se mira) y la imagen final se desplaza el resto. Al arrastrar el mapa, cada cosa sigue en sus mismos
    // píxeles en vez de «bailar» (bordes, ventanas y líneas que cambian de forma en cada fotograma).
    const tamPix = 2 * camera.position.distanceTo(controls.target) * Math.tan(camera.fov * Math.PI / 360) / h;
    derecha.setFromMatrixColumn(camera.matrixWorld, 0); arriba.setFromMatrixColumn(camera.matrixWorld, 1);
    const pd = camera.position.dot(derecha) / tamPix, pa = camera.position.dot(arriba) / tamPix;
    const fd = pd - Math.round(pd), fa = pa - Math.round(pa);
    guardada.copy(camera.position);
    camera.position.addScaledVector(derecha, -fd * tamPix).addScaledVector(arriba, -fa * tamPix);
    camera.updateMatrixWorld();
    U.uDesp.value.set(fd / w, fa / h);
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    camera.position.copy(guardada);
    camera.updateMatrixWorld();
    if (niebla) { niebla.near = cerca; niebla.far = lejos; }
    renderer.setRenderTarget(null);
    renderer.render(escenaQuad, camQuad);
  }

  // ---------------------------------------------------------------- vista maqueta (teleobjetivo) y giros
  const K = Math.tan((40 / 2) * Math.PI / 180) / Math.tan((FOV_MAQUETA / 2) * Math.PI / 180);
  let enMaqueta = false, giro = null;
  function ponerMaqueta(si) {
    if (si === enMaqueta || !ctx.enMapa()) return;
    enMaqueta = si;
    const f = si ? K : 1 / K;
    camera.position.sub(controls.target).multiplyScalar(f).add(controls.target);
    camera.fov = si ? FOV_MAQUETA : 40;
    camera.near = si ? 20 : 1;
    camera.far = si ? 40000 : 10000;
    camera.updateProjectionMatrix();
    controls.minDistance *= f;
    controls.maxDistance *= f;
    ctx.vista.escala = si ? K : 1;
    ctx.scene.fog.near *= f;
    ctx.scene.fog.far *= f;
  }
  function girar(signo) { if (!giro) giro = { hecho: 0, total: signo * Math.PI / 2 }; }

  // ---------------------------------------------------------------- panel
  div.innerHTML = `<summary data-t="vsTitulo"></summary>
    <div class="botones"><button id="vsPixel" data-t="vsPixel"></button><button id="vs3d" data-t="vs3d"></button>
      <button id="vsMaqueta" data-t="vsMaqueta"></button><button id="vsIzq" data-t="vsIzq"></button>
      <button id="vsDer" data-t="vsDer"></button></div>
    <label style="display:block;margin-top:6px"><span id="vsTamT"></span>
      <input type="range" id="vsTam" min="2" max="8" step="1" value="${op.tam}"></label>
    <label><input type="checkbox" id="vsPaleta"> <span data-t="vsPaleta"></span></label>
    <label><input type="checkbox" id="vsTramado"> <span data-t="vsTramado"></span></label>
    <label><input type="checkbox" id="vsContornos"> <span data-t="vsContornos"></span></label>
    <label style="display:block;margin-top:6px"><span data-t="vsCalidad"></span> <select id="vsCalidad"></select></label>`;
  function rotulos() {
    $("vsPixel").classList.toggle("principal", op.activo);
    $("vs3d").classList.toggle("principal", !op.activo);
    $("vsMaqueta").classList.toggle("principal", enMaqueta);
    $("vsTamT").innerHTML = t("vsTam", op.tam);
    for (const k of ["paleta", "tramado", "contornos"]) {
      const c = $("vs" + k[0].toUpperCase() + k.slice(1));
      c.checked = op[k];
      c.disabled = !op.activo;
    }
    $("vsTam").disabled = !op.activo;
    document.body.classList.toggle("claro", op.activo);
    $("vsCalidad").innerHTML = `<option value="alta">${t("vsAlta")}</option><option value="ligera">${t("vsLigera")}</option>`;
    $("vsCalidad").value = op.calidad;
  }
  const cambiar = (k, v) => { op[k] = v; guardar(k, v); rotulos(); };
  $("vsPixel").onclick = () => cambiar("activo", true);
  $("vs3d").onclick = () => cambiar("activo", false);
  $("vsMaqueta").onclick = () => { ponerMaqueta(!enMaqueta); cambiar("maqueta", enMaqueta); };
  $("vsIzq").onclick = () => girar(1);
  $("vsDer").onclick = () => girar(-1);
  $("vsTam").oninput = () => cambiar("tam", +$("vsTam").value);
  for (const k of ["paleta", "tramado", "contornos"])
    $("vs" + k[0].toUpperCase() + k.slice(1)).onchange = (e) => cambiar(k, e.target.checked);
  function aplicarCalidad() {
    ctx.sol.castShadow = op.calidad === "alta";
    renderer.setPixelRatio(op.calidad === "alta" ? Math.min(devicePixelRatio, 2) : 1);
    renderer.setSize(innerWidth, innerHeight);
  }
  $("vsCalidad").onchange = () => { cambiar("calidad", $("vsCalidad").value); aplicarCalidad(); };
  aplicarCalidad();
  if (op.maqueta) ponerMaqueta(true);
  rotulos();

  return {
    get activo() { return op.activo; },
    render,
    traducir: rotulos,
    /** El coche pone su propia cámara: al entrar se deja la maqueta (sin tocar nada) y al salir se recupera. */
    alEntrarCoche() { if (enMaqueta) { enMaqueta = false; ctx.vista.escala = 1; controls.minDistance /= K; controls.maxDistance /= K; } },
    alSalirCoche() { if (op.maqueta) ponerMaqueta(true); rotulos(); },
    cadaFrame(dt) {
      if (!giro) return;
      const paso = Math.sign(giro.total) * Math.min(Math.abs(giro.total - giro.hecho), dt * Math.PI);   // 90° en 0,5 s
      giro.hecho += paso;
      camera.position.sub(controls.target).applyAxisAngle(new THREE.Vector3(0, 1, 0), paso).add(controls.target);
      camera.lookAt(controls.target);
      if (Math.abs(giro.total - giro.hecho) < 1e-6) giro = null;
    },
  };
}

// ===== trafico.js =====
// TRÁFICO Y GENTE: coches por el grafo de calles y peatones por aceras y caminos, en la cantidad que toca a cada
// hora. No hay aforos públicos de las calles de Ripollet: la intensidad media diaria (IMD) se estima por tipo de vía
// y se reparte con la curva horaria típica de un día laborable o festivo. Si se tienen aforos reales, se ponen en
// AFOROS (nombre de la calle → vehículos/día) y mandan sobre la estimación.
// Gráficos mínimos: una caja por coche y un palito por persona, todos con instancias (2 llamadas a la GPU).

const TEXTOS_TRAFICO = {
  es: {
    tfActivo: "🚗 {0} coches · 🚶 {1} personas ahora", tfApagado: "🚗 Tráfico y gente", tfQuitar: "Quitar",
    tfPoner: "Mostrar", tfVolumen: "≈ {0} vehículos/día por las calles de la maqueta (estimado por tipo de vía{1})",
    tfConAforos: "; {0} calles con aforo real",
  },
  ca: {
    tfActivo: "🚗 {0} cotxes · 🚶 {1} persones ara", tfApagado: "🚗 Trànsit i gent", tfQuitar: "Treure",
    tfPoner: "Mostrar", tfVolumen: "≈ {0} vehicles/dia pels carrers de la maqueta (estimat per tipus de via{1})",
    tfConAforos: "; {0} carrers amb aforament real",
  },
};

// Aforos reales (vehículos/día, los dos sentidos) por nombre de calle, tal como sale en el visor. Vacío: no hay
// datos públicos. Ejemplo: { "Rambla de Sant Jordi": 9500 }
const AFOROS = {};
// IMD estimada según la velocidad de la vía (que sale de su tipo en OSM): autopista, vía rápida, principal…
const IMD_POR_VELOCIDAD = { 80: 60000, 60: 25000, 50: 12000, 40: 5000, 30: 900, 20: 150 };
/** Vehículos/día de un tramo: el aforo real de su calle si lo hay; si no, el estimado por su tipo (velocidad). */
function imdEstimada(vel, nombre) {
  if (nombre && AFOROS[nombre]) return AFOROS[nombre];
  if (IMD_POR_VELOCIDAD[vel] !== undefined) return IMD_POR_VELOCIDAD[vel];
  const v = Object.keys(IMD_POR_VELOCIDAD).map(Number).reduce((p, q) => (Math.abs(q - vel) < Math.abs(p - vel) ? q : p));
  return IMD_POR_VELOCIDAD[v];
}
// % del tráfico diario en cada hora (curvas típicas urbanas, laborable y fin de semana)
const LABORABLE = [0.9, 0.5, 0.4, 0.4, 0.6, 1.5, 3.8, 6.4, 7.0, 6.0, 5.6, 5.7, 6.0, 6.2, 6.0, 5.8, 6.1, 6.8, 7.0, 6.2, 4.6, 3.2, 2.3, 1.6];
const FESTIVO = [1.6, 1.1, 0.8, 0.6, 0.6, 0.8, 1.4, 2.4, 3.6, 5.0, 6.2, 6.8, 7.0, 6.8, 6.0, 5.6, 5.8, 6.2, 6.4, 6.0, 5.0, 3.8, 2.8, 2.0];
// Peatones: fuera de casa por la calle a la vez, para toda la maqueta, según la hora (orden de magnitud)
const PEATONES = [10, 5, 3, 2, 2, 5, 20, 70, 110, 120, 140, 160, 170, 150, 120, 120, 150, 190, 220, 210, 160, 100, 50, 20];
const MAX_COCHES = 1500, MAX_PERSONAS = 600;
const COLORES = [0xd64545, 0xf4f4f2, 0x2b2d33, 0x9aa3ad, 0x2f6fb0, 0xe0a030, 0x3e8a3a, 0xb8322f, 0xdcdcdc, 0x5a6470];
const ROPA = [0x2f6fb0, 0xd64545, 0x3e8a3a, 0xe0a030, 0x6b4c9a, 0x2b2d33, 0xf2f2f2, 0xc75b8a];

function crearTrafico(ctx, div) {
  const { THREE, D, SIM, S1, altura, t, numero, $ } = ctx;
  const G = crearGrafo(D);     // de rutas.js (misma red de calles)
  const enX = (x, z) => Math.floor((x - SIM.x0) / SIM.celda), enZ = (z) => Math.floor((z - SIM.z0) / SIM.celda);
  const calleDe = (x, z) => {
    const i = enX(x, z), j = enZ(z);
    return i >= 0 && j >= 0 && i < SIM.nx && j < SIM.ny ? D.calles[j * SIM.nx + i] : 0;
  };

  // Solo los tramos que están enteros encima de la maqueta (el grafo llega hasta 50 m fuera): en el borde, media vuelta
  const X0 = SIM.x0 + 2, X1 = SIM.x0 + SIM.nx * SIM.celda - 2, Z0 = SIM.z0 + 2, Z1 = SIM.z0 + SIM.ny * SIM.celda - 2;
  const dentro = (x, z) => x >= X0 && x <= X1 && z >= Z0 && z <= Z1;
  const enMapa = Uint8Array.from({ length: G.na }, (_, e) =>
    dentro(G.x[G.A[3 * e]], G.z[G.A[3 * e]]) && dentro(G.x[G.A[3 * e + 1]], G.z[G.A[3 * e + 1]]) ? 1 : 0);
  const usaCoche = (e) => G.vel[e] > 0 && enMapa[e] === 1;

  // ---------------------------------------------------------------- IMD de cada tramo
  const imd = new Float32Array(G.na);
  let conAforo = 0, total = 0;
  const nombresConAforo = new Set();
  for (let e = 0; e < G.na; e++) {
    if (!usaCoche(e)) continue;
    const a = G.A[3 * e], b = G.A[3 * e + 1], id = calleDe((G.x[a] + G.x[b]) / 2, (G.z[a] + G.z[b]) / 2);
    const nombre = id ? ctx.DATOS.calles[id - 1] : null;
    if (nombre && AFOROS[nombre]) nombresConAforo.add(nombre);
    imd[e] = imdEstimada(G.vel[e], nombre);
    total += imd[e] * G.largo[e];
  }
  conAforo = nombresConAforo.size;
  // «Vehículos/día por las calles»: veh·km/día entre la longitud de la red (una media ponderada por longitud)
  const largoRed = G.largo.reduce((s, l, e) => s + (usaCoche(e) ? l : 0), 0);
  const imdMedia = total / largoRed;

  // Coches que hay a la vez en cada tramo a una hora: q (veh/h) × largo / velocidad real (60 % del límite)
  // m/s: el 60 % de la de emergencia, y nunca más que el límite legal de la calle
  const velReal = (e) => Math.min(G.vel[e] * 0.6, G.limite[e] || 99) / 3.6;
  function esperados(pct) {
    const v = new Float32Array(G.na);
    for (let e = 0; e < G.na; e++) if (usaCoche(e)) v[e] = imd[e] * pct / 100 / 3600 * G.largo[e] / velReal(e);
    return v;
  }

  // ---------------------------------------------------------------- mallas (instancias)
  const geoCoche = new THREE.BoxGeometry(1.8, 1.4, 4.2);
  geoCoche.translate(0, 0.7, 0);
  const coches = new THREE.InstancedMesh(geoCoche, new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.6 }), MAX_COCHES);
  const geoPersona = new THREE.BoxGeometry(0.45, 1.7, 0.35);
  geoPersona.translate(0, 0.85, 0);
  const personas = new THREE.InstancedMesh(geoPersona, new THREE.MeshStandardMaterial({ flatShading: true }), MAX_PERSONAS);
  for (const m of [coches, personas]) {
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.castShadow = true;
    m.frustumCulled = false;
    m.count = 0;
    ctx.scene.add(m);
  }
  const color = new THREE.Color();
  for (let k = 0; k < MAX_COCHES; k++) coches.setColorAt(k, color.set(COLORES[k % COLORES.length]));
  for (let k = 0; k < MAX_PERSONAS; k++) personas.setColorAt(k, color.set(ROPA[(k * 7) % ROPA.length]));

  // ---------------------------------------------------------------- coches: siguen el grafo
  const lista = [];            // { e, desde (nodo de salida), s (m recorridos), v }
  const vecinosCoche = (n) => {
    const r = [];
    for (let p = G.inicio[n]; p < G.inicio[n + 1]; p++) if (usaCoche(G.arista[p])) r.push(p);
    return r;
  };
  let pesos = null, sumaPesos = 0;
  function tramoAlAzar() {     // proporcional a los coches esperados en cada tramo
    let r = Math.random() * sumaPesos;
    for (let e = 0; e < G.na; e++) if ((r -= pesos[e]) <= 0) return e;
    return 0;
  }
  function nuevoCoche() {
    const e = tramoAlAzar(), desde = Math.random() < 0.5 ? G.A[3 * e] : G.A[3 * e + 1];
    return { e, desde, s: Math.random() * G.largo[e], v: velReal(e) * (0.8 + 0.4 * Math.random()) };
  }
  function siguiente(c) {
    const llega = c.desde === G.A[3 * c.e] ? G.A[3 * c.e + 1] : G.A[3 * c.e];
    const opciones = vecinosCoche(llega).filter((p) => G.arista[p] !== c.e);
    if (!opciones.length) { c.desde = llega; c.s = 0; return; }        // calle sin salida: media vuelta
    // Gira hacia donde va más tráfico (las vías grandes se llevan más coches)
    let r = Math.random() * opciones.reduce((s, p) => s + imd[G.arista[p]], 0);
    let p = opciones[0];
    for (const q of opciones) if ((r -= imd[G.arista[q]]) <= 0) { p = q; break; }
    c.e = G.arista[p]; c.desde = llega; c.s = 0; c.v = velReal(c.e) * (0.8 + 0.4 * Math.random());
  }

  // ---------------------------------------------------------------- personas: por tramos a pie, en la acera
  const tramosPie = [], pesoPie = [];
  {
    const cerca = (x, z) => ctx.DATOS.servicios.concat(ctx.DATOS.equipamientos)
      .some((s) => (s.x - x) ** 2 + (s.z - z) ** 2 < 120 * 120);
    for (let e = 0; e < G.na; e++) {
      if (!G.pie[e] || G.vel[e] >= 60 || !enMapa[e]) continue;
      const a = G.A[3 * e], b = G.A[3 * e + 1];
      tramosPie.push(e);
      pesoPie.push(G.largo[e] * (G.vel[e] ? 1 : 2.5) * (cerca((G.x[a] + G.x[b]) / 2, (G.z[a] + G.z[b]) / 2) ? 2.5 : 1));
    }
  }
  const sumaPie = pesoPie.reduce((a, b) => a + b, 0);
  const gente = [];            // { e, ida, s, v, lado }
  /** Distancia al eje donde empieza la acera (sondeando la rejilla de 1 m), o 0 en caminos peatonales. */
  function ladoAcera(e, signo) {
    if (!G.vel[e]) return 0;
    const a = G.A[3 * e], b = G.A[3 * e + 1], l = G.largo[e] || 1;
    const nx = -(G.z[b] - G.z[a]) / l, nz = (G.x[b] - G.x[a]) / l, mx = (G.x[a] + G.x[b]) / 2, mz = (G.z[a] + G.z[b]) / 2;
    for (let d = 2; d <= 14; d++) {
      const i = Math.floor(mx + nx * d * signo - SIM.x0), j = Math.floor(mz + nz * d * signo - SIM.z0);
      if (i >= 0 && j >= 0 && i < S1.nx && j < S1.ny && D.suelo1m[j * S1.nx + i] === 1) return d + 0.8;
    }
    return 4;
  }
  function nuevaPersona() {
    let r = Math.random() * sumaPie, q = 0;
    while (q < tramosPie.length - 1 && (r -= pesoPie[q]) > 0) q++;
    const e = tramosPie[q], signo = Math.random() < 0.5 ? 1 : -1;
    return { e, ida: Math.random() < 0.5, s: Math.random() * G.largo[e], v: 1.1 + Math.random() * 0.5,
             lado: signo * ladoAcera(e, signo) };
  }

  // ---------------------------------------------------------------- cuántos, según la hora
  let activo = true, objetivoCoches = 0, objetivoGente = 0;
  try { activo = localStorage.getItem("trafico") !== "no"; } catch {}
  function recalcular() {
    const { fecha, hora } = ctx.hora();
    const festivo = fecha.getUTCDay() === 0 || fecha.getUTCDay() === 6;
    const curva = festivo ? FESTIVO : LABORABLE, suma = curva.reduce((a, b) => a + b, 0);
    const h0 = Math.floor(hora) % 24, f = hora - Math.floor(hora);
    const pct = 100 * (curva[h0] * (1 - f) + curva[(h0 + 1) % 24] * f) / suma;
    pesos = esperados(pct);
    sumaPesos = pesos.reduce((a, b) => a + b, 0);
    objetivoCoches = Math.min(MAX_COCHES, Math.round(sumaPesos));
    const lluvia = ctx.clima?.()?.lluvia > 0.1 ? 0.4 : 1;              // con lluvia, menos gente por la calle
    objetivoGente = Math.min(MAX_PERSONAS, Math.round((PEATONES[h0] * (1 - f) + PEATONES[(h0 + 1) % 24] * f) * (festivo ? 0.8 : 1) * lluvia));
    rotulos();
  }

  // ---------------------------------------------------------------- panel
  div.innerHTML = `<div style="display:flex;gap:6px;align-items:center;margin-top:6px">
    <span id="tfTexto" style="flex:1"></span><button id="tfBoton"></button></div>
    <div class="nota" id="tfNota" style="margin-top:2px"></div>`;
  function rotulos() {
    $("tfTexto").innerHTML = activo ? t("tfActivo", numero(objetivoCoches), numero(objetivoGente)) : t("tfApagado");
    $("tfBoton").textContent = t(activo ? "tfQuitar" : "tfPoner");
    $("tfNota").textContent = activo ? t("tfVolumen", numero(Math.round(imdMedia / 100) * 100),
                                         conAforo ? t("tfConAforos", conAforo) : "") : "";
  }
  $("tfBoton").onclick = () => {
    activo = !activo;
    try { localStorage.setItem("trafico", activo ? "si" : "no"); } catch {}
    if (!activo) { lista.length = gente.length = 0; coches.count = personas.count = 0; }
    rotulos();
  };

  // ---------------------------------------------------------------- cada fotograma
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), arriba = new THREE.Vector3(0, 1, 0);
  const p = new THREE.Vector3(), escala = new THREE.Vector3(1, 1, 1), nada = new THREE.Vector3(0, 0, 0);
  let espera = 0;
  recalcular();
  return {
    traducir: rotulos,
    recalcular,
    cadaFrame(dt) {
      if (!activo) return;
      espera -= dt;
      if (espera <= 0) { espera = 15; recalcular(); }
      // Ajuste suave al número que toca: unos pocos por fotograma
      for (let k = 0; k < 20 && lista.length < objetivoCoches; k++) lista.push(nuevoCoche());
      if (lista.length > objetivoCoches) lista.length = Math.max(objetivoCoches, lista.length - 10);
      for (let k = 0; k < 10 && gente.length < objetivoGente; k++) gente.push(nuevaPersona());
      if (gente.length > objetivoGente) gente.length = Math.max(objetivoGente, gente.length - 5);

      for (let k = 0; k < lista.length; k++) {
        const c = lista[k];
        c.s += c.v * dt;
        while (c.s >= G.largo[c.e]) { c.s -= G.largo[c.e]; siguiente(c); }
        const a = c.desde, b = c.desde === G.A[3 * c.e] ? G.A[3 * c.e + 1] : G.A[3 * c.e], l = G.largo[c.e] || 1;
        const dx = (G.x[b] - G.x[a]) / l, dz = (G.z[b] - G.z[a]) / l;
        // Por la derecha: 1,8 m a un lado del eje (más en las vías rápidas)
        const lado = G.vel[c.e] >= 60 ? 4 : 1.8;
        p.set(G.x[a] + dx * c.s - dz * lado, 0, G.z[a] + dz * c.s + dx * lado);
        p.y = altura(p.x, p.z) + 0.05;
        q.setFromAxisAngle(arriba, Math.atan2(dx, dz));
        // Sin choques con el coche que conduces: los que quedan encima no se dibujan
        const mio = ctx.cochePropio?.();
        const tapa = (mio && (mio.x - p.x) ** 2 + (mio.z - p.z) ** 2 < 36) || !dentro(p.x, p.z);
        coches.setMatrixAt(k, m.compose(p, q, tapa ? nada : escala));
      }
      coches.count = lista.length;
      coches.instanceMatrix.needsUpdate = true;

      for (let k = 0; k < gente.length; k++) {
        const g = gente[k], l = G.largo[g.e] || 1;
        g.s += g.v * dt;
        if (g.s >= l) { Object.assign(g, nuevaPersona(), { s: 0 }); }          // llega al final: aparece en otro sitio
        const a = g.ida ? G.A[3 * g.e] : G.A[3 * g.e + 1], b = g.ida ? G.A[3 * g.e + 1] : G.A[3 * g.e];
        const dx = (G.x[b] - G.x[a]) / l, dz = (G.z[b] - G.z[a]) / l, lado = g.ida ? g.lado : -g.lado;
        p.set(G.x[a] + dx * g.s - dz * lado, 0, G.z[a] + dz * g.s + dx * lado);
        p.y = altura(p.x, p.z) + 0.15 + Math.abs(Math.sin(g.s * 3)) * 0.06;  // un leve rebote al andar
        q.setFromAxisAngle(arriba, Math.atan2(dx, dz));
        personas.setMatrixAt(k, m.compose(p, q, dentro(p.x, p.z) ? escala : nada));     // la acera, fuera del mapa: no
      }
      personas.count = gente.length;
      personas.instanceMatrix.needsUpdate = true;
    },
  };
}

// FAROLAS: las del alumbrado público real (cartografía 1:1000 del AMB, obtener_farolas.py), de columna o de fachada.
// De noche la luminaria brilla y deja un charco de luz cálida en el suelo. Sin luces de verdad (cada una costaría
// mucho a la GPU): instancias de un poste, una luminaria y un disco con degradado que se suma a la imagen.

function crearFarolas(ctx, datos) {
  const { THREE, scene } = ctx;
  if (!datos || !datos.length) return { cadaFrame() {} };
  const n = datos.length / 3, ALTO = 6, ALTO_PARED = 4.5;
  const columnas = [];
  for (let k = 0; k < n; k++) if (datos[k * 3 + 2] === 0) columnas.push(k);

  const geoPoste = new THREE.CylinderGeometry(0.07, 0.11, ALTO, 5);
  geoPoste.translate(0, ALTO / 2, 0);
  const geoLuz = new THREE.BoxGeometry(0.32, 0.16, 0.7);
  const postes = new THREE.InstancedMesh(geoPoste, new THREE.MeshStandardMaterial({ color: 0x3b3f46, flatShading: true }), columnas.length);
  const matLuz = new THREE.MeshStandardMaterial({ color: 0xd8d8d0, emissive: 0xffc46b, emissiveIntensity: 0, flatShading: true });
  const luces = new THREE.InstancedMesh(geoLuz, matLuz, n);

  // Charco de luz: disco de 18 m con degradado; se suma (blending aditivo) y su fuerza depende de la noche
  const intensidad = { value: 0 };
  const charcos = new THREE.InstancedMesh(new THREE.PlaneGeometry(18, 18).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    uniforms: { intensidad },
    vertexShader: `varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float intensidad; varying vec2 vUv;
      void main() {
        float d = length(vUv - 0.5) * 2.0;
        float f = pow(clamp(1.0 - d, 0.0, 1.0), 1.8) * intensidad;
        if (f < 0.004) discard;
        gl_FragColor = vec4(vec3(1.0, 0.72, 0.38) * f * 0.55, 1.0);
      }`,
  }), n);

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), uno = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  let c = 0;
  for (let k = 0; k < n; k++) {
    const x = datos[k * 3] / 10, z = datos[k * 3 + 1] / 10, pared = datos[k * 3 + 2] === 1;
    const y = ctx.altura(x, z);
    // Orientación al azar pero fija (no se sabe hacia dónde mira cada brazo)
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), ((k * 2654435761) % 360) * Math.PI / 180);
    if (!pared) postes.setMatrixAt(c++, m.compose(p.set(x, y, z), q, uno));
    luces.setMatrixAt(k, m.compose(p.set(x, y + (pared ? ALTO_PARED : ALTO), z), q, uno));
    charcos.setMatrixAt(k, m.compose(p.set(x, y + 0.45, z), new THREE.Quaternion(), uno));
  }
  postes.castShadow = true;
  for (const o of [postes, luces, charcos]) { o.instanceMatrix.needsUpdate = true; scene.add(o); }
  charcos.frustumCulled = false;
  charcos.renderOrder = 3;
  charcos.visible = false;

  let ultima = -1;
  return {
    total: n,
    cadaFrame() {
      const noche = ctx.noche();
      if (Math.abs(noche - ultima) < 0.01) return;
      ultima = noche;
      matLuz.emissiveIntensity = 2.5 * noche;
      intensidad.value = noche;
      charcos.visible = noche > 0.01;
    },
  };
}

const GLSL_ACERAS = `
  uniform sampler2D tSuelo1m, tCapa1m, tCobertes;
  uniform vec2 uOrigen1m, uTam1m;
  uniform float uCapa1mActiva;
  // Cobertura del suelo (ICGC) bajo este punto: 0–5
  float cobertura() { return floor(texture2D(tCobertes, (vMundo.xz - uOrigen1m) / uTam1m).r * 255.0 + 0.5); }
  // Color del suelo sin calle ni acera según la cobertura (realista); 0 = el de la textura
  vec3 colorCobertura(vec3 c, float k, float g) {
    if (k > 4.5) return vec3(0.16, 0.30, 0.42);                         // agua
    if (k > 3.5) return vec3(0.46, 0.35, 0.24) * (0.88 + 0.24 * g);     // suelo desnudo, tierra
    if (k > 2.5) return vec3(0.16, 0.30, 0.13) * (0.85 + 0.3 * g);      // arbolado
    if (k > 1.5) return vec3(0.33, 0.48, 0.22) * (0.85 + 0.3 * g);      // prados, jardines, cultivos
    if (k > 0.5) return mix(c, vec3(0.62, 0.62, 0.61), 0.6) * (0.92 + 0.16 * g);   // urbano pavimentado
    return c;
  }
  // Lo mismo mezclando el color de las 4 celdas de 2 m vecinas: bordes suaves y sin escalones que bailan
  vec3 colorCoberturaSuave(vec3 c, float g) {
    vec2 T = uTam1m / 2.0, q = (vMundo.xz - uOrigen1m) / 2.0 - 0.5, b = floor(q), f = fract(q);
    vec3 r[4];
    for (int i = 0; i < 4; i++) {
      vec2 o = vec2(float(i - 2 * (i / 2)), float(i / 2));
      r[i] = colorCobertura(c, floor(texture2D(tCobertes, (b + o + 0.5) / T).r * 255.0 + 0.5), g);
    }
    return mix(mix(r[0], r[1], f.x), mix(r[2], r[3], f.x), f.y);
  }
  vec3 conCapa(vec3 c) {   // la capa de la herramienta abierta, encima del suelo
    vec4 k = texture2D(tCapa1m, (vMundo.xz - uOrigen1m) / uTam1m);
    return mix(c, k.rgb, k.a * uCapa1mActiva);

  // Grano aleatorio en celdas de 1/f m que se apaga (0,5) cuando una celda es más pequeña que un píxel: así no
  // chisporrotea de lejos al mover la cámara
  float grano(float f) {
    float g = fract(sin(dot(floor(vMundo.xz * f), vec2(12.9898, 78.233))) * 43758.5453);

/** Suelo realista: panot (la textura de las aceras peatonales) y asfalto con grano donde dicen los bordillos. */
function pintarAceras(material, panot) {
  material.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, uniformesAceras(), { tPanot: { value: panot } });
    s.vertexShader = "varying vec3 vMundo;\n" + s.vertexShader.replace(...VERTICE_MUNDO);
    s.fragmentShader = "varying vec3 vMundo;\nuniform sampler2D tPanot;\n" + GLSL_ACERAS + s.fragmentShader.replace(
      "#include <map_fragment>", `#include <map_fragment>
      {
        float t = tipoSuelo();
        // asfalto con grano, del mismo color medio que la textura de las calles (franja sin líneas) para que no se note
        // dónde acaba la cinta de la calle y empieza la calzada real pintada en el suelo
        if (t > 0.75) diffuseColor.rgb = vec3(0.085, 0.087, 0.096) * (0.85 + 0.3 * grano(3.0));
        else if (t > 0.25) diffuseColor.rgb = texture2D(tPanot, vec2(vMundo.x, -vMundo.z) / 2.0).rgb;   // panot
        else diffuseColor.rgb = colorCoberturaSuave(diffuseColor.rgb, grano(1.5));
        diffuseColor.rgb = conCapa(diffuseColor.rgb);
      }`);
  };
  material.customProgramCacheKey = () => "suelo-aceras";
  material.needsUpdate = true;
}

/** Cubiertas realistas: la capa de cubiertas de la herramienta abierta, encima de la textura. */

    Object.assign(s.uniforms, uniformesTechos());

    s.fragmentShader = "varying vec3 vMundo;\n" + GLSL_TECHOS + s.fragmentShader.replace(
      "#include <map_fragment>", "#include <map_fragment>\n diffuseColor.rgb = conTechos(diffuseColor.rgb);");
  };
  material.customProgramCacheKey = () => "techos";
  material.needsUpdate = true;
}

// Una geometría por tipo, repetida en la GPU: miles de árboles sin pesar en el GLB.
{
  const A = D.arboles, n = A.length / 5;
  const mat = (nombre, color) => Object.assign(
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(...color), flatShading: true, roughness: 0.95 }),
    { name: nombre });
  const formas = {
    tronco: [new THREE.CylinderGeometry(0.22, 0.3, 1, 3, 1, true), mat("tronco", [0.40, 0.26, 0.15])],
    pino: [new THREE.ConeGeometry(1, 1, 5, 1, true), mat("copa_pino", [0.18, 0.42, 0.24])],
    cono_copa: [new THREE.ConeGeometry(1, 1, 6, 1, true), mat("copa", [0.30, 0.58, 0.28])],
    cono_copa_clara: [new THREE.ConeGeometry(1, 1, 6, 1, true), mat("copa_clara", [0.50, 0.70, 0.30])],
    bola_copa: [new THREE.IcosahedronGeometry(1, 1), mat("copa", [0.30, 0.58, 0.28])],
    bola_copa_clara: [new THREE.IcosahedronGeometry(1, 1), mat("copa_clara", [0.50, 0.70, 0.30])],
    arbusto: [new THREE.IcosahedronGeometry(1, 0), mat("arbusto", [0.48, 0.58, 0.30])],
  };
  const matrices = Object.fromEntries(Object.keys(formas).map((k) => [k, []]));
  const m = new THREE.Matrix4();
  for (let k = 0; k < n; k++) {
    const x = A[k * 5] / 10, z = A[k * 5 + 1] / 10, tipo = DATOS.tiposArbol[A[k * 5 + 2]];
    const r = A[k * 5 + 3] / 100, alto = A[k * 5 + 4] / 100, y = altura(x, z);
    if (DATOS.arbolesReales) {
      // Árboles medidos con LiDAR: alto = altura total; la copa arriba y el tronco debajo, más grueso si es grande
      const q = new THREE.Quaternion(), grueso = THREE.MathUtils.clamp(r / 2.5, 0.8, 2.2);
      if (tipo === "arbusto") {
        matrices.arbusto.push(m.clone().compose(new THREE.Vector3(x, y + alto / 2, z), q, new THREE.Vector3(r, Math.max(alto / 2, 0.4), r)));
        continue;
      }
      const copa = tipo === "pino" ? alto * 0.6 : tipo.startsWith("cono") ? alto * 0.75 : Math.min(2 * r, alto * 0.7);
      const fuste = alto - copa;
      // Copa donde la midió el LiDAR: si el tronco se llevó a la acera, se inclina hacia ella (como en la calle)
      const dx = (D.copas?.[2 * k] ?? 0) / 10, dz = (D.copas?.[2 * k + 1] ?? 0) / 10;
      const eje = new THREE.Vector3(dx, fuste + 0.3, dz), largo = eje.length();
      const qt = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), eje.clone().normalize());
      matrices.tronco.push(m.clone().compose(new THREE.Vector3(x + dx / 2, y + (fuste + 0.3) / 2 - 0.25, z + dz / 2), qt,
                                             new THREE.Vector3(grueso, largo, grueso)));
      const forma = tipo === "pino" || tipo.startsWith("cono") ? new THREE.Vector3(r, copa, r) : new THREE.Vector3(r, copa / 2, r);
      matrices[tipo].push(m.clone().compose(new THREE.Vector3(x + dx, y + fuste + copa / 2, z + dz), q, forma));
      continue;
    }
    if (tipo !== "arbusto") {
      const ht = tipo === "pino" ? 2.5 : 2.1;
      matrices.tronco.push(m.clone().compose(new THREE.Vector3(x, y + ht / 2 - 0.25, z), new THREE.Quaternion(), new THREE.Vector3(1, ht, 1)));
    }
    let base = y + 1.6 + r, escala = new THREE.Vector3(r, r, r);
    if (tipo === "arbusto") base = y + 0.5;
    else if (tipo === "pino") { base = y + 1.6 + alto / 2; escala = new THREE.Vector3(r, alto, r); }
    else if (tipo.startsWith("cono")) { base = y + 1.4 + alto / 2; escala = new THREE.Vector3(r, alto, r); }
    matrices[tipo].push(m.clone().compose(new THREE.Vector3(x, base, z), new THREE.Quaternion(), escala));
  }
  for (const [tipo, lista] of Object.entries(matrices)) {
    if (!lista.length) continue;
    const malla = new THREE.InstancedMesh(formas[tipo][0], formas[tipo][1], lista.length);
    lista.forEach((mm, i) => malla.setMatrixAt(i, mm));
    malla.castShadow = true;
    malla.receiveShadow = true;
    scene.add(malla);
    mallasModelo.push(malla);
  }
}

// ------------------------------------------------------------ puentes: altura del tablero
// Encima de un puente (a menos de medio ancho de su eje) la altura que cuenta es la del tablero, no la del río.
const PUENTES = (DATOS.puentes || []).flatMap((b) => b.p.slice(1).map((q, k) => ({ a: b.p[k], b: q, r: b.ancho / 2 })));
function alturaSuelo(x, z) {
  for (const { a, b, r } of PUENTES) {
    const dx = b[0] - a[0], dz = b[1] - a[1], l2 = dx * dx + dz * dz || 1;
    const t = ((x - a[0]) * dx + (z - a[1]) * dz) / l2;
    if (t < 0 || t > 1) continue;
    const px = a[0] + dx * t - x, pz = a[1] + dz * t - z;
    if (px * px + pz * pz <= r * r) return Math.max(altura(x, z), a[2] + (b[2] - a[2]) * t);
  }
  return altura(x, z);
}

let vuelo = null;
const vista = { escala: 1 };     // > 1 con el teleobjetivo de la maqueta: la cámara va más lejos
function volarA(destino, distancia = 1) {
  const desplaz = new THREE.Vector3(180, 220, 260).multiplyScalar(distancia * vista.escala);
  destino.y = altura(destino.x, destino.z);
  vuelo = { t: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.999 : 0, desdeT: controls.target.clone(),
            desdeC: camera.position.clone(), haciaT: destino, haciaC: destino.clone().add(desplaz) };
}

// Rejilla de 1 m (D.suelo1m: 3 = edificio, de Catastro). El coche es un círculo de 8 puntos y el centro.
const enEdificio = (x, z) => {
  const i = Math.floor(x - SIM.x0), j = Math.floor(z - SIM.z0);
  return i >= 0 && i < S1.nx && j >= 0 && j < S1.ny && D.suelo1m[j * S1.nx + i] === 3;
};
function choca(x, z, radio) {
  if (enEdificio(x, z)) return true;
  for (let a = 0; a < 8; a++)
    if (enEdificio(x + radio * Math.cos(a * Math.PI / 4), z + radio * Math.sin(a * Math.PI / 4))) return true;
  return false;
}

function crearCoche() {
  const m = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.6, ...extra });
  const caja = (w, h, l, mat, x, y, z) => {
    const malla = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), mat);
    malla.position.set(x, y, z);
    malla.castShadow = true;
    return malla;
  };
  const grupo = new THREE.Group();
  grupo.rotation.order = "YXZ";                                  // rumbo, cabeceo, alabeo
  const rojo = m(0xd64545), cristal = m(0x2b3a4a, { roughness: 0.2 });
  grupo.add(caja(1.8, 0.6, 4.2, rojo, 0, 0.6, 0));              // carrocería
  grupo.add(caja(1.6, 0.55, 2.1, cristal, 0, 1.17, -0.25));     // cabina acristalada
  grupo.add(caja(1.64, 0.08, 1.9, rojo, 0, 1.47, -0.3));        // techo
  grupo.add(caja(1.82, 0.12, 0.25, m(0x333333), 0, 0.4, 2.1));  // parachoques
  for (const x of [-0.6, 0.6]) {
    grupo.add(caja(0.35, 0.15, 0.05, m(0xfff3b0, { emissive: 0xfff3b0, emissiveIntensity: 0.6 }), x, 0.68, 2.11));
    grupo.add(caja(0.35, 0.12, 0.05, m(0xff3030, { emissive: 0xff2020, emissiveIntensity: 0.5 }), x, 0.7, -2.11));
  }
  const ruedas = [];
  const geoRueda = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 10).rotateZ(Math.PI / 2);
  for (const [x, z] of [[-0.85, 1.35], [0.85, 1.35], [-0.85, -1.35], [0.85, -1.35]]) {
    const pivote = new THREE.Group();
    pivote.position.set(x, 0.38, z);
    const malla = new THREE.Mesh(geoRueda, m(0x222222));
    malla.castShadow = true;
    pivote.add(malla);
    grupo.add(pivote);
    ruedas.push({ pivote, malla, delantera: z > 0 });
  }
  return { grupo, ruedas };
}

/** Asa de las hojas (móvil): media pantalla → entera → plegada (solo el título). */
function ponerAsa(panel) {
  let asa = panel.querySelector(":scope > .asa");
  if (!asa) { asa = document.createElement("div"); asa.className = "asa"; panel.prepend(asa); }
  // Tocar: media → entera → plegada. Arrastrar: hacia arriba despliega, hacia abajo pliega (y sigue al dedo).
  const poner = (estado) => {
    panel.classList.toggle("mini", estado === "mini");
    panel.classList.toggle("completa", estado === "completa");
  };
  const estadoDe = () => (panel.classList.contains("mini") ? "mini" : panel.classList.contains("completa") ? "completa" : "media");
  let y0 = null, movido = false;
  asa.onpointerdown = (e) => {
    y0 = e.clientY; movido = false; panel.style.transition = "none";
    try { asa.setPointerCapture(e.pointerId); } catch {}
  };
  asa.onpointermove = (e) => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    if (Math.abs(dy) > 6) movido = true;
    if (movido) panel.style.transform = `translateY(${Math.max(dy, -40)}px)`;
  };
  asa.onpointerup = asa.onpointercancel = (e) => {
    if (y0 === null) return;
    const dy = e.clientY - y0, antes = estadoDe();
    y0 = null;
    panel.style.transform = panel.style.transition = "";
    if (!movido) return poner({ media: "completa", completa: "mini", mini: "media" }[antes]);
    if (dy < -40) poner(antes === "mini" ? "media" : "completa");
    else if (dy > 40) poner(antes === "completa" ? "media" : "mini");
  };
  asa.onclick = null;
  Object.assign(asa, { tabIndex: 0 });
  asa.setAttribute("role", "button");
  asa.onkeydown = (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    poner({ media: "completa", completa: "mini", mini: "media" }[estadoDe()]);
  };
}

const ADELANTE = new THREE.Vector3(), DERECHA = new THREE.Vector3(), ARRIBA = new THREE.Vector3(0, 1, 0);

// LÍMITE DE VELOCIDAD: el de la calle más cercana (tramos del grafo con coches a 12 m como mucho; el de OSM o el
// general: 30 km/h con un carril por sentido, 50 con dos). Fuera de las calles (plazas, caminos), 20 km/h. En un
