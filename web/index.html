};

const CLAVE = "ripollet-incidencias-ciudad";
const ESTADOS = ["abierta", "curso", "resuelta"];
const COLOR_ESTADO = { abierta: "#d62839", curso: "#f4a261", resuelta: "#2e9e54" };
// Igual que osm_ripollet.py: proyección equirrectangular en el centro de la maqueta
const LAT0 = (41.4935 + 41.5115) / 2, LON0 = (2.1470 + 2.1635) / 2;
const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110574;

const herramientaIncidencias = {
  id: "incid",
  textos: TEXTOS_INCIDENCIAS_CIUDAD,
  crear(ctx, div) {
    const { THREE, D, SIM, altura, t, tx, $ } = ctx;
    let lista = [], marcando = false, aviso = "";
    try { lista = JSON.parse(localStorage.getItem(CLAVE)) || []; } catch {}
    const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(lista)); } catch {} };
    const grupo = new THREE.Group();
    grupo.visible = false;
    ctx.scene.add(grupo);

    div.innerHTML = `<b data-t="icTitulo"></b>
      <label><span data-t="icTipo"></span> <select id="icTipo"></select></label>
      <label><span data-t="icNota"></span><br><input id="icNota" maxlength="200" style="width:100%"></label>
      <div class="botones"><button id="icMarcar"></button></div>
      <p id="icResumen"></p>
      <label><span data-t="icFiltro"></span> <select id="icFiltro"></select></label>
      <ul id="icLista" style="padding-left:0;list-style:none"></ul>
      <div class="botones"><button id="icCsv" data-t="icCsv"></button><button id="icJson" data-t="icJson"></button>
        <button id="icImportar" data-t="icImportar"></button></div>
      <input type="file" id="icArchivo" accept=".json,application/json" style="display:none">
      <p id="icAviso"></p>
      <p class="nota" data-t="icNotaPie"></p>`;

    const calleEn = (x, z) => {
      const i = Math.floor((x - SIM.x0) / SIM.celda), j = Math.floor((z - SIM.z0) / SIM.celda);
      const id = i >= 0 && j >= 0 && i < SIM.nx && j < SIM.ny ? D.calles[j * SIM.nx + i] : 0;
      return id ? ctx.DATOS.calles[id - 1] : "";
    };
    const gps = (x, z) => ({ lat: +(LAT0 + -z / KY).toFixed(6), lon: +(LON0 + x / KX).toFixed(6) });

    function marcas() {
      grupo.clear();
      for (const inc of visibles()) {
        const d = document.createElement("div");
        d.className = "etiqueta";
        d.style.borderLeft = `4px solid ${COLOR_ESTADO[inc.estado]}`;
        d.textContent = (tx("icTipos")[inc.tipo] ?? "❓").split(" ")[0];
        const o = new ctx.CSS2DObject(d);
        o.position.set(inc.x, altura(inc.x, inc.z) + 4, inc.z);
        grupo.add(o);
      }
    }
    const visibles = () => {
      const f = $("icFiltro").value || "todas";
      return lista.filter((i) => f === "todas" || (f === "abiertas" ? i.estado !== "resuelta" : i.tipo === f));
    };

    function rotulos() {
      const tipos = tx("icTipos"), estados = tx("icEstados");
      const tipo = $("icTipo").value || "bache", filtro = $("icFiltro").value || "todas";
      $("icTipo").innerHTML = Object.entries(tipos).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
      $("icFiltro").innerHTML = `<option value="todas">${t("icTodas")}</option><option value="abiertas">${t("icAbiertas")}</option>`
        + Object.entries(tipos).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
      $("icTipo").value = tipo; $("icFiltro").value = filtro;
      $("icMarcar").textContent = t(marcando ? "icMarcando" : "icMarcar");
      $("icMarcar").classList.toggle("principal", marcando);
      $("icResumen").textContent = lista.length
        ? t("icResumen", lista.length, lista.filter((i) => i.estado !== "resuelta").length) : t("icVacio");
      $("icLista").replaceChildren(...visibles().slice().reverse().map((inc) => {
        const li = document.createElement("li");
        li.dataset.x = 1;
        li.style.margin = "4px 0";
        // Texto escapado: las incidencias importadas vienen de un archivo de fuera
        const esc = (x) => String(x ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" })[c]);
        li.innerHTML = `<span style="color:${COLOR_ESTADO[inc.estado]}">●</span> ${esc(tipos[inc.tipo] ?? inc.tipo)} · `
          + `${esc(inc.calle) || "—"} · ${esc(String(inc.fecha ?? "").slice(0, 10))}${inc.nota ? " · " + esc(inc.nota) : ""} `;
        li.onclick = () => ctx.volarA(new THREE.Vector3(inc.x, 0, inc.z), 0.4);
        const estado = document.createElement("button");
        estado.textContent = estados[inc.estado];
        estado.onclick = (e) => {
          e.stopPropagation();
          inc.estado = ESTADOS[(ESTADOS.indexOf(inc.estado) + 1) % 3];
          cambio();
        };
        const borrar = document.createElement("button");
        borrar.textContent = t("icBorrar");
        borrar.onclick = (e) => { e.stopPropagation(); lista.splice(lista.indexOf(inc), 1); cambio(); };

        return li;
      }));
      $("icAviso").textContent = aviso;
      marcas();
    }
    const cambio = () => { guardar(); rotulos(); };

    function descargar(nombre, contenido, tipo) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
      a.download = nombre;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    const fecha = () => new Date().toISOString().slice(0, 10);
    $("icCsv").onclick = () => {
      const tipos = tx("icTipos"), estados = tx("icEstados");
      const celda = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const filas = [tx("icColumnas").join(";"), ...lista.map((i) => [i.id, tipos[i.tipo]?.replace(/^\S+ /, "") ?? i.tipo,
        estados[i.estado], i.fecha, i.calle, i.lat, i.lon, i.x, i.z, i.nota].map(celda).join(";"))];
      // BOM para que Excel lea bien los acentos; punto y coma, como lo espera en español y catalán
      descargar(`incidencias_ripollet_${fecha()}.csv`, "﻿" + filas.join("\r\n"), "text/csv;charset=utf-8");
    };
    $("icJson").onclick = () => descargar(`incidencias_ripollet_${fecha()}.json`,
      JSON.stringify({ tipo: "incidencias-ripollet", version: 1, incidencias: lista }, null, 1), "application/json");
    $("icImportar").onclick = () => $("icArchivo").click();
    $("icArchivo").onchange = async () => {
      const f = $("icArchivo").files[0];
      $("icArchivo").value = "";
      if (!f) return;
      let nuevas = [];
      try {
        const j = JSON.parse(await f.text());
        nuevas = (Array.isArray(j) ? j : j.incidencias || []).filter((i) =>
          i && typeof i.id === "string" && Number.isFinite(i.x) && Number.isFinite(i.z) && ESTADOS.includes(i.estado));
      } catch {}
      if (!nuevas.length) { aviso = t("icError"); return rotulos(); }
      const ids = new Map(lista.map((i) => [i.id, i]));
      for (const i of nuevas) ids.set(i.id, { ...ids.get(i.id), ...i });   // la importada manda
      lista = [...ids.values()];
      aviso = t("icImportadas", nuevas.length);
      cambio();
    };
    $("icMarcar").onclick = () => { marcando = !marcando; rotulos(); };
    $("icFiltro").onchange = rotulos;
    rotulos();

    return {
      alMostrar() { grupo.visible = true; rotulos(); },
      alOcultar() { grupo.visible = false; marcando = false; },
      alClic(x, z) {
        if (!marcando) return;
        marcando = false;
        aviso = "";
        lista.push({ id: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, tipo: $("icTipo").value,
                     estado: "abierta", fecha: new Date().toISOString(), calle: calleEn(x, z), ...gps(x, z),
                     x: Math.round(x * 10) / 10, z: Math.round(z * 10) / 10, nota: $("icNota").value.trim() });
        $("icNota").value = "";
        cambio();
      },
      traducir: rotulos,
    };
  },
};

const INDICADORES_VU = { indice: ["vuIndice", true], renta: ["vuRenta", false], mayores: ["vuMayores", true],
                      solos: ["vuSolos", true], poblacion: ["vuPoblacion", true] };    // [texto, ¿alto = peor?]
const RAMPA_VU = [[46, 158, 84], [160, 200, 60], [245, 190, 30], [240, 120, 30], [214, 40, 57]];
const colorVu = (f) => {
  const x = Math.min(0.999, Math.max(0, f)) * (RAMPA_VU.length - 1), i = Math.floor(x), t = x - i;
  return RAMPA_VU[i].map((c, q) => Math.round(c + (RAMPA_VU[i + 1][q] - c) * t));
};

const herramientaVulnerabilidad = {
  id: "vulner",
  textos: TEXTOS_VULNERABILIDAD,
  crear(ctx, div) {
    const { THREE, D, SIM, t, numero, $ } = ctx;
    const S = ctx.DATOS.secciones?.lista, rejilla = ctx.secciones4m;
    if (!S || !rejilla) { div.innerHTML = `<b data-t="vuTitulo"></b><p data-t="vuSinDatos"></p>`; return {}; }
    const n = SIM.nx * SIM.ny, capa = ctx.capa4m();

    // Edificios: sección (la de su primera celda) y centro
    const nEd = ctx.DATOS.edificios, secEd = new Uint8Array(nEd + 1), cx = new Float64Array(nEd + 1),
          cz = new Float64Array(nEd + 1), cc = new Uint32Array(nEd + 1);
    const centro = S.map(() => ({ x: 0, z: 0, c: 0 }));
    for (let k = 0; k < n; k++) {
      const i = k % SIM.nx, j = (k - i) / SIM.nx, x = SIM.x0 + (i + 0.5) * SIM.celda, z = SIM.z0 + (j + 0.5) * SIM.celda;
      const s = rejilla[k], b = D.edificios[k];
      if (s) { centro[s - 1].x += x; centro[s - 1].z += z; centro[s - 1].c++; }
      if (b) { if (!secEd[b]) secEd[b] = s; cx[b] += x; cz[b] += z; cc[b]++; }
    }
    // Cruces: agua a 60 mm/h (simulación física), sótanos, distancia a un refugio climático
    const iEsc = ctx.INTENSIDADES.indexOf(60), mmh = ctx.INTENSIDADES[iEsc];
    const inundados = ctx.FISICA[iEsc]
      ? edificiosAfectados(clasesDeProfundidad(Float32Array.from(ctx.FISICA[iEsc], (v) => v * 0.02), D.codigos), SIM, D.edificios)
      : new Set();
    const REFUGIO = /bibliot|c[ií]vic|casal|centre de dia|centre obert/i;
    const refugios = ctx.DATOS.equipamientos.filter((e) => e.tipo === "social" && REFUGIO.test(e.nombre));
    const cruce = S.map(() => ({ edificios: 0, agua: 0, sotanos: 0, lejos: 0 }));
    for (let b = 1; b <= nEd; b++) {
      if (!secEd[b] || !cc[b]) continue;
      const c = cruce[secEd[b] - 1], x = cx[b] / cc[b], z = cz[b] / cc[b];
      c.edificios++;
      if (inundados.has(b)) { c.agua++; if (ctx.SOTANOS?.[b - 1]) c.sotanos++; }
      if (!refugios.some((e) => (e.x - x) ** 2 + (e.z - z) ** 2 < 300 * 300)) c.lejos++;
    }

    // Etiquetas en el centro de cada sección (solo con el panel abierto)
    const etiquetas = new THREE.Group();
    etiquetas.visible = false;
    ctx.scene.add(etiquetas);
    const rotulosMapa = [];
    S.forEach((s, q) => {
      if (!centro[q].c) return;
      const d = document.createElement("div");
      d.className = "etiqueta";
      const o = new ctx.CSS2DObject(d);
      const x = centro[q].x / centro[q].c, z = centro[q].z / centro[q].c;
      o.position.set(x, ctx.altura(x, z) + 25, z);
      etiquetas.add(o);
      rotulosMapa.push({ d, q });
    });

    div.innerHTML = `<b data-t="vuTitulo"></b>
      <label><span data-t="vuVer"></span> <select id="vuVer"></select></label>
      <div class="leyenda" id="vuLeyenda"></div>
      <p class="nota" id="vuExplica"></p>
      <p id="vuFicha"></p>
      <details open><summary data-t="vuLista"></summary><ol id="vuLista"></ol></details>
      <p class="nota" id="vuNota"></p>`;
    let elegida = -1;
    const ver = () => $("vuVer").value || "indice";

    function pintar() {
      const clave = ver(), [, altoPeor] = INDICADORES_VU[clave];
      const vals = S.map((s) => s[clave]).filter((v) => v != null), lo = Math.min(...vals), hi = Math.max(...vals);
      const f = (v) => (v == null ? null : altoPeor ? (v - lo) / (hi - lo || 1) : (hi - v) / (hi - lo || 1));
      const C = capa.datos;
      C.fill(0);
      for (let k = 0; k < n; k++) {
        const s = rejilla[k];
        if (!s) continue;
        const v = f(S[s - 1][clave]);
        if (v == null) continue;
        const i = k % SIM.nx;
        const borde = (i > 0 && rejilla[k - 1] !== s) || (i < SIM.nx - 1 && rejilla[k + 1] !== s) ||
                      (k >= SIM.nx && rejilla[k - SIM.nx] !== s) || (k < n - SIM.nx && rejilla[k + SIM.nx] !== s);
        const c = colorVu(v);
        C.set(borde ? [30, 30, 40, 220] : [...c, s - 1 === elegida ? 170 : 105], k * 4);
      }
      capa.actualizar();
      for (const { d, q } of rotulosMapa) {
        const v = S[q][clave];
        d.textContent = `${S[q].codigo} · ${v == null ? "—" : clave === "renta" ? numero(v) + " €" : numero(v, clave === "indice" || clave === "poblacion" ? 0 : 1)}`;
      }
    }

    function ficha(q) {
      const s = S[q];
      $("vuFicha").innerHTML = t("vuFicha", s.codigo, numero(s.poblacion), numero(s.edad, 1), numero(s.mayores, 1),
        numero(s.menores, 1), numero(s.solos, 1), numero(s.renta), numero(s.rentaHogar), s.indice);
    }

    function rotulos() {
      const v = ver();
      $("vuVer").innerHTML = Object.entries(INDICADORES_VU).map(([k, [txt]]) => `<option value="${k}">${t(txt)}</option>`).join("");
      $("vuVer").value = v;
      $("vuLeyenda").innerHTML = `<span><i style="background:linear-gradient(90deg,${RAMPA_VU.map((c) => `rgb(${c})`).join(",")});width:80px"></i></span>`;
      $("vuExplica").textContent = t("vuExplica", S.length);
      $("vuNota").textContent = t("vuNota", ctx.DATOS.secciones.anio?.renta ?? "");
      const [, altoPeor] = INDICADORES_VU[v];
      const orden = S.map((s, q) => q).filter((q) => S[q][v] != null)
        .sort((a, b) => (altoPeor ? S[b][v] - S[a][v] : S[a][v] - S[b][v]));
      $("vuLista").replaceChildren(...orden.map((q) => {
        const s = S[q], c = cruce[q], li = document.createElement("li");
        li.dataset.x = 1;
        const valor = v === "renta" ? `${numero(s.renta)} €` : v === "indice" ? `${t("vuIndice").toLowerCase()} ${s.indice}`
          : numero(s[v], v === "poblacion" ? 0 : 1);
        const avisos = [t("vuMayoresN", numero(Math.round(s.poblacion * s.mayores / 100 / 10) * 10))];
        if (c.agua) avisos.push(t("vuAgua", c.agua, mmh, c.sotanos ? t("vuSotanos", c.sotanos) : ""));
        if (c.edificios && c.lejos / c.edificios > 0.25) avisos.push(t("vuLejos", Math.round(100 * c.lejos / c.edificios)));
        li.innerHTML = `<b>${t("vuSeccion", s.codigo)}</b> · ${t("vuFila", numero(s.poblacion), valor)}<br><small>${avisos.join(" · ")}</small>`;
        li.onclick = () => {
          elegida = q; ficha(q); pintar();
          if (centro[q].c) ctx.volarA(new THREE.Vector3(centro[q].x / centro[q].c, 0, centro[q].z / centro[q].c), 1.2);
        };
        return li;
      }));
      if (elegida >= 0) ficha(elegida); else $("vuFicha").textContent = t("vuClic");
    }
    $("vuVer").onchange = () => { rotulos(); pintar(); };

    return {
      alMostrar() { capa.malla.visible = etiquetas.visible = true; rotulos(); pintar(); },
      alOcultar() { capa.malla.visible = etiquetas.visible = false; },
      alClic(x, z) {
        const i = Math.floor((x - SIM.x0) / SIM.celda), j = Math.floor((z - SIM.z0) / SIM.celda);
        const s = i >= 0 && j >= 0 && i < SIM.nx && j < SIM.ny ? rejilla[j * SIM.nx + i] : 0;
        if (!s) return;
        elegida = s - 1; ficha(elegida); pintar();
      },
      traducir() { rotulos(); pintar(); },
    };
  },
};

      const cab = lineas[0].toLowerCase().split(sep).map((c) => c.trim());
      const col = (...n) => cab.findIndex((c) => n.includes(c));
      const iLat = col("latitud", "lat", "latitude"), iLon = col("longitud", "lon", "lng", "longitude");
      const iF = col("fecha", "data", "date"), iG = col("gravedad", "gravetat", "severity"), iN = col("nota", "notes");
      const nuevos = [];
      for (const l of lineas.slice(1)) {
        const c = l.split(sep), lat = parseFloat((c[iLat] ?? "").replace(",", ".")), lon = parseFloat((c[iLon] ?? "").replace(",", "."));
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        nuevos.push({ ...geoAxz(lat, lon), fecha: c[iF] ?? "", gravedad: c[iG] ?? "", nota: c[iN] ?? "" });
      }
      if (!nuevos.length) { $("svEstado").textContent = t("svError"); return; }
      propios = nuevos.filter((p) => dentro(p.x, p.z));
      try { localStorage.setItem(CLAVE_ACC, JSON.stringify(propios)); } catch {}
      rotulos(); pintar();
    };
    $("svBorrar").onclick = () => {
      propios = [];
      try { localStorage.removeItem(CLAVE_ACC); } catch {}
      rotulos(); pintar();
    };

    return {
      alMostrar() { capa.malla.visible = pines.visible = true; rotulos(); pintar(); },
      alOcultar() { capa.malla.visible = pines.visible = false; },
      traducir: rotulos,
    };
  },
};

const DIAS_OSM = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

/** ¿Abierto en (día 0–6, hora decimal)? Formatos habituales de opening_hours: «Mo-Fr 09:00-14:00,17:00-20:00;
 *  Sa 10:00-13:00», «24/7», «Mo-Su 08:00-22:00», «… off». Devuelve null si no se entiende. */
function abiertoAhora(horario, dia, hora) {
  if (!horario) return null;
  if (horario.trim() === "24/7") return true;
  let resultado = false, entendido = false;
  for (const regla of horario.split(";").map((r) => r.trim()).filter(Boolean)) {
    const m = /^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?,?)+)?\s*(.*)$/.exec(regla);
    if (!m) continue;
    let dias = new Set(m[1] ? [] : [0, 1, 2, 3, 4, 5, 6]);
    for (const tramo of (m[1] || "").split(",").filter(Boolean)) {
      const [a, b] = tramo.split("-").map((d) => DIAS_OSM.indexOf(d));
      if (a < 0) continue;
      for (let d = a; ; d = (d + 1) % 7) { dias.add(d); if (b === undefined || d === b) break; }
    }
    const resto = m[2].trim();
    if (/^(off|closed)$/i.test(resto)) { if (dias.has(dia)) resultado = false; entendido = true; continue; }
    const horas = [...resto.matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)];
    if (!horas.length) continue;
    entendido = true;
    if (!dias.has(dia)) continue;
    resultado = horas.some(([, h1, m1, h2, m2]) => {
      const a = +h1 + m1 / 60, b = +h2 + m2 / 60;
      return b > a ? hora >= a && hora < b : hora >= a || hora < b;     // pasado medianoche
    });
  }
  return entendido ? resultado : null;
}

const herramientaLugares = {

    let categoria = null, elegido = -1;

        return b;
      }));
      if (elegido >= 0) elegir(elegido); else $("luFicha").textContent = t("luClic");
    }
    $("luBuscar").oninput = actualizar;
    $("luAbierto").onchange = actualizar;

    return {
      alMostrar() { grupo.visible = true; rotulos(); actualizar(); },
      alOcultar() { grupo.visible = false; },

        if (ultimoCentro && ultimoCentro.distanceTo(ctx.controls.target) > 30) iconosCercanos();

        if (mejor >= 0) elegir(mejor);
      },

    };
  },
};

const ESCALA_TP = [[3, [46, 158, 84]], [5, [160, 200, 60]], [10, [245, 190, 30]], [Infinity, [214, 40, 57]]];
const PIE = 1.25;                       // m/s

const herramientaTransporte = {
  id: "transporte",
  textos: TEXTOS_TRANSPORTE,
  crear(ctx, div) {
    const { THREE, D, SIM, t, tx, numero, $ } = ctx;
    const T = ctx.transporte;
    if (!T) { div.innerHTML = `<b data-t="tpTitulo"></b><p>—</p>`; return {}; }
    const tipoDia = () => { const d = ctx.hora().fecha.getUTCDay(); return d === 0 ? "domingo" : d === 6 ? "sabado" : "laborable"; };
    const reloj = (m) => `${Math.floor(m / 60) % 24}:${String(m % 60).padStart(2, "0")}`;

    // ---------------------------------------------------------------- trazados (cintas de 2,5 m) y paradas
    const grupo = new THREE.Group();
    grupo.visible = false;
    ctx.scene.add(grupo);
    const dentroMapa = (x, z) => x > SIM.x0 + 2 && z > SIM.z0 + 2 && x < SIM.x0 + SIM.nx * SIM.celda - 2 && z < SIM.z0 + SIM.ny * SIM.celda - 2;
    const cintas = T.lineas.map((l, q) => {
      const pos = [];
      const desvio = (q - T.lineas.length / 2) * 0.45;      // separa un poco las líneas que van juntas
      for (const tr of l.trazos ?? [])
        for (let k = 0; k < tr.length - 1; k++) {
          const [x1, z1] = tr[k], [x2, z2] = tr[k + 1], L = Math.hypot(x2 - x1, z2 - z1) || 1;
          if (!dentroMapa(x1, z1) || !dentroMapa(x2, z2)) continue;          // nada fuera de la maqueta
          const nx = -(z2 - z1) / L, nz = (x2 - x1) / L, a = desvio - 1.2, b = desvio + 1.2;
          const y1 = ctx.altura(x1, z1) + 1.2, y2 = ctx.altura(x2, z2) + 1.2;
          pos.push(x1 + nx * a, y1, z1 + nz * a, x2 + nx * a, y2, z2 + nz * a, x2 + nx * b, y2, z2 + nz * b,
                   x1 + nx * a, y1, z1 + nz * a, x2 + nx * b, y2, z2 + nz * b, x1 + nx * b, y1, z1 + nz * b);
        }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: l.color, side: THREE.DoubleSide, transparent: true,
                                                                  opacity: 0.85, polygonOffset: true, polygonOffsetFactor: -3 }));
      m.renderOrder = 2;
      grupo.add(m);
      return m;
    });
    let parada = -1, linea = -1;
    T.paradas.forEach((p, q) => {
      const d = document.createElement("div");
      d.className = "marca";
      Object.assign(d.style, { background: "#fff", color: "#1d2230", border: "2px solid #1d2230", width: "22px", height: "22px", fontSize: "12px" });
      d.textContent = "🚏";
      d.title = p.n;
      d.onclick = () => elegir(q);
      const o = new ctx.CSS2DObject(d);
      o.position.set(p.x, ctx.altura(p.x, p.z) + 5, p.z);
      grupo.add(o);
    });

    // ---------------------------------------------------------------- cobertura a pie
    const G = crearGrafo(D), nodoPie = nodosDe(G, (e) => G.pie[e]);
    const porHora = (p, h) => p.s.laborable.filter(([m]) => m >= h * 60 && m < (h + 1) * 60).length;
    const frecuentes = T.paradas.filter((p) => porHora(p, 8) >= 4 || porHora(p, 7) >= 4);
    const minutos = (lista) => {
      const { t: tt } = tiempos(G, lista.map((p) => nodoCercano(G, p.x, p.z, nodoPie).nodo), (e) => (G.pie[e] ? G.largo[e] / PIE : Infinity));
      const r = new Map();
      for (const e of centrosEdificios(D, SIM, ctx.DATOS.edificios)) {
        const { nodo, distancia } = nodoCercano(G, e.x, e.z, nodoPie);
        r.set(e.b, (tt[nodo] + distancia / PIE) / 60);
      }
      return r;
    };
    const aCualquiera = minutos(T.paradas), aFrecuente = frecuentes.length ? minutos(frecuentes) : new Map();
    const viviendas = (b) => (ctx.rehab ? ctx.rehab[(b - 1) * 5 + 1] : 1);
    const pct = (mapa) => {
      let tot = 0, ok = 0;
      for (const [b, m] of aCualquiera) { const v = viviendas(b); tot += v; if ((mapa.get(b) ?? Infinity) <= 5) ok += v; }
      return Math.round(100 * ok / Math.max(1, tot));
    };
    const resumen = [pct(aCualquiera), pct(aFrecuente)];

    div.innerHTML = `<b data-t="tpTitulo"></b>
      <label><span data-t="tpVer"></span> <select id="tpVer"></select></label>
      <div class="leyenda" id="tpLeyenda"></div>
      <p id="tpResumen"></p><p id="tpParada"></p>

      <p class="nota" id="tpNota"></p>`;
    const ver = () => $("tpVer").value || "cualquiera";

    function pintar() {
      const v = ver(), C = ctx.capaTechos;
      C.datos.fill(0);

        const mapa = v === "frecuente" ? aFrecuente : aCualquiera;
        for (let j = 0; j < C.ny; j++)
          for (let i = 0; i < C.nx; i++) {
            const k = j * C.nx + i;
            if (!D.techos2m[k]) continue;
            const b = D.edificios[(j >> 1) * SIM.nx + (i >> 1)];
            if (!b || !mapa.has(b) && v !== "frecuente") continue;
            const m = mapa.get(b) ?? Infinity;
            C.datos.set([...ESCALA_TP.find(([lim]) => m <= lim)[1], 210], k * 4);
          }
      }
      C.actualizar();
      C.ver(v !== "nada");
      cintas.forEach((c, q) => { c.material.opacity = linea < 0 || linea === q ? 0.85 : 0.12; });
    }

    function elegir(q, volar = true) {
      parada = q;
      const p = T.paradas[q], dia = tipoDia(), { hora } = ctx.hora(), ahora = Math.floor(hora * 60);
      const prox = p.s[dia].filter(([m]) => m >= ahora && m < ahora + 120);
      const chip = (l) => `<span style="background:${T.lineas[l].color};color:#fff;border-radius:3px;padding:0 4px">${T.lineas[l].ref}</span>`;
      $("tpParada").innerHTML = t("tpParada", p.n, prox.filter(([m]) => m < ahora + 60).length) + " " + p.l.map(chip).join(" ") +

      $("tpNota").textContent = t("tpNota", tx("tpDias")[d], T.dias?.[d] ?? "");
      if (parada >= 0) elegir(parada, false); else $("tpParada").textContent = t("tpClic");
    }
    $("tpVer").onchange = pintar;

    return {
      alMostrar() { grupo.visible = true; rotulos(); pintar(); },
      alOcultar() { grupo.visible = false; ctx.capaTechos.ver(false); },
      alClic(x, z) {        // la parada más cercana al clic, a menos de 30 m
        let mejor = -1, dm = 30 * 30;
        T.paradas.forEach((p, q) => { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < dm) { dm = d; mejor = q; } });
        if (mejor >= 0) elegir(mejor);
      },
      traducir: rotulos,
    };

const RAMPA_DB = [[50, [46, 158, 84]], [55, [155, 211, 106]], [60, [242, 227, 76]], [65, [244, 162, 58]],
                  [70, [232, 89, 12]], [75, [201, 42, 42]], [Infinity, [123, 31, 162]]];
const colorDb = (db) => RAMPA_DB.find(([l]) => db < l)[1];
const COLOR_ZONA = { Alta: [46, 158, 84], Moderada: [245, 190, 30], Baixa: [214, 40, 57] };
const ESTACIONES = [["08252006", "Barberà del Vallès", 41.512684, 2.1253984], ["08125002", "Montcada i Reixac", 41.48197, 2.1882975],
                    ["08260010", "Santa Perpètua de Mogoda", 41.526722, 2.1838], ["08125013", "Montcada (Can Sant Joan)", 41.469826, 2.1842353]];

const herramientaAmbiente = {
  id: "ambiente",
  textos: TEXTOS_AMBIENTE,
  crear(ctx, div) {
    const { THREE, D, SIM, t, tx, numero, $ } = ctx;
    const ZA = ctx.DATOS.zonasAcusticas?.lista ?? [], Z4 = ctx.acustica4m;
    const capa = ctx.capa4m();
    const nx = SIM.nx, ny = SIM.ny, n = nx * ny, c = SIM.celda;
    const ld = new Float32Array(n).fill(NaN), lnoche = new Float32Array(n).fill(NaN);
    let listo = false;

    // ---------------------------------------------------------------- fuentes: tramos de coche dentro de la maqueta
    const G = crearGrafo(D);
    const suma = LABORABLE.reduce((a, b) => a + b, 0);
    const pDia = LABORABLE.slice(7, 21).reduce((a, b) => a + b, 0) / 14 / suma;
    const pNoche = [23, 0, 1, 2, 3, 4, 5, 6].reduce((a, h) => a + LABORABLE[h], 0) / 8 / suma;
    const dentro = (x, z) => x > SIM.x0 && z > SIM.z0 && x < SIM.x0 + nx * c && z < SIM.z0 + ny * c;
    const fuentes = [];        // trozos de ≤ 16 m: x1 z1 x2 z2, nivel a 10 m de día y de noche
    for (let e = 0; e < G.na; e++) {
      if (!G.vel[e]) continue;
      const a = G.A[3 * e], b = G.A[3 * e + 1];
      if (!dentro(G.x[a], G.z[a]) || !dentro(G.x[b], G.z[b])) continue;
      const xm = (G.x[a] + G.x[b]) / 2, zm = (G.z[a] + G.z[b]) / 2;
      const i = Math.floor((xm - SIM.x0) / c), j = Math.floor((zm - SIM.z0) / c), id = D.calles[j * nx + i];
      const imd = imdEstimada(G.vel[e], id ? ctx.DATOS.calles[id - 1] : null);
      const corr = 25 * Math.log10(Math.max(G.vel[e], 20) / 50);
      const l10d = 40 + 10 * Math.log10(Math.max(imd * pDia, 0.5)) + corr, l10n = 40 + 10 * Math.log10(Math.max(imd * pNoche, 0.2)) + corr;
      const trozos = Math.max(1, Math.ceil(G.largo[e] / 16));
      for (let k = 0; k < trozos; k++)
        fuentes.push([G.x[a] + (G.x[b] - G.x[a]) * k / trozos, G.z[a] + (G.z[b] - G.z[a]) * k / trozos,
                      G.x[a] + (G.x[b] - G.x[a]) * (k + 1) / trozos, G.z[a] + (G.z[b] - G.z[a]) * (k + 1) / trozos, l10d, l10n]);
    }
    // Cubos de 64 m para buscar solo las fuentes cercanas (150 m)
    const CUBO = 64, cx = Math.ceil(nx * c / CUBO), cz = Math.ceil(ny * c / CUBO), cubos = Array.from({ length: cx * cz }, () => []);
    fuentes.forEach((f, q) => {
      const i = Math.floor(((f[0] + f[2]) / 2 - SIM.x0) / CUBO), j = Math.floor(((f[1] + f[3]) / 2 - SIM.z0) / CUBO);
      if (i >= 0 && j >= 0 && i < cx && j < cz) cubos[j * cx + i].push(q);
    });
    const edificio = (x, z) => {
      const i = Math.floor((x - SIM.x0) / c), j = Math.floor((z - SIM.z0) / c);
      return i >= 0 && j >= 0 && i < nx && j < ny ? D.edificios[j * nx + i] : 0;
    };

    /** Ld y Ln en (x, z): suma de energía de los trozos a ≤ 150 m (fuente lineal finita + pantalla de edificios). */
    function nivel(x, z, propio) {
      let ed = 0, en = 0;
      const ci = Math.floor((x - SIM.x0) / CUBO), cj = Math.floor((z - SIM.z0) / CUBO);
      for (let dj = -3; dj <= 3; dj++)
        for (let di = -3; di <= 3; di++) {
          const i = ci + di, j = cj + dj;
          if (i < 0 || j < 0 || i >= cx || j >= cz) continue;
          for (const q of cubos[j * cx + i]) {
            const [x1, z1, x2, z2, l10d, l10n] = fuentes[q];
            const ax = x1 - x, az = z1 - z, bx = x2 - x, bz = z2 - z;
            const dx = x2 - x1, dz = z2 - z1, l2 = dx * dx + dz * dz || 1;
            const tt = Math.max(0, Math.min(1, -(ax * dx + az * dz) / l2));
            const px = ax + dx * tt, pz = az + dz * tt, d = Math.max(Math.hypot(px, pz), 5);
            if (d > 150) continue;
            const ang = Math.abs(Math.atan2(ax * bz - az * bx, ax * bx + az * bz));      // ángulo que abarca el trozo
            let g = (ang / Math.PI) * (10 / d);
            if (g < 1e-4) continue;
            // Pantalla: algún edificio (que no sea el propio) entre el punto y el trozo
            for (let s = 6; s < d - 3; s += 6) {
              const b = edificio(x + px * s / d, z + pz * s / d);
              if (b && b !== propio) { g *= 0.1; break; }
            }
            ed += g * 10 ** (l10d / 10); en += g * 10 ** (l10n / 10);
          }
        }
      return [ed > 0 ? 10 * Math.log10(ed) : 30, en > 0 ? 10 * Math.log10(en) : 25];
    }

    // Mapa a 8 m (una celda de cada 2 × 2) y fachadas: cada edificio, el máximo de las celdas libres que lo tocan
    const nEd = ctx.DATOS.edificios, fachadaD = new Float32Array(nEd + 1), fachadaN = new Float32Array(nEd + 1);
    async function calcular() {
      const filas = Math.ceil(ny / 2);
      for (let jj = 0; jj < filas; jj++) {
        for (let ii = 0; ii < Math.ceil(nx / 2); ii++) {
          const i = 2 * ii, j = 2 * jj, k = j * nx + i;
          if (D.edificios[k]) continue;
          const [a, b] = nivel(SIM.x0 + (i + 1) * c, SIM.z0 + (j + 1) * c, 0);
          for (const q of [k, k + 1, k + nx, k + nx + 1]) if (q < n && !D.edificios[q]) { ld[q] = a; lnoche[q] = b; }
          // Edificios vecinos (a ≤ 1 celda): esta es su fachada
          for (let dj = -1; dj <= 2; dj++)
            for (let di = -1; di <= 2; di++) {
              const ia = i + di, ja = j + dj;
              if (ia < 0 || ja < 0 || ia >= nx || ja >= ny) continue;
              const e = D.edificios[ja * nx + ia];
              if (e) { fachadaD[e] = Math.max(fachadaD[e], a); fachadaN[e] = Math.max(fachadaN[e], b); }
            }
        }
        if (jj % 12 === 0) {
          $("amEstado").textContent = t("amCalculando", Math.round(100 * jj / filas));
          await new Promise((r) => setTimeout(r));
        }
      }
      listo = true;
      $("amEstado").textContent = "";
      resumen();
      pintar();
    }

    // Objetivo de cada edificio: el de la zona de su primera celda
    const zonaEd = new Uint8Array(nEd + 1), celdaEd = new Int32Array(nEd + 1).fill(-1);
    for (let k = 0; k < n; k++) {
      const e = D.edificios[k];
      if (!e || celdaEd[e] >= 0) continue;
      celdaEd[e] = k;
      if (Z4) zonaEd[e] = Z4[k];
    }
    const viviendas = (e) => (ctx.rehab ? ctx.rehab[(e - 1) * 5 + 1] : 0);
    let peores = [], cuenta = [0, 0, 0];
    function resumen() {
      const porCalle = new Map();
      cuenta = [0, 0, 0];
      for (let e = 1; e <= nEd; e++) {
        const z = ZA[zonaEd[e] - 1];
        if (!z || !fachadaD[e]) continue;
        if (fachadaD[e] > z.ld) cuenta[0]++;
        if (fachadaN[e] > z.ln) {
          cuenta[1]++; cuenta[2] += viviendas(e);
          const k = celdaEd[e], id = k >= 0 ? D.calles[k] : 0;      // la calle de la celda del edificio
          const s = porCalle.get(id) ?? { n: 0, v: 0, k };
          s.n++; s.v += viviendas(e); porCalle.set(id, s);

    // ---------------------------------------------------------------- pintura
    const ver = () => $("amVer").value || "ln";
    function pintar() {
      const C = capa.datos, v = ver();
      C.fill(0);
      for (let k = 0; k < n; k++) {
        if (v === "zonas") {
          const z = Z4 && ZA[Z4[k] - 1];
          if (z) C.set([...COLOR_ZONA[z.zona] ?? [150, 150, 150], 110], k * 4);
          continue;
        }
        if (!listo || Number.isNaN(ld[k])) continue;
        if (v === "supera") {
          const z = Z4 && ZA[Z4[k] - 1];
          const exceso = z ? lnoche[k] - z.ln : NaN;
          if (exceso > 0) C.set([214, 40, 57, Math.round(80 + 15 * Math.min(10, exceso))], k * 4);
        } else C.set([...colorDb(v === "ld" ? ld[k] : lnoche[k]), 150], k * 4);
      }
      capa.actualizar();
      // Cubiertas de los edificios por encima del objetivo (de noche) en granate
      const T = ctx.capaTechos;
      T.datos.fill(0);
      if (listo && v !== "zonas")
        for (let j = 0; j < T.ny; j++)
          for (let i = 0; i < T.nx; i++) {
            const k = j * T.nx + i;
            if (!D.techos2m[k]) continue;
            const e = D.edificios[(j >> 1) * nx + (i >> 1)], z = ZA[zonaEd[e] - 1];
            if (z && fachadaN[e] > z.ln) T.datos.set([120, 0, 40, 200], k * 4);
          }
      T.actualizar();
    }

    // ---------------------------------------------------------------- aire (en directo)
    let aire = null, estaciones = null, errorAire = false;
    async function consultarAire() {
      try {
        const r = await fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=41.5025&longitude=2.1553" +
          "&current=european_aqi,pm10,pm2_5,nitrogen_dioxide,ozone&timezone=Europe%2FMadrid");
        aire = (await r.json()).current;
      } catch { errorAire = true; }
      try {
        const desde = new Date(Date.now() - 4 * 864e5).toISOString().slice(0, 10);
        const q = new URLSearchParams({ $where: `codi_eoi in(${ESTACIONES.map((e) => `'${e[0]}'`).join(",")}) AND data>='${desde}' ` +
          `AND contaminant in('NO2','PM10','O3')`, $limit: "500", $order: "data DESC" });
        const filas = await (await fetch("https://analisi.transparenciacatalunya.cat/resource/tasf-thgu.json?" + q)).json();
        estaciones = ESTACIONES.map(([codi, nombre, la, lo]) => {
          const ultimo = {};
          for (const f of filas.filter((f) => f.codi_eoi === codi)) {
            if (ultimo[f.contaminant]) continue;
            for (let h = 24; h >= 1; h--) {
              const v = f["h" + String(h).padStart(2, "0")];
              if (v !== undefined && v !== "") { ultimo[f.contaminant] = [+v, `${f.data.slice(8, 10)}/${f.data.slice(5, 7)} ${h}h`]; break; }
            }
          }

    }

    // ---------------------------------------------------------------- panel
    div.innerHTML = `<b data-t="amTitulo"></b>
      <label><span data-t="amVer"></span> <select id="amVer"></select></label>
      <div class="leyenda" id="amLeyenda"></div><p class="nota" id="amEstado"></p>
      <p id="amResumen"></p><p id="amPunto"></p>
      <details><summary data-t="amCalles"></summary><ol id="amCalles"></ol></details>
      <p><b data-t="amAire"></b></p><p id="amAire"></p><p id="amEstaciones" class="nota"></p><p class="nota" data-t="amOms"></p>
      <p class="nota" data-t="amNota"></p>`;
    function rotulos() {
      const v = ver();
      $("amVer").innerHTML = [["ln", "amLn"], ["ld", "amLd"], ["supera", "amSupera"], ["zonas", "amZonas"]]
        .map(([k, x]) => `<option value="${k}">${t(x)}</option>`).join("");
      $("amVer").value = v;
      const caja = (col, txt) => `<span><i style="background:rgb(${col.join(",")})"></i>${txt}</span>`;
      $("amLeyenda").innerHTML = v === "zonas"
        ? Object.entries(COLOR_ZONA).map(([z, col]) => caja(col, { Alta: "A (60/50)", Moderada: "B (65/55)", Baixa: "C (70/60)" }[z])).join("")
        : v === "supera" ? caja([214, 40, 57], t("amEncima"))
        : RAMPA_DB.map(([l, col], q) => caja(col, l === Infinity ? `≥ ${RAMPA_DB[q - 1][0]}` : `< ${l}`)).join("") + " dB(A)";
      if (listo) $("amResumen").innerHTML = t("amResumen", numero(cuenta[0]), numero(cuenta[1]), numero(cuenta[2]));
      $("amCalles").replaceChildren(...peores.map(([id, s]) => {
        const li = document.createElement("li");
        li.dataset.x = 1;
        li.textContent = t("amFila", ctx.nombreCalle(id), s.n, s.v);
        const i = s.k % nx, j = (s.k - i) / nx;
        li.onclick = () => ctx.volarA(new THREE.Vector3(SIM.x0 + (i + 0.5) * c, 0, SIM.z0 + (j + 0.5) * c), 0.45);
        return li;
      }));
      if (!$("amPunto").innerHTML) $("amPunto").textContent = t("amClic");
      const idx = (a) => tx("amIndices")[a < 20 ? 0 : a < 40 ? 1 : a < 60 ? 2 : a < 80 ? 3 : a < 100 ? 4 : 5];
      $("amAire").innerHTML = aire ? t("amAireModelo", Math.round(aire.european_aqi), idx(aire.european_aqi), numero(aire.pm2_5, 0),
        numero(aire.pm10, 0), numero(aire.nitrogen_dioxide, 0), numero(aire.ozone, 0)) : t(errorAire ? "amSinAire" : "amCargando");
      $("amEstaciones").innerHTML = estaciones ? `${t("amEstaciones")}:<br>` + estaciones.map((e) => t("amEstacion", e.nombre,
        numero(e.km, 1), Object.entries(e.ultimo).map(([k, [val, cuando]]) => `${k.replace("NO2", "NO₂").replace("O3", "O₃")} ${val} µg/m³ (${cuando})`)
          .join(" · ") || "—")).join("<br>") : "";
    }
    $("amVer").onchange = () => { rotulos(); pintar(); };

    let empezado = false;

const CON_TARJETA = new Set(["organica", "textil", "rebuig"]);
const COLOR_SECTOR = [null, [224, 112, 58], [46, 120, 200], [46, 158, 84], [160, 90, 180]];

/** Sector (1–4) en (x, z) según la rejilla de 4 m, o 0. */
function sectorEn(ctx, x, z) {
  const S = ctx.sectores4m, { SIM } = ctx;
  if (!S) return 0;
  const i = Math.floor((x - SIM.x0) / SIM.celda), j = Math.floor((z - SIM.z0) / SIM.celda);
  const s = i >= 0 && j >= 0 && i < SIM.nx && j < SIM.ny ? S[j * SIM.nx + i] : 0;
  return s > 4 ? s - 4 : s;        // 5–8: hueco del mapa, sector más cercano (probable)
}
/** ¿El sector de (x, z) es deducido (hueco del mapa del servicio)? */
function sectorProbable(ctx, x, z) {
  const S = ctx.sectores4m, { SIM } = ctx;
  const i = Math.floor((x - SIM.x0) / SIM.celda), j = Math.floor((z - SIM.z0) / SIM.celda);
  return !!S && i >= 0 && j >= 0 && i < SIM.nx && j < SIM.ny && S[j * SIM.nx + i] > 4;
}
/** Texto de la recogida de un día (0 = lunes) en un sector. */
function recogidaDia(ctx, sector, dia) {
  const { t, tx } = ctx, cal = ctx.residuos?.calendarios?.[sector], fr = tx("reFr");
  if (!cal) return "";
  const puerta = cal.puerta[dia];
  const lista = (l) => l.map((f) => fr[f]).join(" + ");
  if (!Object.keys(cal.puerta).length)
    return t("reContTodo", lista(cal.contenedor.filter((f) => CON_TARJETA.has(f))));
  return puerta ? t("rePuerta", lista(puerta)) : t("reNada");
}
/** Día de la semana (0 = lunes) de la hora que muestra el visor. */
const diaVisor = (ctx) => (ctx.hora().fecha.getUTCDay() + 6) % 7;

const herramientaResiduos = {
  id: "residuos",
  textos: TEXTOS_RESIDUOS,
  crear(ctx, div) {
    const { THREE, SIM, t, tx, numero, $ } = ctx;
    const R = ctx.residuos, S = ctx.sectores4m;
    if (!R || !S) { div.innerHTML = `<b data-t="reTitulo"></b><p>—</p>`; return {}; }
    const capa = ctx.capa4m();
    {   // sectores: color suave y borde
      const C = capa.datos, nx = SIM.nx;
      for (let k = 0; k < S.length; k++) {
        const s = S[k] > 4 ? S[k] - 4 : S[k], probable = S[k] > 4;
        if (!s) continue;
        const igual = (v) => (v > 4 ? v - 4 : v) === s, i = k % nx;
        const borde = (i > 0 && !igual(S[k - 1])) || (i < nx - 1 && !igual(S[k + 1])) ||
          (k >= nx && !igual(S[k - nx])) || (k < S.length - nx && !igual(S[k + nx]));
        C.set(borde ? [...COLOR_SECTOR[s].map((c) => c * 0.6), 230] : [...COLOR_SECTOR[s], probable ? 25 : 60], k * 4);
      }
      capa.actualizar();
    }
    // Contenedores con instancias (pequeños, baratos); áreas y buzones con icono
    const P = R.puntos, cont = P.filter((p) => p.tipo === "contenedor");
    const mallas = new THREE.InstancedMesh(new THREE.BoxGeometry(1.4, 1.4, 1.1).translate(0, 0.7, 0),
                                           new THREE.MeshStandardMaterial({ color: 0x8a5a2b, flatShading: true }), cont.length);
    const m = new THREE.Matrix4();
    cont.forEach((p, k) => mallas.setMatrixAt(k, m.makeTranslation(p.pos[0], ctx.altura(p.pos[0], p.pos[1]), p.pos[1])));
    const grupo = new THREE.Group();
    grupo.add(mallas);
    for (const p of P.filter((p) => p.tipo !== "contenedor")) {
      const d = document.createElement("div");
      d.className = "marca";
      Object.assign(d.style, { background: p.tipo === "area" ? "#2e9e54" : "#f08a3c", color: "#fff", width: "22px", height: "22px", fontSize: "12px" });
      d.textContent = p.tipo === "area" ? "♻" : "T";
      d.title = p.nombre;
      const o = new ctx.CSS2DObject(d);
      o.position.set(p.pos[0], ctx.altura(p.pos[0], p.pos[1]) + 5, p.pos[1]);
      grupo.add(o);
    }
    grupo.visible = false;
    ctx.scene.add(grupo);

    div.innerHTML = `<b data-t="reTitulo"></b>
      <div class="leyenda" id="reLeyenda"></div><p id="reFicha"></p>
      <p class="nota" data-t="reNota"></p>`;
    let punto = null;
    function ficha() {
      if (!punto) { $("reFicha").textContent = t("reClic"); return; }
      const [x, z] = punto, s = sectorEn(ctx, x, z);
      if (!s) { $("reFicha").textContent = t("reFuera"); return; }
      const cal = R.calendarios[s], dias = tx("reDias"), hoy = diaVisor(ctx), fr = tx("reFr");
      const filas = [t("reSector", s, cal.nombre) + (sectorProbable(ctx, x, z) ? t("reProbable") : ""), t("reHoy", dias[hoy], recogidaDia(ctx, s, hoy)),
                     t("reManana", dias[(hoy + 1) % 7], recogidaDia(ctx, s, (hoy + 1) % 7))];
      if (Object.keys(cal.puerta).length) {
        filas.push(t("reCont", cal.contenedor.map((f) => fr[f] + (CON_TARJETA.has(f) ? t("reTarjeta") : "")).join(", ")));
        filas.push(`<details><summary>${t("reSemana")}</summary>${dias.map((d, q) => `${d}: ${recogidaDia(ctx, s, q)}`).join("<br>")}</details>`);
      }
      const cerca = [];
      for (const [tipo, ley] of [["contenedor", "reLeyContenedor"], ["area", "reLeyArea"], ["textil", "reLeyTextil"]]) {
        const l = P.filter((p) => p.tipo === tipo);
        if (!l.length) continue;
        const p = l.reduce((a, b) => (Math.hypot(b.pos[0] - x, b.pos[1] - z) < Math.hypot(a.pos[0] - x, a.pos[1] - z) ? b : a));
        const extra = p.dias ? t("reAreaDias", p.dias.map((d) => dias[d].slice(0, 3)).join("·"), p.horas) : p.nombre;
        cerca.push(t("reDist", t(ley), numero(Math.round(Math.hypot(p.pos[0] - x, p.pos[1] - z) / 10) * 10), extra));
      }
      filas.push(`<b>${t("reCerca")}</b><br>${cerca.join("<br>")}`);
      $("reFicha").innerHTML = filas.join("<br>");
    }
    function rotulos() {
      const caja = (c, txt) => `<span><i style="background:rgb(${c.join(",")})"></i>${txt}</span>`;
      $("reLeyenda").innerHTML = [1, 2, 3, 4].map((s) => caja(COLOR_SECTOR[s], `${s}. ${R.calendarios[s].nombre}`)).join("") +
        caja([138, 90, 43], t("reLeyContenedor")) + caja([46, 158, 84], t("reLeyArea")) + caja([240, 138, 60], t("reLeyTextil"));
      ficha();
    }
    return {
      alMostrar() { capa.malla.visible = grupo.visible = true; rotulos(); },
      alOcultar() { capa.malla.visible = grupo.visible = false; },
      alClic(x, z) { punto = [x, z]; ficha(); },
      enlace: () => (punto ? { punto: punto.map(Math.round).join(",") } : {}),
      restaurar(params) { const p = params.get("punto")?.split(",").map(Number); if (p?.length === 2) { punto = p; ficha(); } },
      traducir: rotulos,
    };
  },
};

    mcAgua: "🌊 Aigua en pluges fortes", mcAguaNada: "Sense aigua acumulada a tocar de la façana ni amb 120 mm/h.",
    mcAguaSi: "Fins a {0} cm a tocar de la façana amb {1} mm/h", mcSotano: " · té soterrani o garatge (Cadastre)",
    mcEdificio: "🏢 Edifici", mcAnio: "construït el {0}", mcViv: "{0} habitatges", mcCert: "certificats energètics: {0}",
    mcSinCert: "sense certificats energètics", mcSolar: "☀️ Coberta", mcSolarTxt: "{0} kWh/m²·any de sol · podria produir ≈ {1} MWh/any ({2} kWp)",
    mcRuido: "🔊 Zona acústica", mcRuidoTxt: "{0}: objectiu {1} dB de dia i {2} dB de nit", mcSinZona: "sense zona acústica assignada",
    mcBarrio: "👥 Barri (secció censal {0})", mcBarrioTxt: "{0} veïns · {1} % de 65 anys o més · renda mitjana {2} €/persona · índex de vulnerabilitat {3}/100",
    mcCerca: "🚶 A peu des d'aquí", mcResiduos: "♻️ Recollida: sector {0} ({1})", mcHoy: "Avui: {0}", mcPlan: "🏛 Planejament", mcCoche: "🚑 Emergències en cotxe: {0} min ({1})",
    mcMin: "{0}: {1} min ({2})", mcLejos: "{0}: més de 30 min",
    mcCats: { educacion: "Escola", salud: "Centre de salut", comida: "Menjar", farmacia: "Farmàcia", bus: "Parada de bus",
            refugio: "Refugi climàtic" },
